name: Windows 安装冒烟

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - name: 构建 NSIS
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP "agent-taskboard.key"
          npm --prefix apps/desktop run tauri signer generate -- --ci --password "" --write-keys $key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TAURI_SIGNING_PRIVATE_KEY = $key
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          npm --prefix apps/desktop run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 安装并打开空壳
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup.exe was not built" }
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "installer exited with $($installer.ExitCode)" }

          $app = Get-ChildItem $env:LOCALAPPDATA -Filter "agent-taskboard.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) {
            Get-ChildItem $env:LOCALAPPDATA -Directory | Select-Object FullName
            throw "installed agent-taskboard.exe was not found"
          }
          Write-Host "Launching $($app.FullName)"
          $process = Start-Process -FilePath $app.FullName -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt += 1) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:10529/ -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "id=.(app).") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "desktop app did not open its empty shell on port 10529" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Taskboard-Windows-NSIS
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
