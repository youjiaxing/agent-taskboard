name: 浏览器完整验收

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要验收的分支、提交或标签，默认为当前默认分支
        required: false
        default: main
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: agent-taskboard-browser-e2e-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  browser:
    name: 完整浏览器验收
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npx --prefix apps/desktop playwright install chromium
      - name: 校验发布契约
        env:
          TEST_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$TEST_REF" == v* ]]; then
            RELEASE_TAG="$TEST_REF" npm --prefix apps/desktop run verify:release
          else
            npm --prefix apps/desktop run verify:release
          fi
      - run: npm --prefix apps/desktop run build
      - name: 运行浏览器测试并仅重试失败用例
        shell: bash
        env:
          ISSUE_100_SCREENSHOT_DIR: ${{ runner.temp }}/browser-artifacts/issue-100
          ISSUE_DOCUMENT_SCREENSHOT_DIR: ${{ runner.temp }}/browser-artifacts/issue-document
          VISUAL_DIFF_MAX_RATIO: "0.05"
          E2E_NAVIGATION_BUDGET_MS: "1000"
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/browser-artifacts"
          first_log="$artifact_dir/first-run.log"
          retry_log="$artifact_dir/failed-tests-retry.log"
          mkdir -p "$artifact_dir"

          set +e
          cargo test -p host-kernel --test board browser_ -- --test-threads=1 --nocapture 2>&1 | tee "$first_log"
          first_status=${PIPESTATUS[0]}
          set -e
          if [[ "$first_status" -eq 0 ]]; then
            exit 0
          fi

          failed_tests=()
          while IFS= read -r test_name; do
            failed_tests+=("$test_name")
          done < <(sed -nE 's/^test (.+) \.\.\. FAILED$/\1/p' "$first_log")
          if [[ "${#failed_tests[@]}" -eq 0 ]]; then
            {
              echo "### 浏览器验收首轮失败"
              echo
              echo "首轮命令失败，但无法从日志解析失败用例名称，未执行重试。"
              echo "请查看 workflow artifact 中的 \`first-run.log\`。"
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::浏览器验收首轮失败，但无法解析失败用例；未执行重试，请查看 workflow artifact。"
            exit "$first_status"
          fi

          {
            echo "### 浏览器验收首轮失败"
            echo
            echo "以下用例进入一次性重试："
            printf -- '- `%s`\n' "${failed_tests[@]}"
            echo
            echo "首轮日志和重试日志已作为 workflow artifact 上传。"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::warning::浏览器验收首轮有 ${#failed_tests[@]} 个失败用例，正在进行一次性重试。"

          retry_status=0
          : >"$retry_log"
          for test_name in "${failed_tests[@]}"; do
            echo "重试失败用例：$test_name" | tee -a "$retry_log"
            set +e
            cargo test -p host-kernel --test board "$test_name" -- \
              --exact --test-threads=1 --nocapture 2>&1 | tee -a "$retry_log"
            test_status=${PIPESTATUS[0]}
            set -e
            if [[ "$test_status" -ne 0 ]]; then
              retry_status=1
            fi
          done
          if [[ "$retry_status" -eq 0 ]]; then
            echo "::warning::浏览器验收首轮失败，但失败用例一次性重试后通过；请查看 workflow summary 和 artifact。"
          fi
          exit "$retry_status"
      - name: 上传浏览器验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore
