name: 发布桌面应用

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签，例如 v0.1.0
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.lock"

permissions:
  contents: write

concurrency:
  group: agent-taskboard-release-${{ github.event_name == 'push' && github.ref_type == 'branch' && 'main' || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备版本
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      tag: ${{ steps.prepare.outputs.tag }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prepare
        name: 生成版本提交或读取发布标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test -n "$INPUT_TAG"
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo "invalid release tag: $INPUT_TAG"
              exit 1
            }
            git fetch --tags --force
            if git show-ref --tags --verify --quiet "refs/tags/$INPUT_TAG"; then
              git checkout --detach "$INPUT_TAG"
            fi
            current=$(node -p 'require("./apps/desktop/package.json").version')
            test "$INPUT_TAG" = "v$current" || {
              echo "release tag $INPUT_TAG does not match app version v$current"
              exit 1
            }
            {
              echo "publish=true"
              echo "tag=$INPUT_TAG"
              echo "ref=$(git rev-parse HEAD)"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            {
              echo "publish=true"
              echo "tag=$GITHUB_REF_NAME"
              echo "ref=$(git rev-parse HEAD)"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --tags --force
          git checkout -B main origin/main

          # A manually-created release PR already has its own tag flow. Do not
          # create another patch release for that merge.
          if git log -1 --pretty=%B | grep -Eq 'chore\(release\):'; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(node -p 'require("./apps/desktop/package.json").version')
          latest_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)

          latest_release_complete=true
          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
            assets_json=$(gh release view "$latest_tag" --json isDraft,assets --jq '{draft:.isDraft,names:[.assets[].name]}' 2>/dev/null || echo '{"draft":true,"names":[]}')
            if [[ "$(jq -r '.draft' <<<"$assets_json")" == "false" ]] &&
              jq -e --arg version "$latest_version" '
                .names as $names |
                [
                  "latest.json",
                  "Agent.Taskboard_\($version)_darwin_aarch64.dmg",
                  "Agent.Taskboard_\($version)_darwin_aarch64.app.tar.gz",
                  "Agent.Taskboard_\($version)_darwin_aarch64.app.tar.gz.sig",
                  "Agent.Taskboard_\($version)_darwin_x64.dmg",
                  "Agent.Taskboard_\($version)_darwin_x64.app.tar.gz",
                  "Agent.Taskboard_\($version)_darwin_x64.app.tar.gz.sig",
                  "Agent.Taskboard_\($version)_windows_x64-setup.exe",
                  "Agent.Taskboard_\($version)_windows_x64-setup.exe.sig"
                ] | all(. as $asset | $names | index($asset) != null)
              ' <<<"$assets_json" >/dev/null; then
              latest_json="$RUNNER_TEMP/latest-$latest_version.json"
              if gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output "$latest_json" --clobber >/dev/null 2>&1 &&
                jq -e --arg prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$latest_tag/" '
                  .platforms | to_entries | all(.value.url | startswith($prefix))
                ' "$latest_json" >/dev/null; then
                latest_release_complete=true
              else
                latest_release_complete=false
              fi
            else
              latest_release_complete=false
            fi
          fi

          version=$(node apps/desktop/scripts/auto-release-version.mjs --next "$current" "$latest_tag" "$latest_release_complete")
          tag="v$version"

          if [[ "$version" != "$current" ]]; then
            node apps/desktop/scripts/auto-release-version.mjs "$version"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/Cargo.toml \
            crates/host-kernel/Cargo.toml \
            apps/desktop/package-lock.json \
            Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $version"
            git push origin HEAD:main
          fi

          {
            echo "publish=true"
            echo "tag=$tag"
            if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              echo "ref=$(git rev-list -n 1 "$tag")"
            else
              echo "ref=$(git rev-parse HEAD)"
            fi
          } >>"$GITHUB_OUTPUT"

  test:
    if: needs.prepare.outputs.publish == 'true'
    name: 快速发布门禁
    needs: prepare
    # Keep deterministic checks in the blocking release path. Full browser
    # journeys run in .github/workflows/browser-e2e.yml instead.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run verify:release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - run: npm --prefix apps/desktop run build
      - run: cargo check --workspace --all-targets
      - name: 运行核心测试
        shell: bash
        run: |
          set -euo pipefail

          cargo test --workspace --lib -- --test-threads=1
          targets=$(cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[]
            | select(.name == "host-kernel")
            | .targets[]
            | select(.kind | index("test"))
            | .name
            | select(. != "board")
          ')
          while IFS= read -r target; do
            test -n "$target"
            cargo test -p host-kernel --test "$target" -- --test-threads=1
          done <<<"$targets"

          # The board target mixes deterministic kernel projection tests with
          # real Chromium journeys. Keep the former in the fast gate.
          cargo test -p host-kernel --test board -- --skip browser_ --test-threads=1

  draft_release:
    if: needs.prepare.outputs.publish == 'true'
    name: 准备 Draft Release
    needs:
      - prepare
      - test
      - tag
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    runs-on: ubuntu-latest
    steps:
      - id: release
        name: 创建或复用 Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          releases_json=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/releases?per_page=100" | jq 'add')
          draft_ids=$(jq --arg tag "$TAG" '
            [.[] | select(.tag_name == $tag and .draft) | .id]
          ' <<<"$releases_json")
          published_count=$(jq --arg tag "$TAG" '
            [.[] | select(.tag_name == $tag and (.draft | not))] | length
          ' <<<"$releases_json")
          if [[ "$(jq length <<<"$draft_ids")" -gt 1 ]]; then
            echo "multiple draft releases found for $TAG"
            exit 1
          fi
          if [[ "$(jq length <<<"$draft_ids")" -eq 1 ]]; then
            echo "release_id=$(jq -r '.[0]' <<<"$draft_ids")" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$published_count" -ne 0 ]]; then
            echo "a published release already exists for $TAG"
            exit 1
          fi

          release_body=$(printf '%s\n' \
            '从本页下载适合当前电脑的安装包：' \
            '- macOS Apple Silicon：文件名含 `darwin`、`aarch64`，扩展名为 `.dmg`' \
            '- macOS Intel：文件名含 `darwin`、`x64`，扩展名为 `.dmg`' \
            '- Windows 10 1809 或更高版本：文件名含 `windows`、`x64`，以 `-setup.exe` 结尾' \
            '' \
            'macOS 安装包仅做 ad-hoc 签名，Windows 安装包未做代码签名。首次打开时系统会显示安全提醒。')
          release_json=$(gh api --method POST "repos/$REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="Agent Taskboard $version" \
            -f body="$release_body" \
            -F draft=true \
            -F prerelease=false)
          echo "release_id=$(jq -r '.id' <<<"$release_json")" >>"$GITHUB_OUTPUT"

  publish:
    if: needs.prepare.outputs.publish == 'true'
    name: ${{ matrix.name }}
    needs:
      - prepare
      - test
      - tag
      - draft_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run verify:release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft_release.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Agent.Taskboard_[version]_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}
      - name: 从 dmg 安装并原生启动
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find "target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_output=$(hdiutil attach "$dmg" -nobrowse -readonly)
          mount_point=$(printf '%s\n' "$mount_output" | awk '/\/Volumes\// {sub(/^.*\/Volumes\//, "/Volumes/"); print; exit}')
          test -d "$mount_point/Agent Taskboard.app"
          install_root="$RUNNER_TEMP/Applications"
          mkdir -p "$install_root"
          ditto "$mount_point/Agent Taskboard.app" "$install_root/Agent Taskboard.app"
          hdiutil detach "$mount_point"
          executable="$install_root/Agent Taskboard.app/Contents/MacOS/agent-taskboard"
          file "$executable"
          "$executable" >"$RUNNER_TEMP/agent-taskboard-${{ matrix.target }}.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:10529/ | grep -q 'id="app"'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/agent-taskboard-${{ matrix.target }}.log"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:10529/ >/dev/null
  tag:
    if: needs.prepare.outputs.publish == 'true'
    name: 创建发布标签
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - name: 自动版本创建标签
        env:
          EXPECTED_REF: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          expected=$(git rev-parse "$EXPECTED_REF")
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            actual=$(git rev-list -n 1 "$TAG")
            test "$actual" = "$expected" || {
              echo "tag $TAG points to $actual, expected $expected"
              exit 1
            }
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

  finalize-updater:
    if: needs.prepare.outputs.publish == 'true'
    name: 完成并公开 Release
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: 将 latest.json 指向公开 Release 下载地址
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          release_json=$(gh api --paginate --jq '.[] | select(.draft == true)' \
            "repos/$REPOSITORY/releases?per_page=100" |
            jq -s --arg tag "$TAG" '
              [.[] | select(.tag_name == $tag)] |
              if length == 1 then .[0]
              else error("expected one draft release for " + $tag + ", found \(length)")
              end
            ')
          release_id=$(jq -r '.id' <<<"$release_json")
          upload_url=$(jq -r '.upload_url' <<<"$release_json")
          upload_url="${upload_url%%\{*}"
          jq -e --arg version "$version" '
            [.assets[].name] as $names |
            [
              "Agent.Taskboard_\($version)_darwin_aarch64.dmg",
              "Agent.Taskboard_\($version)_darwin_aarch64.app.tar.gz",
              "Agent.Taskboard_\($version)_darwin_aarch64.app.tar.gz.sig",
              "Agent.Taskboard_\($version)_darwin_x64.dmg",
              "Agent.Taskboard_\($version)_darwin_x64.app.tar.gz",
              "Agent.Taskboard_\($version)_darwin_x64.app.tar.gz.sig",
              "Agent.Taskboard_\($version)_windows_x64-setup.exe",
              "Agent.Taskboard_\($version)_windows_x64-setup.exe.sig"
            ] | all(. as $asset | $names | index($asset) != null) and
              any($names[]; . == "latest.json" or startswith("latest.json.pending"))
          ' <<<"$release_json" >/dev/null

          pending_asset_ids=$(jq -r '
            .assets[]
            | select(.name == "latest.json.pending" or (.name | startswith("latest.json.pending.")))
            | .id
          ' <<<"$release_json")
          latest_asset=$(jq -ce '[.assets[] | select(.name == "latest.json")] | first // empty' <<<"$release_json" || true)
          source_asset="$latest_asset"
          if [[ -z "$source_asset" ]]; then
            source_asset=$(jq -ce '
              [.assets[] | select(.name == "latest.json.pending" or (.name | startswith("latest.json.pending.")))]
              | last // empty
            ' <<<"$release_json" || true)
          fi
          test -n "$source_asset"
          source_asset_id=$(jq -r '.id' <<<"$source_asset")
          gh api --header "Accept: application/octet-stream" \
            "repos/$REPOSITORY/releases/assets/$source_asset_id" >latest.json.source
          jq -e --arg version "$version" '.version == $version' latest.json.source >/dev/null
          jq -e --arg version "$version" '
            .version == $version and
            [
              "darwin-aarch64",
              "darwin-aarch64-app",
              "darwin-x86_64",
              "darwin-x86_64-app",
              "windows-x86_64",
              "windows-x86_64-nsis"
            ] as $platforms |
            .platforms as $entries |
            all($platforms[];
              . as $platform |
              ($entries[$platform].url // "") != "" and
              ($entries[$platform].signature // "") != ""
            )
          ' latest.json.source >/dev/null
          jq --arg tag "$TAG" --arg repository "$REPOSITORY" '
            (.version) as $version |
            .platforms |= with_entries(
              .value.url = ("https://github.com/" + $repository + "/releases/download/" + $tag + "/" +
                (if (.key | startswith("darwin-aarch64")) then "Agent.Taskboard_" + $version + "_darwin_aarch64.app.tar.gz"
                 elif (.key | startswith("darwin-x86_64")) then "Agent.Taskboard_" + $version + "_darwin_x64.app.tar.gz"
                 elif (.key | startswith("windows-x86_64")) then "Agent.Taskboard_" + $version + "_windows_x64-setup.exe"
                 else error("unsupported updater platform: " + .key)
                 end))
            )' latest.json.source > latest.json.tmp
          mv latest.json.tmp latest.json

          pending_name="latest.json.pending.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @latest.json \
            "$upload_url?name=$pending_name" >latest-pending-upload.json
          pending_asset_id=$(jq -r '.id' latest-pending-upload.json)

          if [[ -n "$latest_asset" ]]; then
            latest_asset_id=$(jq -r '.id' <<<"$latest_asset")
            gh api --method DELETE "repos/$REPOSITORY/releases/assets/$latest_asset_id" >/dev/null
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @latest.json \
            "$upload_url?name=latest.json" >latest-upload.json
          latest_asset_id=$(jq -r '.id' latest-upload.json)
          gh api --header "Accept: application/octet-stream" \
            "repos/$REPOSITORY/releases/assets/$latest_asset_id" >latest.json.verified
          jq -e --arg prefix "https://github.com/$REPOSITORY/releases/download/$TAG/" '
            [
              "darwin-aarch64",
              "darwin-aarch64-app",
              "darwin-x86_64",
              "darwin-x86_64-app",
              "windows-x86_64",
              "windows-x86_64-nsis"
            ] as $platforms |
            .platforms as $entries |
            all($platforms[];
              . as $platform |
              ($entries[$platform].url // "") | startswith($prefix)
            ) and
            all($platforms[];
              . as $platform |
              ($entries[$platform].signature // "") != ""
            )
          ' latest.json.verified >/dev/null
          while IFS= read -r old_pending_asset_id; do
            test -n "$old_pending_asset_id"
            gh api --method DELETE \
              "repos/$REPOSITORY/releases/assets/$old_pending_asset_id" >/dev/null
          done <<<"$pending_asset_ids"
          gh api --method DELETE \
            "repos/$REPOSITORY/releases/assets/$pending_asset_id" >/dev/null
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -F draft=false >/dev/null
