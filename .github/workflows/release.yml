name: 发布桌面应用

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签，例如 v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run verify:release
      - run: npm --prefix apps/desktop run build
      - run: cargo test

  publish:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run verify:release -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Agent Taskboard __VERSION__
          releaseBody: |
            从本页下载适合当前电脑的安装包：
            - macOS Apple Silicon：文件名含 `darwin`、`aarch64`，扩展名为 `.dmg`
            - macOS Intel：文件名含 `darwin`、`x64`，扩展名为 `.dmg`
            - Windows 10 1809 或更高版本：文件名含 `windows`、`x64`，以 `-setup.exe` 结尾

            macOS 安装包仅做 ad-hoc 签名，Windows 安装包未做代码签名。首次打开时系统会显示安全提醒。
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Agent.Taskboard_[version]_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}
