name: 发布桌面应用

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签，例如 v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npx --prefix apps/desktop playwright install chromium
      - run: npm --prefix apps/desktop run verify:release
      - run: npm --prefix apps/desktop run build
      - run: cargo test

  publish:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run verify:release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Agent Taskboard __VERSION__
          releaseBody: |
            从本页下载适合当前电脑的安装包：
            - macOS Apple Silicon：文件名含 `darwin`、`aarch64`，扩展名为 `.dmg`
            - macOS Intel：文件名含 `darwin`、`x64`，扩展名为 `.dmg`
            - Windows 10 1809 或更高版本：文件名含 `windows`、`x64`，以 `-setup.exe` 结尾

            macOS 安装包仅做 ad-hoc 签名，Windows 安装包未做代码签名。首次打开时系统会显示安全提醒。
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Agent.Taskboard_[version]_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}
      - name: 从 dmg 安装并原生启动
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find "target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_output=$(hdiutil attach "$dmg" -nobrowse -readonly)
          mount_point=$(printf '%s\n' "$mount_output" | awk '/\/Volumes\// {sub(/^.*\/Volumes\//, "/Volumes/"); print; exit}')
          test -d "$mount_point/Agent Taskboard.app"
          install_root="$RUNNER_TEMP/Applications"
          mkdir -p "$install_root"
          ditto "$mount_point/Agent Taskboard.app" "$install_root/Agent Taskboard.app"
          hdiutil detach "$mount_point"
          executable="$install_root/Agent Taskboard.app/Contents/MacOS/agent-taskboard"
          file "$executable"
          "$executable" >"$RUNNER_TEMP/agent-taskboard-${{ matrix.target }}.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:10529/ | grep -q 'id="app"'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/agent-taskboard-${{ matrix.target }}.log"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:10529/ >/dev/null
      - name: 从 NSIS 安装并原生启动
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $setup = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup.exe was not built" }
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "installer exited with $($installer.ExitCode)" }
          $app = Get-ChildItem $env:LOCALAPPDATA -Filter "agent-taskboard.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "installed agent-taskboard.exe was not found" }
          Write-Host "Launching $($app.FullName)"
          $process = Start-Process -FilePath $app.FullName -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt += 1) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:10529/ -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'id=.(app).') {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "installed app did not become ready on port 10529" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
