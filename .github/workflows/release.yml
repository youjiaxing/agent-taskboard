name: 发布桌面应用

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签，例如 v0.1.0
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.lock"

permissions:
  contents: write

concurrency:
  group: agent-taskboard-release-${{ github.event_name == 'push' && github.ref_type == 'branch' && 'main' || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备版本
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      tag: ${{ steps.prepare.outputs.tag }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prepare
        name: 生成版本提交或读取发布标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test -n "$INPUT_TAG"
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo "invalid release tag: $INPUT_TAG"
              exit 1
            }
            git fetch --tags --force
            if git show-ref --tags --verify --quiet "refs/tags/$INPUT_TAG"; then
              git checkout --detach "$INPUT_TAG"
            fi
            current=$(node -p 'require("./apps/desktop/package.json").version')
            test "$INPUT_TAG" = "v$current" || {
              echo "release tag $INPUT_TAG does not match app version v$current"
              exit 1
            }
            {
              echo "publish=true"
              echo "tag=$INPUT_TAG"
              echo "ref=$(git rev-parse HEAD)"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            {
              echo "publish=true"
              echo "tag=$GITHUB_REF_NAME"
              echo "ref=$(git rev-parse HEAD)"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --tags --force
          git checkout -B main origin/main

          # A manually-created release PR already has its own tag flow. Do not
          # create another patch release for that merge.
          if git log -1 --pretty=%B | grep -Eq 'chore\(release\):'; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(node -p 'require("./apps/desktop/package.json").version')
          latest_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)

          latest_release_complete=true
          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
            assets_json=$(gh release view "$latest_tag" --json isDraft,assets --jq '{draft:.isDraft,names:[.assets[].name]}' 2>/dev/null || echo '{"draft":true,"names":[]}')
            if [[ "$(jq -r '.draft' <<<"$assets_json")" == "false" ]] &&
              jq -e --arg version "$latest_version" '
                .names as $names |
                [
                  "latest.json",
                  "Agent.Taskboard_\($version)_darwin_aarch64.dmg",
                  "Agent.Taskboard_\($version)_darwin_aarch64.app.tar.gz",
                  "Agent.Taskboard_\($version)_darwin_aarch64.app.tar.gz.sig",
                  "Agent.Taskboard_\($version)_darwin_x64.dmg",
                  "Agent.Taskboard_\($version)_darwin_x64.app.tar.gz",
                  "Agent.Taskboard_\($version)_darwin_x64.app.tar.gz.sig",
                  "Agent.Taskboard_\($version)_windows_x64-setup.exe",
                  "Agent.Taskboard_\($version)_windows_x64-setup.exe.sig"
                ] | all(. as $asset | $names | index($asset) != null)
              ' <<<"$assets_json" >/dev/null; then
              latest_json="$RUNNER_TEMP/latest-$latest_version.json"
              if gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output "$latest_json" --clobber >/dev/null 2>&1 &&
                jq -e --arg prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$latest_tag/" '
                  .platforms | to_entries | all(.value.url | startswith($prefix))
                ' "$latest_json" >/dev/null; then
                latest_release_complete=true
              else
                latest_release_complete=false
              fi
            else
              latest_release_complete=false
            fi
          fi

          version=$(node apps/desktop/scripts/auto-release-version.mjs --next "$current" "$latest_tag" "$latest_release_complete")
          tag="v$version"

          if [[ "$version" != "$current" ]]; then
            node apps/desktop/scripts/auto-release-version.mjs "$version"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/Cargo.toml \
            crates/host-kernel/Cargo.toml \
            apps/desktop/package-lock.json \
            Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $version"
            git push origin HEAD:main
          fi

          {
            echo "publish=true"
            echo "tag=$tag"
            if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              echo "ref=$(git rev-list -n 1 "$tag")"
            else
              echo "ref=$(git rev-parse HEAD)"
            fi
          } >>"$GITHUB_OUTPUT"

  test:
    if: needs.prepare.outputs.publish == 'true'
    name: 测试
    needs: prepare
    # Keep the browser release gate on a known image with enough resources for
    # the concurrent Chromium contexts used by the recovery journeys.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npx --prefix apps/desktop playwright install chromium
      - run: npm --prefix apps/desktop run verify:release
      - run: npm --prefix apps/desktop run build
      # Browser journeys launch real Chromium processes and share constrained runner CPU.
      # Keep the release gate deterministic instead of weakening interaction/timing assertions.
      - name: 运行测试
        shell: bash
        run: |
          set -o pipefail
          # Browser journeys can occasionally time out on a hosted runner.
          # Require a complete second run before failing the release gate.
          cargo test -- --test-threads=1 || cargo test -- --test-threads=1
        env:
          # Cross-version macOS font rasterization differs while the explicit
          # geometry, overlap, overflow, and interaction assertions stay exact.
          VISUAL_DIFF_MAX_RATIO: "0.05"
          E2E_NAVIGATION_BUDGET_MS: "1000"

  publish:
    if: needs.prepare.outputs.publish == 'true'
    name: ${{ matrix.name }}
    needs:
      - prepare
      - test
      - tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run verify:release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Agent Taskboard __VERSION__
          releaseBody: |
            从本页下载适合当前电脑的安装包：
            - macOS Apple Silicon：文件名含 `darwin`、`aarch64`，扩展名为 `.dmg`
            - macOS Intel：文件名含 `darwin`、`x64`，扩展名为 `.dmg`
            - Windows 10 1809 或更高版本：文件名含 `windows`、`x64`，以 `-setup.exe` 结尾

            macOS 安装包仅做 ad-hoc 签名，Windows 安装包未做代码签名。首次打开时系统会显示安全提醒。
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Agent.Taskboard_[version]_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}
      - name: 从 dmg 安装并原生启动
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find "target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_output=$(hdiutil attach "$dmg" -nobrowse -readonly)
          mount_point=$(printf '%s\n' "$mount_output" | awk '/\/Volumes\// {sub(/^.*\/Volumes\//, "/Volumes/"); print; exit}')
          test -d "$mount_point/Agent Taskboard.app"
          install_root="$RUNNER_TEMP/Applications"
          mkdir -p "$install_root"
          ditto "$mount_point/Agent Taskboard.app" "$install_root/Agent Taskboard.app"
          hdiutil detach "$mount_point"
          executable="$install_root/Agent Taskboard.app/Contents/MacOS/agent-taskboard"
          file "$executable"
          "$executable" >"$RUNNER_TEMP/agent-taskboard-${{ matrix.target }}.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:10529/ | grep -q 'id="app"'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/agent-taskboard-${{ matrix.target }}.log"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:10529/ >/dev/null
  tag:
    if: needs.prepare.outputs.publish == 'true'
    name: 创建发布标签
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - name: 自动版本创建标签
        env:
          EXPECTED_REF: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          expected=$(git rev-parse "$EXPECTED_REF")
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            actual=$(git rev-list -n 1 "$TAG")
            test "$actual" = "$expected" || {
              echo "tag $TAG points to $actual, expected $expected"
              exit 1
            }
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

  finalize-updater:
    if: needs.prepare.outputs.publish == 'true'
    name: 固定 updater 下载地址
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: 将 latest.json 指向公开 Release 下载地址
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPOSITORY" --pattern latest.json --output latest.json --clobber
          jq --arg tag "$TAG" --arg repository "$REPOSITORY" '
            (.version) as $version |
            .platforms |= with_entries(
              .value.url = ("https://github.com/" + $repository + "/releases/download/" + $tag + "/" +
                (if (.key | startswith("darwin-aarch64")) then "Agent.Taskboard_" + $version + "_darwin_aarch64.app.tar.gz"
                 elif (.key | startswith("darwin-x86_64")) then "Agent.Taskboard_" + $version + "_darwin_x64.app.tar.gz"
                 elif (.key | startswith("windows-x86_64")) then "Agent.Taskboard_" + $version + "_windows_x64-setup.exe"
                 else error("unsupported updater platform: " + .key)
                 end))
            )' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json
          gh release upload "$TAG" latest.json --repo "$REPOSITORY" --clobber
