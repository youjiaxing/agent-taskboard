    function phoneIssue() {
      const i = issue(S.issueId);
      if (!i) return `<div class="empty pad">${esc(t("noIssueShort"))}</div>`;
      return issueDetail();
    }
    function phoneRun() {
      const i = issue(S.issueId);
      const r = selectedLiveRun() || run(S.runId);
      if (!r) {
        return `
          <div class="hd">Run</div>
          <div class="pad stack">
            <div class="muted">${i ? t("noIssueRun") : t("pickIssue")}</div>
            ${i && !i.closed ? launchOpenButton("issue") : ""}
            ${S.projectId ? launchOpenButton("free") : ""}
          </div>`;
      }
      const models = runModels(r);
      const mainModel = models[0];
      return `
        <div class="hd">Run · ${i ? "#" + i.id : t("free")}</div>
        ${models.length ? `
          <div class="pad" style="padding-bottom:0;">
            <div class="telemetry-capsule" data-act="toggle-phone-models" style="width:100%; justify-content:space-between; cursor:pointer;" title="点击展开/收起全部模型列表">
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="role-badge ${mainModel.role}">${esc(mainModel.roleLabel)}</span>
                <span class="telemetry-model-name">${esc(mainModel.model)}</span>
              </div>
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="telemetry-metric">${fmtTok(mainModel.total)} tok</span>
                ${models.length > 1 ? `<span class="tiny" style="color:var(--accent); font-weight:600;">+${models.length - 1} 模型 ${S.phoneModelListOpen ? "▴" : "▾"}</span>` : ""}
              </div>
            </div>
            ${S.phoneModelListOpen && models.length > 1 ? `
              <div class="stack phone-models-list" style="margin-top:6px; gap:5px; padding:8px; background:var(--card-bg); border-radius:6px; border:1px solid var(--border);">
                ${models.map(m => `
                  <div class="phone-model-item" style="display:flex; justify-content:space-between; align-items:center; font-size:11px;">
                    <div style="display:flex; align-items:center; gap:5px;">
                      <span class="role-badge ${m.role}" style="font-size:9.5px; padding:1px 5px;">${esc(m.roleLabel)}</span>
                      <span class="mono" style="font-weight:600;">${esc(m.model)}</span>
                    </div>
                    <span class="mono">${fmtTok(m.total)} tok</span>
                  </div>
                `).join("")}
              </div>
            ` : ""}
            <div class="tiny muted" style="margin-top:4px;">手机支持查看多模型 Token 列表；Sparkline 走势图请在电脑端查看。</div>
          </div>
        ` : ""}
        ${r.status === "active" ? `<div class="pad"><button data-act="ask-stop">${t("stopRun")}</button></div>` : ""}
        <div class="term" style="min-height:220px">${termText(r)}</div>
        <div class="banner">${t("phoneNote")}</div>`;
    }

    function bind() {
      const sw = document.getElementById("switcher");
      sw.onclick = (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        if (b.dataset.act === "prev" || b.dataset.act === "next") {
          stepVariant(b.dataset.act === "next" ? 1 : -1);
          render();
        }
        if (b.dataset.act === "refresh-variant" || b.dataset.act === "launch-variant") {
          setVariant(b.dataset.id);
          render();
        }
        if (b.dataset.act === "launch-fail-toggle") {
          S.launchFailNext = !S.launchFailNext;
          render();
        }
        if (b.dataset.act === "vp") {
          S.viewport = S.viewport === "desktop" ? "phone" : "desktop";
          render();
        }
        if (b.dataset.act === "inspect") {
          S.inspect = !S.inspect;
          render();
        }
      };
      sw.onchange = (e) => {
        if (e.target.dataset.act === "telemetry-scenario") {
          S.telemetryScenario = e.target.value;
          render();
        }
        if (e.target.dataset.act === "refresh-state") {
          S.refreshState = e.target.value;
          S.refreshOpen = false;
          render();
        }
        if (e.target.dataset.act === "usage-state") {
          S.usageState = e.target.value;
          S.usageRunId = null;
          S.usageSlice = null;
          if (S.usageState === "unreachable") {
            S.hostId = "office";
            S.projectId = null;
            S.issueId = null;
            S.runId = null;
          } else if (!host(S.hostId) || S.hostId === "office") {
            S.hostId = "local";
            S.projectId = "tb";
            S.issueId = 50;
            S.runId = "r1";
          }
          render();
        }
      };

      const app = document.getElementById("app");
      app.onclick = (e) => {
        if (e.target.classList && (e.target.classList.contains("launch-palette") || e.target.classList.contains("launch-modal-bg"))) {
          closeLaunch();
          render();
          return;
        }
        const b = e.target.closest("[data-act]");
        if (!b) return;
        const act = b.dataset.act;
        const id = b.dataset.id;
        if (act === "go-host-usage") {
          S.midMode = "usage";
          S.usageRunId = id ? `u-${id}` : null;
          S.usageTab = "runs";
          S.usageSheet = false;
          render();
          return;
        }
        if (act === "go-run-terminal") {
          const uRow = usageRow(id) || USAGE_ROWS.find(r => r.runId === id);
          const targetRun = RUNS.find(r => r.id === id) || (uRow ? {
            id,
            hostId: uRow.hostId,
            projectId: uRow.projectId,
            issueId: uRow.issueId,
            agent: uRow.agent,
            status: uRow.live ? "active" : "ended"
          } : null);
          if (targetRun) {
            S.hostId = targetRun.hostId;
            S.projectId = targetRun.projectId;
            S.issueId = targetRun.issueId;
            S.runId = targetRun.id;
            setMidMode("board");
            S.dockFolded.board = false;
            S.telemetryExpanded = true;
            S.telemetrySideOpen = true;
            render();
          }
          return;
        }
        if (act === "toggle-telemetry-expand") {
          S.telemetryExpanded = !S.telemetryExpanded;
          render();
          return;
        }
        if (act === "toggle-telemetry-side") {
          S.telemetrySideOpen = !S.telemetrySideOpen;
          render();
          return;
        }
        if (act === "toggle-telemetry-popover") {
          S.telemetryPopoverOpen = !S.telemetryPopoverOpen;
          render();
          return;
        }
        if (act === "telemetry-capsule") {
          if (S.variant === "B") S.telemetrySideOpen = true;
          else if (S.variant === "C") S.telemetryPopoverOpen = !S.telemetryPopoverOpen;
          else S.telemetryExpanded = !S.telemetryExpanded;
          render();
          return;
        }
        if (act === "toggle-phone-models") {
          S.phoneModelListOpen = !S.phoneModelListOpen;
          render();
          return;
        }
        if (act === "refresh-toggle") { S.refreshOpen = !S.refreshOpen; render(); return; }
        if (act === "refresh-now") { startManualRefresh(); return; }
        if (act === "refresh-settings") { S.refreshOpen = false; S.settingsOpen = true; render(); return; }
        if (act === "phone-context") { S.phoneContextOpen = !S.phoneContextOpen; render(); return; }
        if (act === "host") {
          S.hostId = id;
          S.mapDetailOpen = false;
          S.mapHostOpen = false;
          S.phoneContextOpen = false;
          const first = visibleProjects().find(p => p.hostId === id);
          S.projectId = first ? first.id : null;
          if (S.projectId) restoreMidForProject(S.projectId);
          else S.midMode = "board";
          const firstIssue = S.projectId ? ISSUES.find(i => i.projectId === S.projectId && !i.closed) : null;
          S.issueId = firstIssue ? firstIssue.id : null;
          const firstRun = RUNS.find(r => r.hostId === id && r.status !== "ended");
          S.runId = firstRun ? firstRun.id : null;
          render();
        }
        if (act === "project") {
          S.projectId = id; S.hostId = project(id).hostId; S.childFilter = null; S.mapDetailOpen = false; S.phoneContextOpen = false;
          if (S.midMode === "run") setMidMode("board");
          else restoreMidForProject(id);
          const cur = issue(S.issueId);
          if (!cur || cur.projectId !== id) S.issueId = null;
          render();
        }
        if (act === "issue") setIssue(Number(id), S.viewport !== "phone" && !!b.closest(".lanes"));
        if (act === "focus-run") {
          if (S.midMode === "overview" || S.ovReturn) openRunFromOverview(id);
          else {
            S.allRunsOpen = false;
            setRun(id, true);
            setMidMode("run");
            S.detailFolded = false;
            if (S.termZoom === "right") S.termZoom = null;
          }
          render();
        }
        if (act === "toggle-side") {
          S.sideFolded = !S.sideFolded;
          if (S.midMode === "run") S.autoFoldedForRun = false;
          render();
        }
        if (act === "toggle-detail") {
          S.detailFolded = !S.detailFolded;
          if (!S.detailFolded && S.termZoom === "right") S.termZoom = null;
          render();
        }
        if (act === "restore-dock" || act === "back-overview") {
          S.ovReturn = act === "back-overview" ? true : S.ovReturn;
          restoreFromRun();
          render();
        }
        if (act === "toggle-issue-wide") {
          S.issueWide = !S.issueWide;
          if (S.issueWide) {
            S.detailFolded = false;
            if (S.termZoom === "right") S.termZoom = null;
          }
          render();
        }
        if (act === "toggle-recent-more") { S.recentMore = !S.recentMore; render(); }
        if (act === "term-theme") { S.termTheme = S.termTheme === "light" ? "dark" : "light"; render(); }
        if (act === "graph-node") {
          if (issue(Number(id))) setIssue(Number(id));
        }
        if (act === "run") { S.allRunsOpen = false; setRun(id); }
        if (act === "toggle-vc") { S.viewChangesOpen = !S.viewChangesOpen; render(); }
        if (act === "base") { S.viewBase = id; render(); }
        if (act === "file") { S.fileKey = id; S.noteLine = null; render(); }
        if (act === "note-line") { S.noteLine = Number(id); render(); }
        if (act === "save-note") {
          const r = run(S.runId);
          const files = FILES[r.id] || [];
          const file = files.find(f => f.path === S.fileKey) || files[0];
          if (file && S.noteLine && S.noteDraft.trim()) {
            S.notes.push({ runId: r.id, repo: file.repo, file: file.path, line: S.noteLine, text: S.noteDraft.trim() });
            S.noteDraft = "";
            S.noteLine = null;
          }
          render();
        }
        if (act === "del-note") { S.notes.splice(Number(id), 1); render(); }
        if (act === "pair") { S.pairing = true; render(); }
        if (act === "close-pair") { S.pairing = false; render(); }
        if (act === "fake-paired") { S.pairing = false; S.scenario = "daily"; applyScenario("daily"); render(); }
        if (act === "ask-stop") {
          if (run(S.runId) && run(S.runId).status === "active") S.stopAsk = true;
          render();
        }
        if (act === "close-stop") { S.stopAsk = false; render(); }
        if (act === "stop-soft" || act === "stop-hard") {
          const r = run(S.runId);
          if (r && r.status === "active") {
            r.status = "stopped";
            const i = r.issueId ? issue(r.issueId) : null;
            if (i) i.stopped = true;
          }
          S.stopAsk = false;
          render();
        }
        if (act === "phone") {
          S.phone = id;
          if (id === "home" && (S.midMode === "overview" || S.midMode === "usage")) setMidMode("board");
          if (id === "home") S.usageSheet = false;
          render();
        }
        if (act === "settings") { S.settingsOpen = !S.settingsOpen; S.allRunsOpen = false; render(); }
        if (act === "theme") { setTheme(id); render(); }
        if (act === "appearance") { toggleAppearance(); render(); }
        if (act === "auto-master") { S.autoMaster = id === "on"; render(); }
        if (act === "cmd-preview") { S.cmdPreview = id === "on"; render(); }
        if (act === "auto-advance") { if (S.autoMaster) patchProjAuto(S.projectId, { on: id === "on" }); render(); }
        if (act === "cold-resume") { if (S.autoMaster) patchProjAuto(S.projectId, { coldResume: id === "on" }); render(); }
        if (act === "all-runs") {
          S.allRunsOpen = false;
          S.settingsOpen = false;
          S.termZoom = null;
          setMidMode("overview");
          render();
        }
        if (act === "lang") {
          S.lang = id === "en" || id === "zh" ? id : (S.lang === "zh" ? "en" : "zh");
          render();
        }
        if (act === "direction") { setDirection(id); render(); }
        if (act === "map-nav") {
          if (id === "settings") { S.settingsOpen = true; S.allRunsOpen = false; }
          else if (id === "runs") { setMidMode("overview"); S.settingsOpen = false; S.allRunsOpen = false; }
          else if (id === "board") { setMidMode("board"); S.settingsOpen = false; S.allRunsOpen = false; }
          else { S.settingsOpen = false; S.allRunsOpen = false; }
          render();
        }
        if (act === "mid-mode") {
          if (id === "overview") { S.termZoom = null; if (S.variant === "C") S.usageTab = "runs"; }
          if (id === "board" && S.midMode === "run" && !S.ovReturn) restoreFromRun();
          else setMidMode(id);
          if (S.viewport === "phone") S.phone = id === "overview" ? "overview" : id === "usage" ? "usage" : "home";
          render();
        }
        if (act === "usage-open") {
          S.usageSheet = true;
          if (S.viewport === "phone") S.phone = "usage";
          render();
        }
        if (act === "usage-close") {
          S.usageSheet = false;
          if (S.viewport === "phone" && S.phone === "usage") S.phone = "home";
          render();
        }
        if (act === "usage-sheet-inner") return;
        if (act === "usage-range") {
          S.usageRange = id;
          S.usageRunId = null;
          S.usageMore = false;
          if (id === "custom") usageEnsureCustom();
          render();
        }
        if (act === "usage-b-range") {
          S.usageFilter.range = id;
          S.usageRunId = null;
          if (id === "custom") usageEnsureCustom();
          render();
        }
        if (act === "usage-b-project") { S.usageFilter.project = id; S.usageRunId = null; render(); }
        if (act === "usage-b-agent") { S.usageFilter.agent = id; S.usageRunId = null; render(); }
        if (act === "usage-b-model") { S.usageFilter.model = id; S.usageRunId = null; render(); }
        if (act === "usage-break") { S.usageBreak = id; S.usageSlice = null; render(); }
        if (act === "usage-slice") {
          S.usageSlice = !id || id === "all" ? null : { kind: b.dataset.kind || "project", id };
          S.usageRunId = null;
          render();
        }
        if (act === "usage-slice-clear") { S.usageSlice = null; render(); }
        if (act === "usage-run") { S.usageRunId = S.usageRunId === id ? null : id; render(); }
        if (act === "usage-acct") { S.usageAcct = S.usageAcct === id ? null : id; render(); }
        if (act === "usage-more") { S.usageMore = true; render(); }
        if (act === "usage-tab") {
          S.usageTab = id;
          S.midMode = "overview";
          if (S.viewport === "phone") S.phone = "overview";
          render();
        }
        if (act === "ov-run") {
          openRunFromOverview(id);
          render();
        }
        if (act === "ov-step") {
          const cur = overviewCursor();
          const next = id === "next" ? cur.next : cur.prev;
          if (next) openRunFromOverview(next.id);
          render();
        }
        if (act === "ov-proj") {
          if (id === "all") S.ovFilter = [];
          else {
            const has = S.ovFilter.includes(id);
            S.ovFilter = has ? S.ovFilter.filter(x => x !== id) : S.ovFilter.concat(id);
            if (S.ovFilter.length === hostProjects().length) S.ovFilter = [];
          }
          render();
        }
        if (act === "ov-ended") { S.ovShowEnded = !S.ovShowEnded; render(); }
        if (act === "toggle-ctx") { S.showCtx = !S.showCtx; S.cam.user = false; render(); }
        if (act === "reset-cam") { S.cam.user = false; render(); }
        if (act === "toggle-dock") {
          S.dockFolded[S.midMode] = !dockFolded();
          render();
        }
        if (act === "map-search") { S.mapSearchOpen = !S.mapSearchOpen; render(); }
        if (act === "map-host-menu") { S.mapHostOpen = !S.mapHostOpen; render(); }
        if (act === "map-close-detail") { S.mapDetailOpen = false; render(); }
        if (act === "map-notify" || act === "map-nav-back" || act === "map-nav-fwd") {
          alert("原型：入口占位。");
        }
        if (act === "child-filter") { S.childFilter = Number(id); setMidMode("board"); render(); }
        if (act === "clear-filter") { S.childFilter = null; render(); }
        if (act === "term-zoom") { setTermZoom(id || null); return; }
        if (act === "swap-run") {
          if (S.lastRunId) setRun(S.lastRunId);
          return;
        }
        if (act === "register") { alert("原型：登记入口在这里。不真的加 Project。"); }
        if (act === "open-launch") {
          openLaunch(b.dataset.kind === "free" ? "free" : "issue", S.issueId);
        }
        if (act === "launch-cancel") { closeLaunch(); render(); }
        if (act === "launch-agent") { applyLaunchAgent(id); render(); }
        if (act === "launch-back-picker") { S.launch.step = "picker"; render(); }
        if (act === "launch-fold") { S.launch.extraOpen = !S.launch.extraOpen; render(); }
        if (act === "launch-intent") { S.launch.intent = id; render(); }
        if (act === "launch-iso") { S.launch.isolation = b.checked; render(); }
        if (act === "launch-bool") { S.launch.values[b.dataset.key] = b.checked; render(); }
        if (act === "launch-commit") { commitLaunch(); render(); }
        if (act === "fake-start") {
          openLaunch("issue", S.issueId);
        }
        if (act === "fake-claim") {
          const cur = issue(S.issueId);
          if (!refreshMeta().blocksTrackerWrites && cur && !cur.closed) cur.claimed = true;
          render();
        }
        if (act === "fake-release") {
          const cur = issue(S.issueId);
          if (!refreshMeta().blocksTrackerWrites && cur) cur.claimed = false;
          render();
        }
        if (act === "fake-continue") {
          const cur = issue(S.issueId);
          const live = cur ? issueRun(cur) : run(S.runId);
          if (live) live.status = "active";
          if (cur) cur.stopped = false;
          if (live) setRun(live.id, true);
          render();
        }
        if (act === "open-local") alert("原型：打开\n" + localPath(issue(Number(id))));
        if (act === "reveal-local") alert("原型：显示\n" + localPath(issue(Number(id))));
      };
      app.oninput = (e) => {
        if (e.target.dataset.act === "note-draft") S.noteDraft = e.target.value;
        if (e.target.dataset.act === "launch-prompt") S.launch.prompt = e.target.value;
        if (e.target.dataset.act === "launch-text") S.launch.values[e.target.dataset.key] = e.target.value;
        if (e.target.dataset.act === "set-n") {
          S.recentN = Number(e.target.value);
          const label = app.querySelector("[data-role=n-val]");
          if (label) label.textContent = String(S.recentN);
        }
        if (e.target.dataset.act === "set-cold-wait") {
          patchProjAuto(S.projectId, { coldWait: Number(e.target.value) });
          const label = app.querySelector("[data-role=cold-wait-val]");
          if (label) label.textContent = String(projAutoOf(S.projectId).coldWait);
        }
      };
      app.onchange = (e) => {
        if (e.target.dataset.act === "refresh-interval") {
          S.refreshInterval = Number(e.target.value);
          if (S.refreshState === "normal") S.refreshSeconds = S.refreshInterval;
          render();
        }
        if (e.target.dataset.act === "set-n") {
          S.recentN = Number(e.target.value);
          render();
        }
        if (e.target.dataset.act === "set-cold-wait") {
          patchProjAuto(S.projectId, { coldWait: Number(e.target.value) });
          render();
        }
        if (e.target.dataset.act === "launch-select") {
          const key = e.target.dataset.key;
          if (e.target.value === "__custom__") {
            const cur = S.launch.values[key];
            const known = AGENTS.some(a => (a.first.concat(a.folded).find(f => f.key === key)?.options || []).includes(cur));
            S.launch.values[key] = known ? "" : (cur || "");
          } else {
            S.launch.values[key] = e.target.value;
          }
          render();
        }
        if (e.target.dataset.act === "launch-text") {
          S.launch.values[e.target.dataset.key] = e.target.value;
        }
        const act = e.target.dataset.act;
        if (act === "usage-from" || act === "usage-b-from") {
          S.usageFrom = e.target.value;
          if (act === "usage-from") S.usageRange = "custom";
          else S.usageFilter.range = "custom";
          S.usageRunId = null;
          render();
        }
        if (act === "usage-to" || act === "usage-b-to") {
          S.usageTo = e.target.value;
          if (act === "usage-to") S.usageRange = "custom";
          else S.usageFilter.range = "custom";
          S.usageRunId = null;
          render();
        }
      };
      const splitHandle = document.querySelector("[data-act=drag-vc]");
      if (splitHandle) {
        splitHandle.onmousedown = (e) => {
          e.preventDefault();
          const split = splitHandle.parentElement;
          const move = (ev) => {
            const rect = split.getBoundingClientRect();
            S.vcPct = Math.min(70, Math.max(18, ((rect.right - ev.clientX) / rect.width) * 100));
            split.style.gridTemplateColumns = `minmax(160px,1fr) 6px ${S.vcPct}%`;
          };
          const up = () => {
            window.removeEventListener("mousemove", move);
            window.removeEventListener("mouseup", up);
          };
          window.addEventListener("mousemove", move);
          window.addEventListener("mouseup", up);
        };
      }
      const svg = app.querySelector("svg[data-act=svg-root]");
      if (svg) {
        let drag = null;
        svg.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".node-card")) return;
          drag = { x: e.clientX, y: e.clientY, cx: S.cam.x, cy: S.cam.y };
          svg.setPointerCapture(e.pointerId);
        });
        svg.addEventListener("pointermove", (e) => {
          if (!drag) return;
          S.cam.x = drag.cx + (e.clientX - drag.x);
          S.cam.y = drag.cy + (e.clientY - drag.y);
          S.cam.user = true;
          const g = svg.querySelector("g");
          if (g) g.setAttribute("transform", `translate(${S.cam.x} ${S.cam.y}) scale(${S.cam.k})`);
        });
        svg.addEventListener("pointerup", () => { drag = null; });
        svg.addEventListener("wheel", (e) => {
          e.preventDefault();
          S.cam.k = Math.min(1.8, Math.max(0.35, S.cam.k * (e.deltaY > 0 ? 0.9 : 1.1)));
          S.cam.user = true;
          const g = svg.querySelector("g");
          if (g) g.setAttribute("transform", `translate(${S.cam.x} ${S.cam.y}) scale(${S.cam.k})`);
        }, { passive: false });
      }
    }

    function setTermZoom(id) {
      if (S.termZoom === id) S.termZoom = null;
      else S.termZoom = id || null;
      const want = S.termZoom === "full";
      if (want && !document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      if (!want && document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      render();
    }

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && S.termZoom === "full") {
        S.termZoom = null;
        render();
      }
    });
    document.addEventListener("keydown", (e) => {
      const el = e.target;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable)) return;
      if (e.key === "Escape" && S.launch.open) {
        closeLaunch();
        render();
        return;
      }
      if (e.key === "Escape" && S.usageSheet) {
        S.usageSheet = false;
        render();
        return;
      }
      if (e.key === "Escape" && S.termZoom && S.termZoom !== "full") {
        setTermZoom(null);
        return;
      }
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        stepVariant(e.key === "ArrowRight" ? 1 : -1);
        render();
      }
    });

    loadQS();
    render();
  </script>
</body>
</html>
