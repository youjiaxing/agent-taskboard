<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>原型 · 三方向对照</title>
  <!--
    一次性原型，不是产品。
    三个方向：
      codex-map  结构已动：左侧栏是 Host + 本机 Project，不是聊天清单。
                中间仍是看板视图 | 依赖图；底栏 Embedded Terminal 占自己的高度。
                学侧栏清单的密度，不仿 Codex 的会话壳。
                右侧 Issue 是文档栏：正文可滚，家族/依赖折在底下。
      codex      Codex 气质（结构未改 #15/#26）：只借截图气质。
      paper      纸面精修（结构未改 #15/#26）：保留书桌骨架。
    ?direction=codex-map|codex|paper  &mid=board|graph|run  &iw=1
  -->
  <style>
    :root {
      --sans: "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
      --serif: "Iowan Old Style", "Songti SC", "Noto Serif SC", Palatino, serif;
      --mono: "SF Mono", Menlo, "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    button, select, input, textarea {
      font: inherit;
      color: inherit;
      background: var(--btn);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 3px 8px;
      cursor: pointer;
    }
    button:hover { border-color: var(--line-strong); }
    button.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
    button.ghost { background: transparent; }
    button.active { background: var(--sel); border-color: var(--accent); color: var(--accent-ink); }
    input, textarea { background: var(--field); cursor: text; }
    a.ext {
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 2px 8px;
      background: var(--btn);
    }
    .mono { font-family: var(--mono); }

    /* 两个方向复用原型已有的浅色 token；这不是主题清单决策。 */
    .theme-warm-light {
      --desk: #cfc4b0;
      --paper: #fff8ee;
      --paper-2: #f4ead8;
      --card: #fffdf8;
      --ink: #2a2218;
      --on-ink: #fff8ee;
      --muted: #7a6d5c;
      --line: #e2d3bb;
      --line-strong: #c4b191;
      --accent: #c45c26;
      --accent-ink: #7a2e0c;
      --sel: #f3d3b4;
      --run: #2f7d4a;
      --stop: #b42318;
      --block: #b45309;
      --chip: #f3ead8;
      --btn: #fff8ee;
      --field: #fff;
      --term: #241c16;
      --term-fg: #f0e6d6;
      --ident: #3a2c22;
      --who: #fdba74;
      --card-sel: #fff1de;
      --glow: rgba(255,255,255,.7);
      --shadow: 0 18px 40px rgba(60, 40, 16, .18);
      --desk-glow: #e6dcc8;
    }
    .theme-plain-light {
      --desk: #d5d3ce;
      --paper: #fffcf8;
      --paper-2: #f3f2ee;
      --card: #ffffff;
      --ink: #1c1b19;
      --on-ink: #fffcf8;
      --muted: #6f6d68;
      --line: #e3e1db;
      --line-strong: #c6c3bb;
      --accent: #c23b2e;
      --accent-ink: #8a1f16;
      --sel: #fde8e4;
      --run: #2f7d4a;
      --stop: #b42318;
      --block: #b45309;
      --chip: #f3f2ee;
      --btn: #fffcf8;
      --field: #fff;
      --term: #1a1a19;
      --term-fg: #eceae6;
      --ident: #1a1a19;
      --who: #f0a399;
      --card-sel: #fff1ee;
      --glow: rgba(255,255,255,.8);
      --shadow: 0 18px 40px rgba(28, 27, 25, .12);
      --desk-glow: #eceae6;
    }
    .theme-warm {
      --r: 8px;
      --win-r: 12px;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 50% -10%, var(--desk-glow), transparent 55%),
        var(--desk);
    }
    .theme-warm .brand { font-family: var(--serif); font-weight: 600; letter-spacing: .01em; }
    .theme-warm .issue-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 1px 0 var(--glow) inset, 0 6px 14px rgba(28,27,25,.06);
      padding: 10px 11px;
      margin: 8px;
      text-align: left;
      display: block;
      width: calc(100% - 16px);
    }
    .theme-warm .issue-card:hover { transform: translateY(-1px); }
    .theme-warm .issue-card.sel { outline: 2px solid var(--accent); background: var(--card-sel); }
    .theme-warm .col-hd { font-family: var(--serif); }
    .theme-warm .dock { height: 34vh; }
    .theme-warm .ident { background: var(--ident); }
    .theme-warm .traffic i:nth-child(1) { background: #ec6a5e; }
    .theme-warm .traffic i:nth-child(2) { background: #f5bf4f; }
    .theme-warm .traffic i:nth-child(3) { background: #61c554; }
    .direction-pick {
      width: 100%;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
    }
    .direction-pick > span:first-child { display: inline-flex; align-items: center; gap: 8px; }

    body {
      font: 13px/1.4 var(--sans);
      color: var(--ink);
      overflow: hidden;
    }
    #app { height: 100%; }
    .stage {
      height: 100%;
      padding: 14px 14px 78px;
    }
    
    .win {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: var(--win-r);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .os-chrome {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      background: var(--paper-2);
      border-bottom: 1px solid var(--line);
      min-height: 34px;
    }
    .traffic { display: flex; gap: 6px; }
    .traffic i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .win-title { font-size: 12px; color: var(--muted); }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      min-height: 42px;
    }
    .host-tab, .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--chip);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a8a29e; flex: 0 0 auto; }
    .dot.on { background: var(--run); }
    .dot.off { background: #8a8f96; }
    .dot.busy { background: var(--accent); }
    .dot.stop { background: var(--stop); }
    .cols {
      flex: 1;
      display: grid;
      grid-template-columns: 196px minmax(340px, 1.3fr) minmax(280px, .95fr);
      min-height: 0;
    }
    .win.single .cols { grid-template-columns: 148px minmax(340px, 1.3fr) minmax(280px, .95fr); }
    .pane {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--paper);
      border-right: 1px solid var(--line);
    }
    .pane:last-child { border-right: 0; overflow: hidden; display: flex; flex-direction: column; }
    .hd, .col-hd {
      margin: 0;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: none;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: var(--paper-2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .item {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      padding: 8px 10px;
      display: block;
    }
    .item:hover { background: var(--paper-2); }
    .item.sel { background: var(--sel); }
    .item .t, .issue-card .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .item .t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .item .sub, .issue-card .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .muted { color: var(--muted); }
    .tiny { font-size: 11px; color: var(--muted); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .grow { flex: 1; }
    .pad { padding: 10px; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 0 6px;
      border-radius: 3px;
      background: var(--chip);
      border: 1px solid var(--line);
    }
    .tag.block { color: var(--block); border-color: color-mix(in srgb, var(--block) 40%, var(--line)); }
    .tag.run { color: var(--run); }
    .tag.stop { color: var(--stop); }
    .lanes {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      min-height: 100%;
    }
    .col { border-right: 1px solid var(--line); min-width: 0; background: var(--paper-2); }
    .col:last-child { border-right: 0; }
    .col.blocked { --lane: var(--block); }
    .col.frontier { --lane: var(--accent); }
    .col.in-run { --lane: var(--run); }
    .col.recent { --lane: #8a8f96; }
    .empty { padding: 22px 12px; text-align: center; color: var(--muted); }
    .empty-strong { max-width: 420px; margin: 8vh auto; text-align: left; }
    .term {
      background: var(--term);
      color: var(--term-fg);
      font: 12px/1.5 var(--mono);
      padding: 10px 12px;
      min-height: 0;
      overflow: auto;
      white-space: pre-wrap;
      flex: 1;
    }
    .term .dim { opacity: .55; }
    .term .ok { color: #86efac; }
    .term .bad { color: #fca5a5; }
    .term .hi { color: #f0a399; }
    .term.light {
      background: #f4f3ef;
      color: #1c1b19;
    }
    .term.light .dim { opacity: .55; color: #5c5b57; }
    .term.light .ok { color: #1f7a3d; }
    .term.light .bad { color: #b42318; }
    .term.light .hi { color: #9a3412; }
    .ident.light {
      background: #eceae6;
      color: #1c1b19;
    }
    .ident.light button { background: #fff; color: #1c1b19; border-color: #d4d2cc; }
    .ident.light .who { color: #9a3412; }
    
    .diff { font: 12px/1.5 var(--mono); }
    .diff .add { background: color-mix(in srgb, var(--run) 16%, transparent); }
    .diff .del { background: color-mix(in srgb, var(--stop) 16%, transparent); }
    .diff .ln { display: grid; grid-template-columns: 36px 1fr 28px; gap: 8px; padding: 1px 8px; }
    .note-pill {
      background: var(--sel);
      border: 1px solid var(--accent);
      border-radius: var(--r);
      padding: 4px 6px;
      font-size: 12px;
    }
    .dock {
      border-top: 1px solid var(--line);
      background: var(--paper);
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); background: var(--paper-2); overflow-x: auto; }
    .tabs .grp { display: flex; align-items: stretch; border-right: 1px solid var(--line); }
    .tabs .gname { padding: 6px 8px; font-size: 11px; color: var(--muted); align-self: center; white-space: nowrap; }
    .tabs button { border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; padding: 6px 10px; white-space: nowrap; }
    .tabs button.sel { background: var(--ink); color: var(--on-ink); }
    .ident {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      color: #f5f5f4;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .ident button { background: #3f3f46; color: #fff; border-color: #52525b; }
    .ident .who { color: var(--who, #fdba74); font-weight: 650; }
    .theme-warm .ident .who { color: var(--who, #fdba74); }
    .term-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .split { display: grid; min-height: 0; flex: 1; }
    .splitter { cursor: col-resize; background: var(--line); width: 6px; }
    .splitter:hover { background: var(--accent); }
    .block {
      border: 1px solid var(--line);
      background: var(--paper-2);
      padding: 8px;
      border-radius: var(--r);
    }
    .block h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .name-btn { text-align: left; }
    .zoom-stage {
      position: fixed;
      inset: 0;
      z-index: 18;
      background: #0c0a09;
      display: flex;
      flex-direction: column;
      padding-bottom: 72px;
    }
    .zoom-stage.full { padding-bottom: 0; }
    .zoom-stage.right {
      left: auto;
      width: min(46vw, 640px);
      border-left: 1px solid #3f3f46;
      padding-bottom: 72px;
    }
    .zoom-stage.light { background: #f4f3ef; }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 12, .4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 22;
    }
    .modal {
      width: min(440px, calc(100vw - 32px));
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sheet {
      position: fixed;
      top: 44px;
      right: 16px;
      width: min(320px, calc(100vw - 24px));
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      z-index: 21;
      max-height: calc(100vh - 120px);
      overflow: auto;
    }
    
    .phone-stage {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 96px;
    }
    .phone {
      width: 390px;
      height: min(780px, calc(100vh - 130px));
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }
    .phone-bar { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
    .phone-body { flex: 1; overflow: auto; }
    .phone-tabbar { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--line); }
    .phone-tabbar button { border: 0; border-radius: 0; padding: 10px 4px; background: var(--paper); }
    .phone-tabbar button.active { background: var(--sel); }
    .banner {
      margin: 8px 10px;
      padding: 8px 10px;
      background: color-mix(in srgb, var(--block) 18%, var(--paper));
      border: 1px solid color-mix(in srgb, var(--block) 40%, var(--line));
      border-radius: var(--r);
    }
    .cta {
      margin: 24px 16px;
      padding: 20px;
      background: var(--paper);
      border: 1px dashed var(--line-strong);
      border-radius: var(--r);
    }
    #switcher {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #1c1917;
      color: #fff;
      border-radius: 999px;
      padding: 6px 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      max-width: calc(100vw - 16px);
    }
    #switcher button, #switcher select {
      background: #292524;
      color: #fff;
      border-color: #44403c;
      border-radius: 999px;
    }
    #switcher select { padding: 4px 10px; }
    #switcher .lab { font-size: 12px; padding: 0 6px; white-space: nowrap; }
    #inspector {
      display: none;
      position: fixed;
      left: 12px;
      bottom: 70px;
      width: 270px;
      background: #fff;
      color: #1c1917;
      border: 1px solid #a8a29e;
      font-size: 12px;
      z-index: 25;
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
      font-family: var(--sans);
    }
    body.phone-vp #inspector { display: none; }
    #inspector h3 {
      margin: 0;
      padding: 6px 8px;
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: uppercase;
      background: #1c1917;
      color: #fff;
    }
    #inspector pre { margin: 0; padding: 8px; white-space: pre-wrap; }
    :fullscreen #switcher, :fullscreen #inspector { display: none; }

    .direction-toggle {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--chip);
    }
    .direction-toggle button {
      border: 0;
      border-radius: 6px;
      background: transparent;
      padding: 4px 9px;
      white-space: nowrap;
    }
    .direction-toggle button.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .09);
    }
    .direction-note { color: var(--muted); font-size: 11px; }
    .structure-note {
      padding: 3px 8px;
      border: 1px solid #57534e;
      border-radius: 999px;
      color: #d6d3d1;
      font-size: 11px;
      white-space: nowrap;
    }
    .mid-rel { position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .mid-rel > .lanes { flex: 1; min-height: 0; overflow: auto; }
    .mid-rel > .graph-sheet { flex: 1; min-height: 0; }
    .mid-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 7px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      flex: 0 0 auto;
    }
    .mid-bar button.active {
      background: var(--sel);
      border-color: var(--line-strong);
      font-weight: 600;
    }
    .graph-sheet {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }
    .graph-toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--paper-2);
    }
    .graph-canvas { flex: 1; min-height: 0; overflow: hidden; background: var(--paper); }
    .graph-canvas svg { width: 100%; height: 100%; display: block; }
    .node-card { cursor: pointer; }
    .flow {
      display: grid;
      grid-template-columns: 1fr 16px minmax(88px, .75fr) 16px 1fr;
      gap: 4px;
      align-items: start;
    }
    .flow .arrow {
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
    }
    .flow .here {
      border: 1px solid var(--line-strong);
      background: var(--sel);
      padding: 8px;
      border-radius: var(--r);
    }
    .dock.slim { height: auto !important; min-height: 0; flex: 0 0 auto; }
    .dock.slim .tabs,
    .dock.slim .term-wrap,
    .dock.slim .split { display: none; }
    .icn {
      width: 15px;
      height: 15px;
      display: inline-block;
      flex: 0 0 auto;
      opacity: .72;
    }

    /* Codex 气质：结构未改 #15，只借截图气质——淡线、留白、安静控件。 */
    .shell-codex {
      --desk: #f2f2f1;
      --paper: #ffffff;
      --paper-2: #f7f7f8;
      --card: #ffffff;
      --ink: #20201f;
      --on-ink: #ffffff;
      --muted: #70706d;
      --line: #eaeae8;
      --line-strong: #d9d9d6;
      --accent: #252524;
      --accent-ink: #20201f;
      --sel: #ececea;
      --chip: #f1f1f0;
      --btn: #fafaf9;
      --field: #ffffff;
      --term: #171716;
      --ident: #222221;
      --card-sel: #efefed;
      --shadow: none;
      --r: 8px;
      --win-r: 0;
      background: var(--desk);
    }
    .shell-codex .stage { padding: 0 0 70px; background: var(--desk); }
    .shell-codex .win { border: 0; border-radius: 0; box-shadow: none; }
    .shell-codex .os-chrome {
      min-height: 42px;
      padding: 8px 14px;
      background: #f2f2f1;
    }
    .shell-codex .traffic i { background: #c6c6c2 !important; }
    .shell-codex .win-title { color: #656563; }
    .shell-codex .topbar { min-height: 50px; padding: 8px 14px; background: #ffffff; }
    .shell-codex .brand { font-family: var(--sans); font-weight: 680; letter-spacing: -.02em; }
    .shell-codex .host-tab,
    .shell-codex .chip { border-color: transparent; border-radius: 7px; }
    .shell-codex .host-tab.active { border-color: var(--line-strong); background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.05); }

    function inlineMd(s) {

      out = out.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a class="md-a" href="$2" target="_blank" rel="noreferrer">$1</a>');

    function renderMd(src) {
      const raw = String(src || "").replace(/\r\n/g, "\n");
      const chunks = [];
      const fence = /```[^\n]*\n([\s\S]*?)```/g;
      let last = 0, m;
      while ((m = fence.exec(raw))) {
        if (m.index > last) chunks.push(["md", raw.slice(last, m.index)]);
        chunks.push(["pre", m[1]]);
        last = m.index + m[0].length;
      }
      if (last < raw.length) chunks.push(["md", raw.slice(last)]);
      return chunks.map(([kind, text]) => {
        if (kind === "pre") return `<pre class="md-pre"><code>${esc(text)}</code></pre>`;
        return text.trim().split(/\n{2,}/).map(block => {
          const lines = block.split("\n");
          if (/^###\s/.test(lines[0])) return `<h4>${inlineMd(lines[0].replace(/^###\s+/, ""))}</h4>${lines.length > 1 ? `<p>${lines.slice(1).map(inlineMd).join("<br>")}</p>` : ""}`;
          if (/^##\s/.test(lines[0])) return `<h3>${inlineMd(lines[0].replace(/^##\s+/, ""))}</h3>${lines.length > 1 ? `<p>${lines.slice(1).map(inlineMd).join("<br>")}</p>` : ""}`;

          return `<p>${lines.map(inlineMd).join("<br>")}</p>`;
        }).join("");
      }).join("");

    function layoutDag(ids) {
      const idSet = new Set(ids);
      const preds = {};
      for (const id of ids) preds[id] = [];
      for (const id of ids) {
        const iss = issue(id);
        if (!iss) continue;
        for (const b of iss.blockedBy) {
          if (idSet.has(b)) preds[id].push(b);
        }
      }
      const layer = {};
      const stack = new Set();
      function depth(id) {
        if (layer[id] != null) return layer[id];
        if (stack.has(id)) return 0;
        stack.add(id);
        const p = preds[id];
        layer[id] = p.length ? Math.max(...p.map(depth)) + 1 : 0;
        stack.delete(id);
        return layer[id];
      }
      ids.forEach(depth);
      const byLayer = {};
      for (const id of ids) (byLayer[layer[id]] ||= []).push(id);

      const pos = {};

      for (const L of layers) {

        });
        maxH = Math.max(maxH, row.length * (NH + GY) - GY);
      }

      return { pos, width: Math.max(width, 360), height: Math.max(height, 200) };

                  <button data-act="register">${visibleProjects().length ? t("registerAgain") : t("register")}</button>
                  <div class="tiny" style="margin-top:8px">${t("filterProject")}</div>
                </div>
              </div>
              <div class="pane mid-rel">${!S.projectId ? noProjectMid() : (S.midMode === "graph" ? graphPane() : board())}</div>
              <div class="pane">${issueDetail()}</div>
            </div>
            <div class="dock ${dockFolded() ? "slim" : ""}">
              ${runTabs()}
              ${termChrome(r)}
              ${termSplit(r)}
            </div>
          </div>
        </div>
        ${S.termZoom && !(S.direction === "codex-map" && S.termZoom === "right") ? termZoomStage(r) : ""}
        ${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}
        ${S.settingsOpen ? settingsSheet() : ""}
        ${S.allRunsOpen ? allRunsSheet() : ""}`;
    }

    /* Codex 原貌映射：左侧原生栏 + 白主区。中间看板/图，底栏占自己的高度。 */
    function renderMap() {
      const r = run(S.runId);
      const empty = S.scenario === "unpaired" ? "unpaired" : !S.projectId ? "noproject" : null;
      const fillRight = S.termZoom === "right";
      const hideDetail = S.detailFolded || fillRight;
      const termOnRight = fillRight && S.midMode !== "run";
      const hideDockTerm = S.midMode === "run" || fillRight;
      const mid = S.midMode === "graph" ? graphPane() : S.midMode === "run" ? runPane(r) : board();
      return `
        <div class="stage">
          <div class="map-frame ${S.sideFolded ? "side-slim" : ""}">
            ${mapSidebar()}
            <div class="map-workspace">
              ${empty ? mapEmpty(empty) : `
                <div class="map-cols ${hideDetail && !termOnRight ? "no-detail" : ""} ${termOnRight ? "with-term-col" : ""} ${!hideDetail && S.issueWide ? "issue-wide" : ""} ${!hideDetail && !S.issueWide && S.midMode === "run" ? "run-read" : ""}">
                  <div class="map-mid">${mid}</div>
                  ${termOnRight ? `<aside class="map-term-col">${termChrome(r)}${termSplit(r)}</aside>` : ""}
                  ${hideDetail ? "" : `<aside class="map-detail-col">${issueDetail()}</aside>`}
                </div>
                <div class="dock ${dockFolded() || hideDockTerm ? "slim" : ""}">
                  ${runTabs()}
                  ${hideDockTerm ? "" : termChrome(r)}
                  ${hideDockTerm ? "" : termSplit(r)}
                </div>
              `}
            </div>
          </div>
        </div>
        ${S.termZoom && S.termZoom !== "right" ? termZoomStage(r) : ""}
        ${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}
        ${S.settingsOpen ? settingsSheet() : ""}
        ${S.allRunsOpen ? allRunsSheet() : ""}`;
    }

    function mapSidebar() {
      const hs = visibleHosts();
      const plist = hostProjects();
      return `
        <aside class="map-side">
          <div class="ms-top">
            <div class="traffic"><i></i><i></i><i></i></div>
            <span class="ms-app">Agent Taskboard</span>
            ${S.sideFolded ? `<button class="ms-ico" data-act="toggle-side" title="${esc(t("unfoldSide"))}">⟩</button>` : ""}
          </div>
          <div class="ms-groups">
            <div class="ms-group">
              <div class="ms-group-name">${esc(t("hosts"))}</div>
              ${hs.map(hh => `
                <button class="ms-item ${S.hostId === hh.id ? "active" : ""}" data-act="host" data-id="${hh.id}">
                  <span class="dot ${hh.online ? "on" : "off"}"></span>${esc(hostName(hh))}
                </button>`).join("") || `<div class="ms-nested">${esc(t("unpairedTitle"))}</div>`}
              <button class="ms-item" data-act="pair">+ ${esc(t("pair"))}</button>
            </div>
            <div class="ms-group">
              <div class="ms-group-name">${esc(t("thisHostProjects"))}</div>
              ${plist.map(pp => {
                const runs = projectDockRuns(pp.id);
                return `
                  <button class="ms-item ${S.projectId === pp.id ? "active" : ""}" data-act="project" data-id="${pp.id}">
                    ${esc(pp.name)}<span class="ms-tag">${esc(pp.tracker)}</span>
                  </button>
                  ${runs.map(rr => {
                    const ii = rr.issueId ? issue(rr.issueId) : null;
                    const label = ii ? `#${ii.id} ${shortTitle(ii.title, 14)}` : t("free");
                    return `<button class="ms-nested ${S.runId === rr.id ? "active" : ""}" data-act="focus-run" data-id="${rr.id}">
                      <span class="dot ${rr.status === "active" ? "busy" : rr.status === "stopped" ? "stop" : "off"}"></span>${esc(label)}
                    </button>`;
                  }).join("") || (S.projectId === pp.id ? `<div class="ms-nested">${esc(t("noDockRuns"))}</div>` : "")}`;
              }).join("") || `<div class="ms-nested">${esc(t("noProjectTitle"))}</div>`}
              <button class="ms-item" data-act="register">+ ${esc(plist.length ? t("registerAgain") : t("register"))}</button>
            </div>
          </div>
          <span class="grow"></span>
          <div class="ms-foot">
            <span class="chip">${esc(t("autoOff"))}</span>
            <button data-act="lang">${S.lang === "zh" ? "中文" : "EN"}</button>
            <button data-act="settings" class="${S.settingsOpen ? "active" : ""}">${esc(t("settings"))}</button>
          </div>
        </aside>`;
    }

    function mapEmpty(kind) {
      const body = kind === "unpaired" ? `
          <div class="brand">${t("unpairedTitle")}</div>
          <p class="muted">${t("unpairedBody")}</p>
          <div><button class="primary" data-act="pair">${t("pairNow")}</button></div>` : `
          <div class="brand">${t("noProjectTitle")}</div>
          <p class="muted">${t("noProjectBody")}</p>
          <div><button class="primary" data-act="register">${t("register")}</button></div>`;
      return `<div class="map-empty-strong">${body}</div>`;
    }

    function midBar() {
      const h = host(S.hostId);
      const p = project(S.projectId);
      return `
        <div class="mid-bar">
          ${S.direction === "codex-map" ? `<button data-act="toggle-side">${S.sideFolded ? t("unfoldSide") : t("foldSide")}</button>` : ""}
          <button data-act="mid-mode" data-id="board" class="${S.midMode === "board" ? "active" : ""}">${esc(t("boardView"))}</button>
          <button data-act="mid-mode" data-id="graph" class="${S.midMode === "graph" ? "active" : ""}">${esc(t("depGraph"))}</button>
          ${S.direction === "codex-map" && S.runId ? `<button data-act="mid-mode" data-id="run" class="${S.midMode === "run" ? "active" : ""}">${esc(t("thisRun"))}</button>` : ""}
          <span class="tiny">${esc(t("graphEntry"))}</span>
          <span class="grow"></span>
          ${h ? `<span class="chip">${esc(hostName(h))}${p ? " · " + esc(p.name) : ""}</span>` : ""}
          ${S.direction === "codex-map" ? `<button data-act="toggle-detail">${S.detailFolded ? t("unfoldDetail") : t("foldDetail")}</button>` : ""}
        </div>`;
    }

    function runPane(r) {
      return `
        ${midBar()}
        <div class="run-stage">
          ${termChrome(r)}
          ${termSplit(r)}
        </div>`;
    }

    function renderSvg() {
      const ids = graphIds();
      if (!ids.length) return `<div class="empty">${esc(t("noItems"))}</div>`;
      const { pos, width, height } = layoutDag(ids);
      if (!S.cam.user) {
        const focus = pos[S.issueId] || Object.values(pos)[0];
        S.cam.k = 1;
        if (focus) {
          S.cam.x = 280 - (focus.x + focus.w / 2);
          S.cam.y = 150 - (focus.y + focus.h / 2);
        }
      }
      const depEdges = [];
      for (const id of ids) {
        const iss = issue(id);
        for (const b of iss.blockedBy) {
          if (pos[b] && pos[id]) depEdges.push({ from: b, to: id, closed: !!(issue(b).closed || iss.closed) });
        }
      }
      const node = (id) => {
        const i = issue(id);
        const p = pos[id];
        const cur = id === S.issueId;
        const closed = !!i.closed;
        const fill = cur ? "#ececea" : closed ? "#f5f5f4" : "#ffffff";
        const stroke = cur ? "#1a1a19" : closed ? "#b0b0ac" : "#d0d0cc";
        const dash = closed ? "4 3" : "none";
        const title = `#${id} ${shortTitle(i.title, 12)}`;
        const sub = closed ? (S.lang === "en" ? "Closed · context" : "已关闭 · 上下文")
          : sectionOf(i) === "blocked" ? t("blocked")
          : sectionOf(i) === "in-run" ? t("inRun")
          : t("frontier");
        return `
          <g class="node-card" data-act="graph-node" data-id="${id}">
            <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8"
              fill="${fill}" stroke="${stroke}" stroke-width="${cur ? 2 : 1}" stroke-dasharray="${dash}" />
            <text x="${p.x + 10}" y="${p.y + 20}" font-size="12" font-weight="650" fill="#1a1a19">${esc(title)}</text>
            <text x="${p.x + 10}" y="${p.y + 36}" font-size="10" fill="#8a8a86">${esc(sub)}</text>
          </g>`;
      };
      const depPath = (e) => {
        const a = pos[e.from], b = pos[e.to];
        const x1 = a.x + a.w, y1 = a.y + a.h / 2;
        const x2 = b.x, y2 = b.y + b.h / 2;
        const mid = (x1 + x2) / 2;
        const col = e.closed ? "#b0b0ac" : "#6f6e6b";
        const dash = e.closed ? "5 4" : "none";
        return `<path d="M${x1} ${y1} C${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="1.5" stroke-dasharray="${dash}" marker-end="${e.closed ? "url(#arr-off)" : "url(#arr)"}" />`;
      };
      return `
        <svg viewBox="0 0 800 420" data-act="svg-root" data-w="${width}" data-h="${height}">
          <defs>
            <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#6f6e6b" />
            </marker>
            <marker id="arr-off" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#b0b0ac" />
            </marker>
          </defs>
          <g transform="translate(${S.cam.x} ${S.cam.y}) scale(${S.cam.k})">
            <rect x="-400" y="-400" width="${width + 800}" height="${height + 800}" fill="transparent" data-act="svg-bg" />
            ${depEdges.map(depPath).join("")}
            ${ids.map(node).join("")}
          </g>
        </svg>`;
    }

    function graphPane() {
      const all = graphIds();
      const extras = all.filter(id => issue(id).closed);
      const iso = isolatedIds(all);
      const i = issue(S.issueId);
      return `
        <div class="graph-sheet">
          ${midBar()}
          <div class="graph-toolbar">
            <span class="chip">${all.length} · ${S.lang === "en" ? "isolated" : "孤立"} ${iso.length} · ${S.lang === "en" ? "closed" : "已关闭"} ${extras.length} · #${i ? i.id : "?"}</span>
            <button data-act="toggle-ctx" class="${S.showCtx ? "active" : ""}">${S.showCtx ? t("closedCtxOn") : t("showClosedCtx")}</button>
            <button data-act="reset-cam">${t("resetCam")}</button>
            <span class="tiny">${esc(t("graphHint"))}</span>
          </div>
          <div class="tiny pad">${esc(t("graphIso"))}</div>
          <div class="graph-canvas">${renderSvg()}</div>
        </div>`;
    }

    function projectList() {
      const list = visibleProjects().filter(p => !S.hostId || p.hostId === S.hostId);
      if (!list.length) {
        return `<div class="empty">${t("noProjectTitle")}</div>`;
      }
      return list.map(p => `
        <button class="item ${S.projectId === p.id ? "sel" : ""}" data-act="project" data-id="${p.id}">
          <div class="t"><b>${esc(p.name)}</b><span class="tag">${esc(p.tracker)}</span></div>
        </button>`).join("");
    }

    function issueCard(i, col) {
      const r = issueRun(i);
      const ended = RUNS.find(x => x.issueId === i.id && x.status === "ended" && S.runId === x.id);
      const tags = [];
      if (i.closed) tags.push(`<span class="tag">${t("closed")}</span>`);
      if (sectionOf(i) === "blocked") tags.push(`<span class="tag block">${t("blocked")}</span>`);
      if (r && r.status === "active") tags.push(`<span class="tag run">Run</span>`);
      if ((r && r.status === "stopped") || i.stopped) tags.push(`<span class="tag stop">${t("stopped")}</span>`);
      if (ended) tags.push(`<span class="tag">${t("ended")}</span>`);
      return `
        <button class="issue-card ${S.issueId === i.id ? "sel" : ""}" data-act="issue" data-id="${i.id}">
          <div class="t"><b class="mono">#${i.id}</b><span class="tiny">${esc(i.closedAgo || "")}</span></div>
          <div>${esc(shortTitle(i.title, 28))}</div>
          <div class="sub">${tags.join(" ")}</div>
        </button>`;
    }

    function frontierEmptyText() {
      if (S.scenario === "emptyfront") return t("noFrontierBlocked");
      const list = boardIssues();
      const open = projectIssues().filter(i => !i.closed && !isTriage(i));
      if (!open.length) return t("noFrontierEmpty");
      if (open.every(i => i.claimed || issueRun(i))) return t("noFrontierClaimed");
      if (open.every(i => openBlockers(i).length || i.claimed || issueRun(i))) return t("noFrontierBlocked");
      return t("noItems");
    }

    function board() {
      const list = boardIssues();
      const rec = recentClosed();
      const cols = [
        ["blocked", t("blocked"), list.filter(i => sectionOf(i) === "blocked")],
        ["frontier", t("frontier"), list.filter(i => sectionOf(i) === "frontier")],
        ["in-run", t("inRun"), list.filter(i => sectionOf(i) === "in-run")]
      ];
      const hint = S.childFilter ? t("childHint") : t("boardHint");
      const recAll = allRecentClosed();
      return `
        ${midBar()}
        <div class="tiny pad">${esc(hint)}
          ${S.childFilter ? `<button data-act="clear-filter">${t("clearFilter")}</button>` : ""}
        </div>
        <div class="lanes">
          ${cols.map(([key, name, items]) => `
            <div class="col ${key}">
              <div class="col-hd">${name} <span>${items.length}</span></div>
              ${items.map(i => issueCard(i, key)).join("") || `<div class="empty">${key === "frontier" ? frontierEmptyText() : t("noItems")}</div>`}
            </div>`).join("")}
          <div class="col recent">
            <div class="col-hd">${t("recent")} <span>${rec.length}/${recAll.length}</span></div>
            ${rec.map(i => issueCard(i, "recent")).join("") || `<div class="empty">${t("noRecent")}</div>`}
            <div class="tiny pad">${t("recentNote")}</div>
            ${recAll.length > S.recentN ? `<div class="pad"><button data-act="toggle-recent-more">${S.recentMore ? t("recentLess") : t("recentMore")}</button></div>` : ""}
          </div>
        </div>`;
    }

    function noProjectMid() {
      return `
        <div class="cta stack">
          <b>${t("noProjectTitle")}</b>
          <div class="muted">${t("noProjectBody")}</div>
          <div><button class="primary" data-act="register">${t("register")}</button></div>
        </div>`;
    }

    function nameBtn(i) {
      if (!i) return "";
      const extra = i.closed ? " · " + t("closed") : sectionOf(i) === "blocked" ? " · " + t("blocked") : "";
      return `<button class="name-btn" data-act="issue" data-id="${i.id}">#${i.id} ${esc(shortTitle(i.title, 18))}${extra}</button>`;
    }

    function issueDetail() {
      const i = issue(S.issueId);
      if (!i) return `<div class="empty">${t("pickIssue")}</div>`;
      const p = project(i.projectId);
      const par = parentOf(i);
      const kids = childrenOf(i.id);
      const blockers = i.blockedBy.map(issue).filter(Boolean);
      const blocks = i.blocking.map(issue).filter(Boolean);
      const r = issueRun(i) || RUNS.find(x => x.issueId === i.id && S.runId === x.id);
      const wideBtn = S.viewport === "phone" ? "" : `<button data-act="toggle-issue-wide" class="${S.issueWide ? "active" : ""}">${S.issueWide ? t("issueNarrow") : t("issueWide")}</button>`;
      return `
        <article class="issue-doc">
          <header class="issue-hd">
            <div class="issue-kicker">
              <span>${t("issue")}</span>
              <span class="grow"></span>
              ${wideBtn}
            </div>
            <div class="issue-title">${esc(issueLabel(i))}</div>
            <div class="row" style="margin-top:5px">
              <span class="tiny">${esc(hostName(host(p.hostId)))} / ${esc(p.name)} · ${esc(p.tracker)}</span>
              <span class="tag">${esc(i.role)}</span>
              ${i.closed ? `<span class="tag">${t("closed")}</span>` : i.claimed ? `<span class="tag">${t("claimed")}</span>` : `<span class="tag">${t("unclaimed")}</span>`}
            </div>
            <div class="row" style="margin-top:6px">
              ${r ? `<button class="primary" data-act="${S.direction === "codex-map" ? "focus-run" : "run"}" data-id="${r.id}">${t("seeRun")}</button>` : `<button class="primary" data-act="fake-start">${t("start")}</button>`}
              ${i.closed ? "" : i.claimed ? `<button data-act="fake-release">${t("release")}</button>` : `<button data-act="fake-claim">${t("claim")}</button>`}
              ${i.stopped || (r && r.status === "stopped") ? `<button data-act="fake-continue">${t("continue")}</button>` : ""}
              ${trackerOpen(i)}
            </div>
          </header>
          <div class="issue-body">${renderMd(issueBodyText(i))}</div>
          <div class="issue-rels">
            <details>
              <summary>${t("family")}</summary>
              <div class="pad stack">
                <div class="tiny">${t("parent")}</div>
                ${par ? nameBtn(par) : `<span class="muted">${t("noParent")}</span>`}
                <div class="tiny">${t("kids")}</div>
                ${kids.length ? kids.map(nameBtn).join(" ") : `<span class="muted">${t("noKids")}</span>`}
                ${kids.length ? `<div class="row"><button data-act="child-filter" data-id="${i.id}">${t("onlyKids")}</button></div>` : ""}
              </div>
            </details>
            <details>
              <summary>${t("deps")}</summary>
              <div class="pad">
                <div class="flow">
                  <div>
                    <div class="tiny">${t("blockedBy")}</div>
                    ${blockers.length ? blockers.map(nameBtn).join(" ") : `<span class="muted">${t("noneBlock")}</span>`}
                  </div>
                  <div class="arrow">→</div>
                  <div class="here">
                    <div class="tiny">${t("issue")}</div>
                    <b>#${i.id}</b>
                  </div>
                  <div class="arrow">→</div>
                  <div>
                    <div class="tiny">${t("blocking")}</div>
                    ${blocks.length ? blocks.map(nameBtn).join(" ") : `<span class="muted">${t("none")}</span>`}
                  </div>
                </div>
              </div>
            </details>
          </div>
        </article>`;
    }

    function runTabs() {
      const groups = {};
      for (const r of dockRuns()) (groups[r.projectId] ||= []).push(r);
      return `
        <div class="tabs">
          ${Object.keys(groups).map(pid => `
            <div class="grp">
              <div class="gname">${esc(project(pid).name)}</div>
              ${groups[pid].map(r => {
                const i = r.issueId ? issue(r.issueId) : null;
                const label = i ? `#${i.id} ${shortTitle(i.title, 10)}` : "#— 游离";
                return `<button class="${S.runId === r.id ? "sel" : ""}" data-act="run" data-id="${r.id}">
                  <span class="dot ${r.status === "active" ? "busy" : r.status === "stopped" ? "stop" : "off"}"></span>${esc(label)}
                </button>`;
              }).join("")}
            </div>`).join("") || `<div class="gname muted pad">${S.hostId ? "这条 Host 上没有要打交道的 Run" : ""}</div>`}
          <span class="grow"></span>
          <button data-act="all-runs">${t("allRuns")}</button>
        </div>`;
    }

    function runIdentity(r) {
      if (!r) return `<span class="muted">—</span>`;
      const i = r.issueId ? issue(r.issueId) : null;
      const p = project(r.projectId);
      const h = host(r.hostId);
      const issueBit = i
        ? `<button data-act="issue" data-id="${i.id}"><span class="who">#${i.id}</span> ${esc(shortTitle(i.title, 20))}</button>`
        : `<span class="tag">${t("free")}</span>`;
      return `${esc(hostName(h))} <span class="muted">/</span>
        <button data-act="project" data-id="${p.id}">${esc(p.name)}</button>
        <span class="muted">/</span> ${issueBit}
        <span class="muted">· ${esc(r.agent)}${r.isolation ? " · 隔离" : ""}</span>`;
    }

    function termChrome(r) {
      return `
        <div class="ident ${termSkin()}">
          ${runIdentity(r)}
          <span class="grow"></span>
          <button data-act="swap-run" title="最近切过的 Run">上一条</button>
          ${r && r.status === "active" ? `<button data-act="ask-stop">${t("stopRun")}</button>` : ""}
          ${S.midMode === "run" ? "" : `<button data-act="toggle-dock">${dockFolded() ? t("unfoldDock") : t("foldDock")}</button>`}
          <button data-act="toggle-vc" class="${S.viewChangesOpen ? "active" : ""}">${t("viewChanges")}</button>
          <button data-act="term-theme">${S.termTheme === "light" ? t("termDark") : t("termLight")}</button>
          <button data-act="term-zoom" data-id="panel" class="${S.termZoom === "panel" ? "active" : ""}">${t("zoom")}</button>
          <button data-act="term-zoom" data-id="right" class="${S.termZoom === "right" ? "active" : ""}">${t("zoomRight")}</button>
          <button data-act="term-zoom" data-id="full" class="${S.termZoom === "full" ? "active" : ""}">${t("full")}</button>
        </div>`;
    }

    function termText(r) {
      if (!r) return `<span class="dim">没有选中的 Run。终端只画 Host 上那份 PTY。</span>`;
      const i = r.issueId ? issue(r.issueId) : null;
      if (r.status === "stopped") {
        return `<span class="dim">${r.agent}  ${project(r.projectId).name}  ${i ? "#"+i.id : "游离"}</span>
<span class="bad">× ${t("stopped")}</span>  <span class="dim">认领还在。优先恢复原生会话。</span>

<button data-act="fake-continue">${t("continue")}</button>  <button data-act="fake-release">${t("release")}</button>`;
      }
      if (r.status === "ended") {
        return `<span class="dim">${r.agent}  ${i ? "#"+i.id : ""}</span>
<span class="dim">这条已经结束。留在条上只是因为你正在看改动。</span>`;
      }
      return `<span class="dim">${r.agent} · ${project(r.projectId).name} · ${i ? "#"+i.id+" "+shortTitle(i.title, 24) : t("free")}</span>
<span class="ok">● 活跃</span>  <span class="dim">${r.isolation ? "隔离执行目录" : "Project 主目录"} · PTY 在 ${hostName(host(r.hostId))}</span>

<span class="hi">› 官方交互 TUI（假的）</span>
  把父子和挡住拆开，点名字只换详情。
  干活中也能打开旁边的查看改动。`;
    }

    function viewChangesPanel(r) {
      if (!r) return `<div class="empty">先点一次 Run</div>`;
      const files = FILES[r.id] || [];
      const file = files.find(f => f.path === S.fileKey) || files[0];
      const notesHere = S.notes.filter(n => n.runId === r.id);
      return `
        <div class="hd">
          ${t("viewChanges")}
          <span class="row">
            <button data-act="base" data-id="round" class="${S.viewBase === "round" ? "active" : ""}">${t("thisRound")}</button>
            <button data-act="base" data-id="unstaged" class="${S.viewBase === "unstaged" ? "active" : ""}">${t("unstaged")}</button>
            <button class="ghost" data-act="toggle-vc">${t("collapse")}</button>
          </span>
        </div>
        <div class="pad stack">
          ${files.map(f => `
            <button class="item ${file && file.path === f.path ? "sel" : ""}" data-act="file" data-id="${esc(f.path)}">
              <div class="t"><b>${esc(f.path)}</b><span class="tiny">+${f.add} −${f.del}</span></div>
              <div class="sub">${esc(f.repo)}</div>
            </button>`).join("")}
          ${file ? `
            <div class="diff">
              ${file.lines.map(ln => `
                <div class="ln ${ln.k}">
                  <span class="muted">${ln.n}</span>
                  <span>${esc(ln.t)}</span>
                  <button data-act="note-line" data-id="${ln.n}">注</button>
                </div>`).join("")}
            </div>` : `<div class="empty">这个目录里没有 git。</div>`}
          ${S.noteLine ? `
            <div class="stack">
              <div class="tiny">${esc(file.repo)} · ${esc(file.path)}:${S.noteLine}</div>
              <textarea data-act="note-draft" rows="2">${esc(S.noteDraft)}</textarea>
              <button class="primary" data-act="save-note">留下</button>
            </div>` : ""}
          ${notesHere.map((n, idx) => `<div class="note-pill">${esc(n.file)}:${n.line} — ${esc(n.text)} <button data-act="del-note" data-id="${idx}">×</button></div>`).join("")}
        </div>`;
    }

    function termSplit(r) {
      if (!S.viewChangesOpen) return `<div class="term-wrap"><div class="term ${termSkin()}">${termText(r)}</div></div>`;
      return `
        <div class="split" style="grid-template-columns:minmax(160px,1fr) 6px ${S.vcPct}%">
          <div class="term-wrap"><div class="term ${termSkin()}">${termText(r)}</div></div>
          <div class="splitter" data-act="drag-vc"></div>
          <div class="pane">${viewChangesPanel(r)}</div>
        </div>`;
    }

    function termZoomStage(r) {
      return `
        <div class="zoom-stage ${S.termZoom === "full" ? "full" : ""} ${S.termZoom === "right" ? "right" : ""} ${termSkin()}">
          ${termChrome(r)}
          ${termSplit(r)}
        </div>`;
    }

    function emptyUnpaired() {
      return `
        <div class="stage">
          <div class="win">
            <div class="os-chrome">
              <div class="traffic"><i></i><i></i><i></i></div>
              <div class="win-title">Agent Taskboard</div>
              <span class="grow"></span>
              ${directionToggle()}
            </div>
            <div class="empty-strong stack">
              <div class="brand" style="font-size:22px">${t("unpairedTitle")}</div>
              <p class="muted">${t("unpairedBody")}</p>
              <div><button class="primary" data-act="pair">${t("pairNow")}</button></div>
            </div>
          </div>
        </div>
        ${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}`;
    }

    function stopModal() {
      const r = run(S.runId);
      const i = r && r.issueId ? issue(r.issueId) : null;
      return `
        <div class="modal-bg" data-act="close-stop">
          <div class="modal" onclick="event.stopPropagation()">
            <b>${t("stopAsk")}</b>
            <div class="tiny">${r ? esc(r.agent) + (i ? " · #" + i.id + " " + shortTitle(i.title, 18) : "") : t("stopNeedRun")}</div>
            <div class="tiny">${t("stopHint")}</div>
            <div class="row">
              <button class="primary" data-act="stop-soft">${t("stopSoft")}</button>
              <button data-act="stop-hard">${t("stopHard")}</button>
              <button data-act="close-stop">取消</button>
            </div>
          </div>
        </div>`;
    }

    function pairingModal() {
      return `
        <div class="modal-bg" data-act="close-pair">
          <div class="modal" onclick="event.stopPropagation()">
            <b>${t("pair")}</b>
            <div class="tiny">不是登录。Host 出示地址 + 一次性码。</div>
            <div class="stack">
              <div class="mono">http://100.86.12.4:7420</div>
              <div class="mono">7K2M-QP9C</div>
            </div>
            <div class="row">
              <button class="primary" data-act="fake-paired">假装已扫</button>
              <button data-act="close-pair">取消</button>
            </div>
          </div>
        </div>`;
    }

    function directionToggle() {
      return `
        <div class="direction-toggle" title="${t("directionHelp")}">
          ${DIRECTIONS.map(direction => `
            <button data-act="direction" data-id="${direction.id}" class="${S.direction === direction.id ? "active" : ""}">${esc(S.lang === "en" ? direction.nameEn : direction.name)}</button>
          `).join("")}
        </div>`;
    }

    function settingsSheet() {
      return `
        <div class="sheet">
          <div class="hd">${t("settings")}<button class="ghost" data-act="settings">×</button></div>
          <div class="pad stack">
            <div class="tiny">这里只标入口。不必做成完整设置页。</div>
            <b>${t("direction")}</b>
            <div class="tiny">${t("directionHelp")}</div>
            <div class="banner tiny">${t("prototypeThemeNote")}</div>
            ${DIRECTIONS.map(direction => `
              <button class="direction-pick ${S.direction === direction.id ? "active" : ""}" data-act="direction" data-id="${direction.id}">
                <span>${esc(S.lang === "en" ? direction.nameEn : direction.name)}</span>
                <span class="tiny">${direction.structureMoved ? t("structureMoved") : t("structureSame")}</span>
              </button>
              <div class="tiny">${esc(S.lang === "en" ? direction.noteEn : direction.note)}</div>
            `).join("")}
            <div class="block tiny stack">
              <div>${t("codexBorrowed")}</div>
              <div>${t("codexBoundary")}</div>
              <a class="ext" href="https://openai.com/index/introducing-the-codex-app/" target="_blank" rel="noreferrer">${t("officialRef")}</a>
            </div>
            <b>${S.lang === "en" ? "Terminal" : "终端"}</b>
            <div class="row">
              <button data-act="term-theme" class="${S.termTheme === "dark" ? "active" : ""}">${t("termDark")}</button>
              <button data-act="term-theme" class="${S.termTheme === "light" ? "active" : ""}">${t("termLight")}</button>
            </div>
            <div class="tiny">${S.lang === "en" ? "This is the PTY canvas. Official TUI still paints itself." : "这是 PTY 画布底。官方 TUI 自己怎么画还是它自己的事。"}</div>
            <b>${t("recentN")}</b>
            <div class="row">
              <input type="range" min="3" max="12" value="${S.recentN}" data-act="set-n" />
              <span class="mono" data-role="n-val">${S.recentN}</span>
            </div>
            <div class="tiny">${t("recentNHelp")}</div>
          </div>
        </div>`;
    }

    function allRunsSheet() {
      const groups = {};
      for (const r of allHostRuns()) (groups[r.projectId] ||= []).push(r);
      return `
        <div class="sheet">
          <div class="hd">${t("allRuns")}<button class="ghost" data-act="all-runs">×</button></div>
          ${Object.keys(groups).map(pid => `
            <div class="hd">${esc(project(pid).name)}</div>
            ${groups[pid].map(r => {
              const i = r.issueId ? issue(r.issueId) : null;
              return `<button class="item ${S.runId === r.id ? "sel" : ""}" data-act="run" data-id="${r.id}">
                <div class="t"><b>${i ? "#"+i.id+" "+shortTitle(i.title, 16) : t("free")}</b><span class="tag">${r.status}</span></div>
                <div class="sub">${esc(r.agent)}</div>
              </button>`;
            }).join("")}
          `).join("")}
        </div>`;
    }

    function renderPhone() {
      if (S.scenario === "unpaired") {
        return `<div class="phone-stage"><div class="phone">
          <div class="phone-bar row"><b>Client</b><span class="grow"></span>${directionToggle()}</div>
          <div class="phone-body pad stack">
            <b>${t("unpairedTitle")}</b>
            <div class="muted">${t("unpairedBody")}</div>
            <button class="primary" data-act="pair">${t("pairNow")}</button>
          </div>
        </div>${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}</div>`;
      }
      const body = S.phone === "issue" ? phoneIssue() : S.phone === "run" ? phoneRun() : phoneHome();
      return `
        <div class="phone-stage">
          <div class="phone">
            <div class="phone-bar">
              <div class="row">
                ${S.phone !== "home" ? `<button data-act="phone" data-id="home">返回</button>` : `<b>Client</b>`}
                <span class="grow"></span>
                ${directionToggle()}
              </div>
              <div class="tiny">${t("phoneNote")}</div>
            </div>
            <div class="phone-body">${body}</div>
            <div class="phone-tabbar">
              <button class="${S.phone === "home" ? "active" : ""}" data-act="phone" data-id="home">态势</button>
              <button class="${S.phone === "run" ? "active" : ""}" data-act="phone" data-id="run">Run</button>
              <button data-act="pair">${t("pair")}</button>
            </div>
          </div>
          ${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}
        </div>`;
    }
    function phoneHome() {
      const list = S.projectId ? boardIssues().concat(recentClosed()) : [];
      return `
        <div class="pad tiny">${visibleHosts().map(h => hostName(h)).join(" · ")}</div>
        ${visibleProjects().map(p => `
          <button class="item ${S.projectId === p.id ? "sel" : ""}" data-act="project" data-id="${p.id}">${esc(p.name)}</button>
        `).join("")}
        <div class="hd">${t("frontier")}</div>
        ${list.map(i => issueCard(i)).join("") || `<div class="empty">${t("noItems")}</div>`}`;
    }
    function phoneIssue() {
      return issueDetail() + `<div class="banner">${t("phoneNote")}</div>`;
    }
    function phoneRun() {
      const r = run(S.runId) || dockRuns()[0];
      return `
        <div class="hd">Run</div>
        ${r && r.status === "active" ? `<div class="pad"><button data-act="ask-stop">${t("stopRun")}</button></div>` : ""}
        <div class="term" style="min-height:220px">${termText(r)}</div>
        <div class="banner">${t("phoneNote")}</div>`;
    }

    function bind() {
      const sw = document.getElementById("switcher");
      sw.onclick = (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        if (b.dataset.act === "prev" || b.dataset.act === "next") {
          stepDirection(b.dataset.act === "next" ? 1 : -1);
          render();
        }
        if (b.dataset.act === "direction") {
          setDirection(b.dataset.id);
          render();
        }
        if (b.dataset.act === "vp") {
          S.viewport = S.viewport === "desktop" ? "phone" : "desktop";
          render();
        }
        if (b.dataset.act === "inspect") {
          S.inspect = !S.inspect;
          render();
        }
      };
      sw.onchange = (e) => {
        if (e.target.dataset.act === "scenario") {
          applyScenario(e.target.value);
          render();
        }
      };

      const app = document.getElementById("app");
      app.onclick = (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        const act = b.dataset.act;
        const id = b.dataset.id;
        if (act === "host") {
          S.hostId = id;
          S.mapDetailOpen = false;
          S.mapHostOpen = false;
          const first = visibleProjects().find(p => p.hostId === id);
          S.projectId = first ? first.id : null;
          if (S.projectId) restoreMidForProject(S.projectId);
          else S.midMode = "board";
          const firstIssue = S.projectId ? ISSUES.find(i => i.projectId === S.projectId && !i.closed) : null;
          S.issueId = firstIssue ? firstIssue.id : null;
          const firstRun = RUNS.find(r => r.hostId === id && r.status !== "ended");
          S.runId = firstRun ? firstRun.id : null;
          render();
        }
        if (act === "project") {
          S.projectId = id; S.hostId = project(id).hostId; S.childFilter = null; S.mapDetailOpen = false;
          if (S.midMode === "run") setMidMode("board");
          else restoreMidForProject(id);
          const cur = issue(S.issueId);
          if (!cur || cur.projectId !== id) S.issueId = null;
          render();
        }
        if (act === "issue") setIssue(Number(id));
        if (act === "focus-run") {
          S.allRunsOpen = false;
          setRun(id, true);
          setMidMode("run");
          S.detailFolded = false;
          if (S.termZoom === "right") S.termZoom = null;
          render();
        }
        if (act === "toggle-side") { S.sideFolded = !S.sideFolded; render(); }
        if (act === "toggle-detail") {
          S.detailFolded = !S.detailFolded;
          if (!S.detailFolded && S.termZoom === "right") S.termZoom = null;
          render();
        }
        if (act === "toggle-issue-wide") {
          S.issueWide = !S.issueWide;
          if (S.issueWide) {
            S.detailFolded = false;
            if (S.termZoom === "right") S.termZoom = null;
          }
          render();
        }
        if (act === "toggle-recent-more") { S.recentMore = !S.recentMore; render(); }
        if (act === "term-theme") { S.termTheme = S.termTheme === "light" ? "dark" : "light"; render(); }
        if (act === "graph-node") {
          const i = issue(Number(id));
          if (i) {
            S.issueId = i.id;
            S.projectId = i.projectId;
            S.hostId = project(i.projectId).hostId;
          }
          render();
        }
        if (act === "run") { S.allRunsOpen = false; setRun(id); }
        if (act === "toggle-vc") { S.viewChangesOpen = !S.viewChangesOpen; render(); }
        if (act === "base") { S.viewBase = id; render(); }
        if (act === "file") { S.fileKey = id; S.noteLine = null; render(); }
        if (act === "note-line") { S.noteLine = Number(id); render(); }
        if (act === "save-note") {
          const r = run(S.runId);
          const files = FILES[r.id] || [];
          const file = files.find(f => f.path === S.fileKey) || files[0];
          if (file && S.noteLine && S.noteDraft.trim()) {
            S.notes.push({ runId: r.id, repo: file.repo, file: file.path, line: S.noteLine, text: S.noteDraft.trim() });
            S.noteDraft = "";
            S.noteLine = null;
          }
          render();
        }
        if (act === "del-note") { S.notes.splice(Number(id), 1); render(); }
        if (act === "pair") { S.pairing = true; render(); }
        if (act === "close-pair") { S.pairing = false; render(); }
        if (act === "fake-paired") { S.pairing = false; S.scenario = "daily"; applyScenario("daily"); render(); }
        if (act === "ask-stop") {
          if (run(S.runId) && run(S.runId).status === "active") S.stopAsk = true;
          render();
        }
        if (act === "close-stop") { S.stopAsk = false; render(); }
        if (act === "stop-soft" || act === "stop-hard") {
          const r = run(S.runId);
          if (r && r.status === "active") {
            r.status = "stopped";
            const i = r.issueId ? issue(r.issueId) : null;
            if (i) i.stopped = true;
          }
          S.stopAsk = false;
          render();
        }
        if (act === "phone") { S.phone = id; render(); }
        if (act === "settings") { S.settingsOpen = !S.settingsOpen; S.allRunsOpen = false; render(); }
        if (act === "all-runs") { S.allRunsOpen = !S.allRunsOpen; S.settingsOpen = false; render(); }
        if (act === "lang") { S.lang = S.lang === "zh" ? "en" : "zh"; render(); }
        if (act === "direction") { setDirection(id); render(); }
        if (act === "map-nav") {
          if (id === "settings") { S.settingsOpen = true; S.allRunsOpen = false; }
          else if (id === "runs") { S.allRunsOpen = true; S.settingsOpen = false; }
          else if (id === "board") { setMidMode("board"); S.settingsOpen = false; S.allRunsOpen = false; }
          else { S.settingsOpen = false; S.allRunsOpen = false; }
          render();
        }
        if (act === "mid-mode") { setMidMode(id); render(); }
        if (act === "toggle-ctx") { S.showCtx = !S.showCtx; S.cam.user = false; render(); }
        if (act === "reset-cam") { S.cam.user = false; render(); }
        if (act === "toggle-dock") {
          S.dockFolded[S.midMode] = !dockFolded();
          render();
        }
        if (act === "map-search") { S.mapSearchOpen = !S.mapSearchOpen; render(); }
        if (act === "map-host-menu") { S.mapHostOpen = !S.mapHostOpen; render(); }
        if (act === "map-close-detail") { S.mapDetailOpen = false; render(); }
        if (act === "map-notify" || act === "map-nav-back" || act === "map-nav-fwd") {
          alert("原型：入口占位。");
        }
        if (act === "child-filter") { S.childFilter = Number(id); setMidMode("board"); render(); }
        if (act === "clear-filter") { S.childFilter = null; render(); }
        if (act === "term-zoom") { setTermZoom(id || null); return; }
        if (act === "swap-run") {
          if (S.lastRunId) setRun(S.lastRunId);
          return;
        }
        if (act === "register") { alert("原型：登记入口在这里。不真的加 Project。"); }
        if (act === "fake-start" || act === "fake-claim" || act === "fake-release" || act === "fake-continue") {
          alert("原型：只占位，不打到 Tracker / Host。");
        }
        if (act === "open-local") alert("原型：打开\n" + localPath(issue(Number(id))));
        if (act === "reveal-local") alert("原型：显示\n" + localPath(issue(Number(id))));
      };
      app.oninput = (e) => {
        if (e.target.dataset.act === "note-draft") S.noteDraft = e.target.value;
        if (e.target.dataset.act === "set-n") {
          S.recentN = Number(e.target.value);
          const label = app.querySelector("[data-role=n-val]");
          if (label) label.textContent = String(S.recentN);
        }
      };
      app.onchange = (e) => {
        if (e.target.dataset.act === "set-n") {
          S.recentN = Number(e.target.value);
          render();
        }
      };
      const splitHandle = document.querySelector("[data-act=drag-vc]");
      if (splitHandle) {
        splitHandle.onmousedown = (e) => {
          e.preventDefault();
          const split = splitHandle.parentElement;
          const move = (ev) => {
            const rect = split.getBoundingClientRect();
            S.vcPct = Math.min(70, Math.max(18, ((rect.right - ev.clientX) / rect.width) * 100));
            split.style.gridTemplateColumns = `minmax(160px,1fr) 6px ${S.vcPct}%`;
          };
          const up = () => {
            window.removeEventListener("mousemove", move);
            window.removeEventListener("mouseup", up);
          };
          window.addEventListener("mousemove", move);
          window.addEventListener("mouseup", up);
        };
      }
      const svg = app.querySelector("svg[data-act=svg-root]");
      if (svg) {
        let drag = null;
        svg.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".node-card")) return;
          drag = { x: e.clientX, y: e.clientY, cx: S.cam.x, cy: S.cam.y };
          svg.setPointerCapture(e.pointerId);
        });
        svg.addEventListener("pointermove", (e) => {
          if (!drag) return;
          S.cam.x = drag.cx + (e.clientX - drag.x);
          S.cam.y = drag.cy + (e.clientY - drag.y);
          S.cam.user = true;
          const g = svg.querySelector("g");
          if (g) g.setAttribute("transform", `translate(${S.cam.x} ${S.cam.y}) scale(${S.cam.k})`);
        });
        svg.addEventListener("pointerup", () => { drag = null; });
        svg.addEventListener("wheel", (e) => {
          e.preventDefault();
          S.cam.k = Math.min(1.8, Math.max(0.35, S.cam.k * (e.deltaY > 0 ? 0.9 : 1.1)));
          S.cam.user = true;
          const g = svg.querySelector("g");
          if (g) g.setAttribute("transform", `translate(${S.cam.x} ${S.cam.y}) scale(${S.cam.k})`);
        }, { passive: false });
      }
    }

    function setTermZoom(id) {
      if (S.termZoom === id) S.termZoom = null;
      else S.termZoom = id || null;
      const want = S.termZoom === "full";
      if (want && !document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      if (!want && document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      render();
    }

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && S.termZoom === "full") {
        S.termZoom = null;
        render();
      }
    });
    document.addEventListener("keydown", (e) => {
      const el = e.target;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable)) return;
      if (e.key === "Escape" && S.termZoom && S.termZoom !== "full") {
        setTermZoom(null);
        return;
      }
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        stepDirection(e.key === "ArrowRight" ? 1 : -1);
        render();
      }
    });

    loadQS();
    render();
  </script>
</body>
</html>
