<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>原型 · 开 Run 配置与游离 Run 入口</title>
  <!--
    PROTOTYPE — 一次性原型，不是产品。Issue #38：
    「在已定主壳中，从绑定 Issue 或 Project 级入口开 Run 时，怎样选 Agent、填这家自己的启动配置；游离 Run 的入口放在哪里，才不会把 Run 变成第二套工作单元？」

    三种结构不同的入口，共用已钉的 Codex 原貌映射主壳。用量层级冻结为 A（独立页）。
      A  候选：不绑票入口在当前 Project 下方；先选 Agent 再居中填表；按 Project 记住上次启动的 Agent，下次直接进表。
      B  票内配置抽屉（对照）。
      C  每次都先选 Agent（对照，不跳过记忆）。
    ?variant=A|B|C  &viewport=desktop|phone
  -->
  <style>
    :root {
      --sans: "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
      --serif: "Iowan Old Style", "Songti SC", "Noto Serif SC", Palatino, serif;
      --mono: "SF Mono", Menlo, "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    button, select, input, textarea {
      font: inherit;
      color: inherit;
      background: var(--btn);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 3px 8px;
      cursor: pointer;
    }
    button:hover { border-color: var(--line-strong); }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
    button.ghost { background: transparent; }
    button.active { background: var(--sel); border-color: var(--accent); color: var(--accent-ink); }
    input, textarea { background: var(--field); cursor: text; }
    a.ext {
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 2px 8px;
      background: var(--btn);
    }
    .mono { font-family: var(--mono); }

    /* 两个方向复用原型已有的浅色 token；这不是主题清单决策。 */
    .theme-warm-light {
      --desk: #cfc4b0;
      --paper: #fff8ee;
      --paper-2: #f4ead8;
      --card: #fffdf8;
      --ink: #2a2218;
      --on-ink: #fff8ee;
      --muted: #7a6d5c;
      --line: #e2d3bb;
      --line-strong: #c4b191;
      --accent: #c45c26;
      --accent-ink: #7a2e0c;
      --sel: #f3d3b4;
      --run: #2f7d4a;
      --stop: #b42318;
      --block: #b45309;
      --chip: #f3ead8;
      --btn: #fff8ee;
      --field: #fff;
      --term: #241c16;
      --term-fg: #f0e6d6;
      --ident: #3a2c22;
      --who: #fdba74;
      --card-sel: #fff1de;
      --glow: rgba(255,255,255,.7);
      --shadow: 0 18px 40px rgba(60, 40, 16, .18);
      --desk-glow: #e6dcc8;
    }
    .theme-plain-light {
      --desk: #d5d3ce;
      --paper: #fffcf8;
      --paper-2: #f3f2ee;
      --card: #ffffff;
      --ink: #1c1b19;
      --on-ink: #fffcf8;
      --muted: #6f6d68;
      --line: #e3e1db;
      --line-strong: #c6c3bb;
      --accent: #c23b2e;
      --accent-ink: #8a1f16;
      --sel: #fde8e4;
      --run: #2f7d4a;
      --stop: #b42318;
      --block: #b45309;
      --chip: #f3f2ee;
      --btn: #fffcf8;
      --field: #fff;
      --term: #1a1a19;
      --term-fg: #eceae6;
      --ident: #1a1a19;
      --who: #f0a399;
      --card-sel: #fff1ee;
      --glow: rgba(255,255,255,.8);
      --shadow: 0 18px 40px rgba(28, 27, 25, .12);
      --desk-glow: #eceae6;
    }
    .theme-plain-dark {
      --desk: #0e0e0d;
      --paper: #181817;
      --paper-2: #121211;
      --card: #232321;
      --ink: #f4f2ee;
      --on-ink: #181817;
      --muted: #a3a19b;
      --line: #33322f;
      --line-strong: #4d4c48;
      --accent: #e86a5c;
      --accent-ink: #ffd4ce;
      --sel: #3a221f;
      --run: #7ad49a;
      --stop: #f38b82;
      --block: #e0b15a;
      --chip: #232321;
      --btn: #232321;
      --field: #10100f;
      --term: #0b0b0a;
      --term-fg: #f4f2ee;
      --ident: #0b0b0a;
      --who: #f0a399;
      --card-sel: #3d2623;
      --glow: rgba(255,255,255,.05);
      --shadow: 0 20px 48px rgba(0, 0, 0, .55);
      --desk-glow: #1c1c1b;
    }
    .theme-warm {
      --r: 8px;
      --win-r: 12px;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 50% -10%, var(--desk-glow), transparent 55%),
        var(--desk);
    }
    .theme-warm .brand { font-family: var(--serif); font-weight: 600; letter-spacing: .01em; }
    .theme-warm .issue-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 1px 0 var(--glow) inset, 0 6px 14px rgba(28,27,25,.06);
      padding: 10px 11px;
      margin: 8px;
      text-align: left;
      display: block;
      width: calc(100% - 16px);
    }
    .theme-warm .issue-card:hover { transform: translateY(-1px); }
    .theme-warm .issue-card.sel { outline: 2px solid var(--accent); background: var(--card-sel); }
    .theme-warm .col-hd { font-family: var(--serif); }
    .theme-warm .dock { height: 34vh; }
    .theme-warm .ident { background: var(--ident); }
    .theme-warm .traffic i:nth-child(1) { background: #ec6a5e; }
    .theme-warm .traffic i:nth-child(2) { background: #f5bf4f; }
    .theme-warm .traffic i:nth-child(3) { background: #61c554; }
    .direction-pick, .theme-pick {
      width: 100%;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
    }
    .direction-pick > span:first-child,
    .theme-pick > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
    .theme-pick .swatch {
      width: 28px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--line-strong);
      flex: 0 0 auto;
    }
    .theme-pick .swatch.warm-light { background: linear-gradient(135deg, #fff8ee, #cfc4b0); }
    .theme-pick .swatch.plain-light { background: linear-gradient(135deg, #fffcf8, #d5d3ce); }
    .theme-pick .swatch.plain-dark { background: linear-gradient(135deg, #232321, #0e0e0d); }
    .settings-modal { width: min(460px, calc(100vw - 32px)); max-height: min(82vh, 720px); overflow: auto; }

    body {
      font: 13px/1.4 var(--sans);
      color: var(--ink);
      overflow: hidden;
    }
    #app { height: 100%; }
    .stage {
      height: 100%;
      padding: 14px 14px 96px;
    }
    
    .win {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: var(--win-r);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .os-chrome {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      background: var(--paper-2);
      border-bottom: 1px solid var(--line);
      min-height: 34px;
    }
    .traffic { display: flex; gap: 6px; }
    .traffic i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .win-title { font-size: 12px; color: var(--muted); }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      min-height: 42px;
    }
    .host-tab, .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--chip);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a8a29e; flex: 0 0 auto; }
    .dot.on { background: var(--run); }
    .dot.off { background: #8a8f96; }
    .dot.busy { background: var(--accent); }
    .dot.stop { background: var(--stop); }
    .cols {
      flex: 1;
      display: grid;
      grid-template-columns: 196px minmax(340px, 1.3fr) minmax(280px, .95fr);
      min-height: 0;
    }
    .win.single .cols { grid-template-columns: 148px minmax(340px, 1.3fr) minmax(280px, .95fr); }
    .pane {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--paper);
      border-right: 1px solid var(--line);
    }
    .pane:last-child { border-right: 0; overflow: hidden; display: flex; flex-direction: column; }
    .hd, .col-hd {
      margin: 0;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: none;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: var(--paper-2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .item {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      padding: 8px 10px;
      display: block;
    }
    .item:hover { background: var(--paper-2); }
    .item.sel { background: var(--sel); }
    .item .t, .issue-card .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .item .t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .item .sub, .issue-card .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .muted { color: var(--muted); }
    .tiny { font-size: 11px; color: var(--muted); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .grow { flex: 1; }
    .pad { padding: 10px; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 0 6px;
      border-radius: 3px;
      background: var(--chip);
      border: 1px solid var(--line);
    }
    .tag.block { color: var(--block); border-color: color-mix(in srgb, var(--block) 40%, var(--line)); }
    .tag.run { color: var(--run); }
    .tag.stop { color: var(--stop); }
    .lanes {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      min-height: 100%;
    }
    .col { border-right: 1px solid var(--line); min-width: 0; background: var(--paper-2); }
    .col:last-child { border-right: 0; }
    .col.blocked { --lane: var(--block); }
    .col.frontier { --lane: var(--accent); }
    .col.in-run { --lane: var(--run); }
    .col.recent { --lane: #8a8f96; }
    .empty { padding: 22px 12px; text-align: center; color: var(--muted); }
    .empty-strong { max-width: 420px; margin: 8vh auto; text-align: left; }
    .term {
      background: var(--term);
      color: var(--term-fg);
      font: 12px/1.5 var(--mono);
      padding: 10px 12px;
      min-height: 0;
      overflow: auto;
      white-space: pre-wrap;
      flex: 1;
    }
    .term .dim { opacity: .55; }
    .term .ok { color: #86efac; }
    .term .bad { color: #fca5a5; }
    .term .hi { color: #f0a399; }
    .term.light {
      background: #f4f3ef;
      color: #1c1b19;
    }
    .term.light .dim { opacity: .55; color: #5c5b57; }
    .term.light .ok { color: #1f7a3d; }
    .term.light .bad { color: #b42318; }
    .term.light .hi { color: #9a3412; }
    .ident.light {
      background: #eceae6;
      color: #1c1b19;
    }
    .ident.light button { background: #fff; color: #1c1b19; border-color: #d4d2cc; }
    .ident.light .who { color: #9a3412; }
    
    .diff { font: 12px/1.5 var(--mono); }
    .diff .add { background: color-mix(in srgb, var(--run) 16%, transparent); }
    .diff .del { background: color-mix(in srgb, var(--stop) 16%, transparent); }
    .diff .ln { display: grid; grid-template-columns: 36px 1fr 28px; gap: 8px; padding: 1px 8px; }
    .note-pill {
      background: var(--sel);
      border: 1px solid var(--accent);
      border-radius: var(--r);
      padding: 4px 6px;
      font-size: 12px;
    }
    .dock {
      border-top: 1px solid var(--line);
      background: var(--paper);
      min-height: 140px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); background: var(--paper-2); overflow-x: auto; }
    .tabs .grp { display: flex; align-items: stretch; border-right: 1px solid var(--line); }
    .tabs .gname { padding: 6px 8px; font-size: 11px; color: var(--muted); align-self: center; white-space: nowrap; }
    .tabs button { border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; padding: 6px 10px; white-space: nowrap; }
    .tabs button.sel { background: var(--ink); color: var(--on-ink); }
    .ident {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      color: #f5f5f4;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .ident button { background: #3f3f46; color: #fff; border-color: #52525b; }
    .ident .who { color: var(--who, #fdba74); font-weight: 650; }
    .theme-warm .ident .who { color: var(--who, #fdba74); }
    .term-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .split { display: grid; min-height: 0; flex: 1; }
    .splitter { cursor: col-resize; background: var(--line); width: 6px; }
    .splitter:hover { background: var(--accent); }
    .block {
      border: 1px solid var(--line);
      background: var(--paper-2);
      padding: 8px;
      border-radius: var(--r);
    }
    .block h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .name-btn { text-align: left; }
    .zoom-stage {
      position: fixed;
      inset: 0;
      z-index: 18;
      background: #0c0a09;
      display: flex;
      flex-direction: column;
      padding-bottom: 72px;
    }
    .zoom-stage.full { padding-bottom: 0; }
    .zoom-stage.right {
      left: auto;
      width: min(46vw, 640px);
      border-left: 1px solid #3f3f46;
      padding-bottom: 72px;
    }
    .zoom-stage.light { background: #f4f3ef; }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 12, .4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 22;
    }
    .modal {
      width: min(440px, calc(100vw - 32px));
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sheet {
      position: fixed;
      top: 44px;
      right: 16px;
      width: min(320px, calc(100vw - 24px));
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      z-index: 21;
      max-height: calc(100vh - 120px);
      overflow: auto;
    }
    
    .phone-stage {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 96px;
    }
    .phone {
      width: 390px;
      height: min(780px, calc(100vh - 130px));
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }
    .phone-bar { padding: 11px 12px 9px; border-bottom: 1px solid var(--line); background: var(--paper); }
    .phone-body { flex: 1; overflow: auto; background: #f6f6f4; }
    .theme-plain-dark .phone-body { background: #171716; }
    .phone-tabbar { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--line); }
    .phone-tabbar button { border: 0; border-radius: 0; padding: 12px 4px; background: var(--paper); }
    .phone-tabbar button.active { background: var(--sel); font-weight: 680; }
    .phone-sec { padding: 12px 14px 4px; font-size: 11px; color: var(--muted); }
    .phone .item { width: calc(100% - 16px); margin: 4px 8px; text-align: left; padding: 10px 12px; }
    .phone-bar .row { align-items: center; }
    .phone-current {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .phone-current-copy { flex: 1; min-width: 0; }
    .phone-current-copy b,
    .phone-current-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .phone-current-copy b { font-size: 15px; letter-spacing: -.01em; }
    .phone-current-copy span { color: var(--muted); font-size: 10px; margin-top: 1px; }
    .phone-context-panel {
      margin: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .07);
    }
    .phone-context-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .phone-context-group + .phone-context-group { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
    .phone-context-label { color: var(--muted); font-size: 10px; margin-bottom: 5px; }
    .phone-context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .phone-context-grid button { min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .phone-context-grid button.active { background: var(--sel); border-color: var(--line-strong); font-weight: 650; }
    .phone-home-actions { display: flex; gap: 7px; padding: 2px 10px 8px; }
    .phone-board { padding: 2px 10px 18px; display: flex; flex-direction: column; gap: 12px; }
    .phone-board-section {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
    }
    .phone-board-section.running { border-color: #c8d9ce; box-shadow: 0 8px 24px rgba(36, 92, 57, .08); }
    .theme-plain-dark .phone-board-section.running { border-color: #365440; }
    .phone-board-head {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding: 10px 11px 8px;
      border-bottom: 1px solid var(--line);
      background: var(--paper-2);
    }
    .phone-board-section.running .phone-board-head { background: #f2f8f3; }
    .theme-plain-dark .phone-board-section.running .phone-board-head { background: #1c291f; }
    .phone-board-head b { font-size: 13px; }
    .phone-board-head span { color: var(--muted); font-size: 10px; }
    .phone-run-card { padding: 10px 11px; }
    .phone-run-card + .phone-run-card { border-top: 1px solid var(--line); }
    .phone-run-main {
      width: 100%;
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .phone-run-main:hover { background: transparent; }
    .phone-run-title { font-weight: 650; margin: 3px 0 6px; }
    .phone-run-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; }
    .phone-run-actions { display: flex; gap: 6px; margin-top: 9px; }
    .phone-run-actions .primary { flex: 1; }
    .phone-frontier-list .issue-card { width: calc(100% - 14px); margin: 7px; }
    .phone-empty-section { padding: 16px 11px; color: var(--muted); font-size: 11px; }
    .banner {
      margin: 8px 10px;
      padding: 8px 10px;
      background: color-mix(in srgb, var(--block) 18%, var(--paper));
      border: 1px solid color-mix(in srgb, var(--block) 40%, var(--line));
      border-radius: var(--r);
    }
    .cta {
      margin: 24px 16px;
      padding: 20px;
      background: var(--paper);
      border: 1px dashed var(--line-strong);
      border-radius: var(--r);
    }
    #switcher {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #1c1917;
      color: #fff;
      border-radius: 999px;
      padding: 6px 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      max-width: calc(100vw - 16px);
    }
    #switcher button, #switcher select {
      background: #292524;
      color: #fff;
      border-color: #44403c;
      border-radius: 999px;
    }
    #switcher select { padding: 4px 10px; }
    #switcher .lab { font-size: 12px; padding: 0 6px; white-space: nowrap; }
    #inspector {
      display: none;
      position: fixed;

    function renderMd(src) {
      const raw = String(src || "").replace(/\r\n/g, "\n");

      const fence = /```[^\n]*\n([\s\S]*?)```/g;
      let last = 0, m;
      while ((m = fence.exec(raw))) {
        if (m.index > last) chunks.push(["md", raw.slice(last, m.index)]);
        chunks.push(["pre", m[1]]);
        last = m.index + m[0].length;
      }
      if (last < raw.length) chunks.push(["md", raw.slice(last)]);
      return chunks.map(([kind, text]) => {
        if (kind === "pre") return `<pre class="md-pre"><code>${esc(text)}</code></pre>`;
        return text.trim().split(/\n{2,}/).map(block => {
          const lines = block.split("\n");
          if (/^###\s/.test(lines[0])) return `<h4>${inlineMd(lines[0].replace(/^###\s+/, ""))}</h4>${lines.length > 1 ? `<p>${lines.slice(1).map(inlineMd).join("<br>")}</p>` : ""}`;

          if (lines.every(l => /^[-*]\s+/.test(l))) return `<ul>${lines.map(l => `<li>${inlineMd(l.replace(/^[-*]\s+/, ""))}</li>`).join("")}</ul>`;

          return `<p>${lines.map(inlineMd).join("<br>")}</p>`;
        }).join("");
      }).join("");

    function layoutDag(ids) {
      const idSet = new Set(ids);
      const preds = {};
      for (const id of ids) preds[id] = [];
      for (const id of ids) {
        const iss = issue(id);
        if (!iss) continue;
        for (const b of iss.blockedBy) {
          if (idSet.has(b)) preds[id].push(b);
        }
      }
      const layer = {};
      const stack = new Set();
      function depth(id) {
        if (layer[id] != null) return layer[id];
        if (stack.has(id)) return 0;
        stack.add(id);
        const p = preds[id];
        layer[id] = p.length ? Math.max(...p.map(depth)) + 1 : 0;
        stack.delete(id);
        return layer[id];
      }
      ids.forEach(depth);
      const byLayer = {};
      for (const id of ids) (byLayer[layer[id]] ||= []).push(id);

      const pos = {};

      for (const L of layers) {

        });
        maxH = Math.max(maxH, row.length * (NH + GY) - GY);
      }
      const width = 40 + layers.length * (NW + GX) - GX;
      const height = 40 + maxH;
      return { pos, width: Math.max(width, 360), height: Math.max(height, 200) };

              <div class="traffic"><i></i><i></i><i></i></div>
              <div class="win-title">Agent Taskboard${h ? " — " + esc(hostName(h)) : ""}</div>
              <span class="grow"></span>
              <span class="direction-note">${esc(S.lang === "en" ? directionOf(S.direction).noteEn : directionOf(S.direction).note)}</span>
            </div>
            <div class="topbar">
              <span class="brand">Agent Taskboard</span>
              ${visibleHosts().map(hh => `
                <button class="host-tab ${hh.id === S.hostId ? "active" : ""}" data-act="host" data-id="${hh.id}">
                  <span class="dot ${hh.online ? "on" : "off"}"></span>${esc(hostName(hh))}
                </button>`).join("")}

              <span class="grow"></span>
              ${directionToggle()}
              ${overviewBtn()}
              ${autoArmed() ? `<button type="button" class="chip" data-act="settings">${esc(t("autoAdvanceOn"))}</button>` : ""}
              ${appearanceBtn()}
              ${settingsBtn()}
            </div>
            <div class="cols ${S.issueWide ? "issue-wide" : ""}">

                <div class="hd">${t("projects")}</div>

                <div class="pad">
                  <button data-act="register">${visibleProjects().length ? t("registerAgain") : t("register")}</button>
                  <div class="tiny" style="margin-top:8px">${t("filterProject")}</div>
                </div>
              </div>
              <div class="pane mid-rel">${!S.projectId ? noProjectMid() : S.midMode === "graph" ? graphPane() : S.midMode === "overview" ? overviewPane() : board()}</div>

          </div>
        </div>
        ${S.termZoom && !(S.direction === "codex-map" && S.termZoom === "right") ? termZoomStage(r) : ""}
        ${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}
        ${S.settingsOpen ? settingsSheet() : ""}
        ${S.allRunsOpen ? allRunsSheet() : ""}`;
    }

    /* Codex 原貌映射：左侧原生栏 + 白主区。中间看板/图，底栏占自己的高度。 */
    function renderMap() {
      const r = run(S.runId);
      const usageOpen = S.midMode === "usage" || S.usageSheet || (S.midMode === "overview" && S.variant === "C" && S.usageTab === "usage") || S.usageState === "unreachable";
      const empty = S.scenario === "unpaired" ? "unpaired" : (!S.projectId && !usageOpen) ? "noproject" : null;
      const live = selectedLiveRun() || r;
      const noSnapshot = !refreshMeta().hasSnapshot;
      const fillRight = S.termZoom === "right";
      const hideDetail = S.detailFolded || fillRight || noSnapshot || S.midMode === "usage" || (S.midMode === "overview" && S.variant === "C" && S.usageTab === "usage");
      const termOnRight = fillRight && S.midMode !== "run" && live && !noSnapshot;
      const mid = S.midMode === "graph" ? graphPane()
        : S.midMode === "run" ? runPane(live)
        : S.midMode === "overview" ? (S.variant === "C" && S.usageTab === "usage" ? usagePaneC() : overviewPane())
        : S.midMode === "usage" ? usagePaneA()
        : board();
      return `
        <div class="stage">
          <div class="map-frame ${S.sideFolded ? "side-folded" : ""}">
            <div class="map-chrome">
              <div class="map-chrome-lead">
                <div class="traffic"><i></i><i></i><i></i></div>
                ${sideToggle()}
                ${settingsBtn(true)}
                ${S.variant === "B" && !empty ? usageBtn() : ""}
              </div>
              <div class="map-chrome-main">${empty ? "" : midBar()}</div>
              <div class="map-chrome-trail">${empty ? "" : `${overviewBtn()}${S.variant === "A" ? usageBtn() : ""}`}${autoArmed() ? `<button type="button" class="chip" data-act="settings" title="${esc(t("autoAdvanceHelp"))}">${esc(t("autoAdvanceOn"))}</button>` : ""}${appearanceBtn()}${empty || S.midMode === "usage" || (S.midMode === "overview" && S.variant === "C" && S.usageTab === "usage") ? "" : detailToggle()}</div>
            </div>
            <div class="map-body">
              ${S.sideFolded ? "" : mapSidebar()}
              <div class="map-workspace">
                ${empty ? mapEmpty(empty) : `
                  <div class="map-cols ${hideDetail && !termOnRight ? "no-detail" : ""} ${termOnRight ? "with-term-col" : ""} ${!hideDetail && S.issueWide ? "issue-wide" : ""} ${!hideDetail && !S.issueWide && S.midMode === "run" ? "run-read" : ""}">
                    <div class="map-mid">${mid}</div>
                    ${termOnRight ? `<aside class="map-term-col">${termChrome(live)}${termSplit(live)}</aside>` : ""}
                    ${hideDetail ? "" : `<aside class="map-detail-col">${issueDetail()}</aside>`}
                  </div>
                  ${noSnapshot ? "" : bottomDock(live)}
                `}
                ${S.variant === "B" && S.usageSheet && !empty ? usageSheet() : ""}
              </div>
            </div>
          </div>
        </div>
        ${S.termZoom && S.termZoom !== "right" ? termZoomStage(r) : ""}
        ${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}
        ${S.settingsOpen ? settingsSheet() : ""}
        ${S.allRunsOpen ? allRunsSheet() : ""}
        ${S.refreshOpen ? refreshPopover() : ""}
        ${launchOverlay()}`;
    }

    function mapSidebar() {
      const hs = visibleHosts();
      const plist = hostProjects();
      return `
        <aside class="map-side">
          <div class="ms-groups">
            <div class="ms-group">
              <div class="ms-group-name">${esc(t("hosts"))}</div>
              ${hs.map(hh => `
                <button class="ms-item ${S.hostId === hh.id ? "active" : ""}" data-act="host" data-id="${hh.id}">
                  <span class="dot ${hh.online ? "on" : "off"}"></span>${esc(hostName(hh))}
                </button>`).join("") || `<div class="ms-nested">${esc(t("unpairedTitle"))}</div>`}
              <button class="ms-item" data-act="pair">+ ${esc(t("pair"))}</button>
              <button class="ms-item ${S.midMode === "overview" ? "active" : ""}" data-act="mid-mode" data-id="overview">${esc(t("overview"))}</button>
              ${S.variant === "A" ? `<button class="ms-item ${S.midMode === "usage" ? "active" : ""}" data-act="mid-mode" data-id="usage">${esc(t("usage"))}</button>` : ""}
              ${S.variant === "B" ? `<button class="ms-item ${S.usageSheet ? "active" : ""}" data-act="usage-open">${esc(t("usage"))}</button>` : ""}
            </div>
            <div class="ms-group">
              <div class="ms-group-name">${esc(t("thisHostProjects"))}</div>
              ${plist.map(pp => {
                const runs = projectDockRuns(pp.id);
                return `
                  <button class="ms-item ${S.projectId === pp.id ? "active" : ""}" data-act="project" data-id="${pp.id}">
                    ${esc(pp.name)}<span class="ms-tag">${esc(pp.tracker)}</span>
                  </button>
                  ${S.projectId === pp.id ? refreshProjectRow() : ""}
                  ${runs.map(rr => {
                    const ii = rr.issueId ? issue(rr.issueId) : null;
                    const label = ii ? `#${ii.id} ${shortTitle(ii.title, 14)}` : t("free");
                    return `<button class="ms-nested ${S.runId === rr.id ? "active" : ""}" data-act="focus-run" data-id="${rr.id}">
                      <span class="dot ${rr.status === "active" ? "busy" : rr.status === "stopped" ? "stop" : "off"}"></span>${esc(label)}
                    </button>`;
                  }).join("") || (S.projectId === pp.id ? `<div class="ms-nested">${esc(t("noDockRuns"))}</div>` : "")}
                  ${S.projectId === pp.id ? `<button class="ms-nested" data-act="open-launch" data-kind="free">${esc(freeLaunchLabel())}</button>` : ""}`;
              }).join("") || `<div class="ms-nested">${esc(t("noProjectTitle"))}</div>`}
              <button class="ms-item" data-act="register">+ ${esc(plist.length ? t("registerAgain") : t("register"))}</button>
            </div>
          </div>
          <span class="grow"></span>
        </aside>`;
    }

    function mapEmpty(kind) {
      const body = kind === "unpaired" ? `
          <div class="brand">${t("unpairedTitle")}</div>
          <p class="muted">${t("unpairedBody")}</p>
          <div><button class="primary" data-act="pair">${t("pairNow")}</button></div>` : `
          <div class="brand">${t("noProjectTitle")}</div>
          <p class="muted">${t("noProjectBody")}</p>
          <div><button class="primary" data-act="register">${t("register")}</button></div>`;
      return `<div class="map-empty-strong">${body}</div>`;
    }

    function midBar() {
      const h = host(S.hostId);
      const p = project(S.projectId);
      const cur = S.midMode === "run" && S.ovReturn ? overviewCursor() : null;
      return `
        <div class="mid-bar">
          ${S.midMode === "run" ? `
            ${S.ovReturn
              ? `<button class="nav-back" data-act="back-overview" aria-label="${esc(t("backOverview"))}">← ${esc(t("backOverview"))}</button>`
              : `<button class="nav-back" data-act="restore-dock">← ${S.lang === "en" ? "Back to board" : "返回看板"}</button>`}
            ${cur ? `
              <button class="ov-step" data-act="ov-step" data-id="prev" ${cur.prev ? "" : "disabled"}>${esc(t("ovPrev"))}</button>
              <span class="tiny">${cur.idx + 1} / ${cur.list.length}</span>
              <button class="ov-step" data-act="ov-step" data-id="next" ${cur.next ? "" : "disabled"}>${esc(t("ovNext"))}</button>
            ` : `<span class="tiny">${esc(t("runFocusHint"))}</span>`}
          ` : S.midMode === "usage" ? `
            <button class="nav-back" data-act="mid-mode" data-id="board">← ${esc(t("backBoard"))}</button>
            <span class="tiny">${esc(t("usageHint"))}</span>
          ` : S.midMode === "overview" && S.variant === "C" ? `
            <button data-act="usage-tab" data-id="runs" class="${S.usageTab !== "usage" ? "active" : ""}">${esc(t("usageRunTab"))}</button>
            <button data-act="usage-tab" data-id="usage" class="${S.usageTab === "usage" ? "active" : ""}">${esc(t("usage"))}</button>
            <span class="tiny">${esc(S.usageTab === "usage" ? t("usageHint") : t("overviewHint"))}</span>
          ` : `
            <button data-act="mid-mode" data-id="board" class="${S.midMode === "board" ? "active" : ""}">${esc(t("boardView"))}</button>
            <button data-act="mid-mode" data-id="graph" class="${S.midMode === "graph" ? "active" : ""}">${esc(t("depGraph"))}</button>
            <span class="tiny">${esc(S.midMode === "overview" ? t("overviewHint") : t("graphEntry"))}</span>
          `}
          <span class="grow"></span>
          ${h ? `<span class="chip">${esc(hostName(h))}${p ? " · " + esc(p.name) : ""}</span>` : ""}
        </div>`;
    }

    function paneMidBar() {
      return S.direction === "codex-map" ? "" : midBar();
    }

    function runPane(r) {
      return `
        ${paneMidBar()}
        <div class="run-stage">
          ${termChrome(r)}
          ${termSplit(r)}
        </div>`;
    }

    function renderSvg() {
      const ids = graphIds();
      if (!ids.length) return `<div class="empty">${esc(t("noItems"))}</div>`;
      const { pos, width, height } = layoutDag(ids);
      if (!S.cam.user) {
        const focus = pos[S.issueId] || Object.values(pos)[0];
        S.cam.k = 1;
        if (focus) {
          S.cam.x = 280 - (focus.x + focus.w / 2);
          S.cam.y = 150 - (focus.y + focus.h / 2);
        }
      }
      const depEdges = [];
      for (const id of ids) {
        const iss = issue(id);
        for (const b of iss.blockedBy) {
          if (pos[b] && pos[id]) depEdges.push({ from: b, to: id, closed: !!(issue(b).closed || iss.closed) });
        }
      }
      const node = (id) => {
        const i = issue(id);
        const p = pos[id];
        const cur = id === S.issueId;
        const closed = !!i.closed;
        const fill = cur ? "#ececea" : closed ? "#f5f5f4" : "#ffffff";
        const stroke = cur ? "#1a1a19" : closed ? "#b0b0ac" : "#d0d0cc";
        const dash = closed ? "4 3" : "none";
        const title = `#${id} ${shortTitle(i.title, 12)}`;
        const sub = closed ? (S.lang === "en" ? "Closed · context" : "已关闭 · 上下文")
          : sectionOf(i) === "blocked" ? t("blocked")
          : sectionOf(i) === "in-run" ? t("inRun")
          : t("frontier");
        return `
          <g class="node-card" data-act="graph-node" data-id="${id}">
            <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8"
              fill="${fill}" stroke="${stroke}" stroke-width="${cur ? 2 : 1}" stroke-dasharray="${dash}" />
            <text x="${p.x + 10}" y="${p.y + 20}" font-size="12" font-weight="650" fill="#1a1a19">${esc(title)}</text>
            <text x="${p.x + 10}" y="${p.y + 36}" font-size="10" fill="#8a8a86">${esc(sub)}</text>
          </g>`;
      };
      const depPath = (e) => {
        const a = pos[e.from], b = pos[e.to];
        const x1 = a.x + a.w, y1 = a.y + a.h / 2;
        const x2 = b.x, y2 = b.y + b.h / 2;
        const mid = (x1 + x2) / 2;
        const col = e.closed ? "#b0b0ac" : "#6f6e6b";
        const dash = e.closed ? "5 4" : "none";
        return `<path d="M${x1} ${y1} C${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="1.5" stroke-dasharray="${dash}" marker-end="${e.closed ? "url(#arr-off)" : "url(#arr)"}" />`;
      };
      return `
        <svg viewBox="0 0 800 420" data-act="svg-root" data-w="${width}" data-h="${height}">
          <defs>
            <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#6f6e6b" />
            </marker>
            <marker id="arr-off" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#b0b0ac" />
            </marker>
          </defs>
          <g transform="translate(${S.cam.x} ${S.cam.y}) scale(${S.cam.k})">
            <rect x="-400" y="-400" width="${width + 800}" height="${height + 800}" fill="transparent" data-act="svg-bg" />
            ${depEdges.map(depPath).join("")}
            ${ids.map(node).join("")}
          </g>
        </svg>`;
    }

    function graphPane() {
      const all = graphIds();
      const extras = all.filter(id => issue(id).closed);
      const iso = isolatedIds(all);
      const i = issue(S.issueId);
      const meta = refreshMeta();
      return `
        <div class="graph-sheet">
          ${paneMidBar()}
          ${refreshBoardLead()}
          ${!meta.hasSnapshot ? refreshEmptyState() : `
            <div class="graph-toolbar">
              <span class="chip">${all.length} · ${S.lang === "en" ? "isolated" : "孤立"} ${iso.length} · ${S.lang === "en" ? "closed" : "已关闭"} ${extras.length} · #${i ? i.id : "?"}</span>
              <button data-act="toggle-ctx" class="${S.showCtx ? "active" : ""}">${S.showCtx ? t("closedCtxOn") : t("showClosedCtx")}</button>
              <button data-act="reset-cam">${t("resetCam")}</button>
              <span class="tiny">${esc(t("graphHint"))}</span>
            </div>
            <div class="tiny pad">${esc(t("graphIso"))}</div>
            <div class="graph-canvas">${renderSvg()}</div>`}
        </div>`;
    }

    function overviewPane() {
      const plist = hostProjects();
      const runs = overviewRuns();
      const groups = [
        { k: "waiting", title: t("ovWaiting"), help: t("ovWaitingHelp") },
        { k: "active", title: t("ovActive") },
        { k: "stopped", title: t("ovStopped") },
        { k: "ended", title: t("ovEnded") }
      ];
      const allOn = !S.ovFilter.length;
      return `
        ${paneMidBar()}
        <div class="ov">
          <div class="ov-tools">
            <button data-act="ov-proj" data-id="all" class="${allOn ? "active" : ""}">${esc(t("ovAllProjects"))}</button>
            ${plist.map(p => `
              <button data-act="ov-proj" data-id="${p.id}" class="${!allOn && S.ovFilter.includes(p.id) ? "active" : ""}">${esc(p.name)}</button>
            `).join("")}
            <span class="grow"></span>
            <button data-act="ov-ended" class="${S.ovShowEnded ? "active" : ""}">${S.ovShowEnded ? t("ovHideEnded") : t("ovShowEnded")}</button>
          </div>
          ${runs.length ? groups.map(g => {
            const items = runs.filter(r => runAttention(r) === g.k);
            if (!items.length) return "";
            return `
              <section class="ov-group">
                <div class="ov-group-hd"><b>${esc(g.title)}</b><span class="tiny">${items.length}</span>${g.help ? `<span class="tiny">· ${esc(g.help)}</span>` : ""}</div>
                <div class="ov-grid">
                  ${items.map(r => {
                    const i = r.issueId ? issue(r.issueId) : null;
                    const p = project(r.projectId);
                    const kind = runAttention(r);
                    return `
                      <button class="ov-tile ${S.runId === r.id ? "sel" : ""} ${kind === "waiting" ? "wait" : kind === "stopped" ? "stop" : ""}" data-act="ov-run" data-id="${r.id}" title="${esc(t("ovOpenHint"))}">
                        <div class="ov-cap">
                          <div class="row">
                            <span class="dot ${r.status === "active" ? (r.wait ? "stop" : "busy") : r.status === "stopped" ? "stop" : "off"}"></span>
                            <b>${esc(i ? "#" + i.id + " " + shortTitle(i.title, 18) : t("free"))}</b>
                          </div>
                          <div class="tiny">${esc(p.name)} · ${esc(r.agent)}</div>
                        </div>
                        <div class="ov-mini term ${termSkin()}">${esc(termPreview(r))}</div>
                      </button>`;
                  }).join("")}
                </div>
              </section>`;
          }).join("") : `<div class="empty">${esc(t("ovEmpty"))}</div>`}
        </div>`;
    }

    function projectList() {
      const list = visibleProjects().filter(p => !S.hostId || p.hostId === S.hostId);
      if (!list.length) {
        return `<div class="empty">${t("noProjectTitle")}</div>`;
      }
      return list.map(p => `
        <button class="item ${S.projectId === p.id ? "sel" : ""}" data-act="project" data-id="${p.id}">
          <div class="t"><b>${esc(p.name)}</b><span class="tag">${esc(p.tracker)}</span></div>
        </button>`).join("");
    }

    function issueCard(i, col) {
      const r = issueRun(i);
      const ended = RUNS.find(x => x.issueId === i.id && x.status === "ended" && S.runId === x.id);
      const tags = [];
      if (i.closed) tags.push(`<span class="tag">${t("closed")}</span>`);
      if (sectionOf(i) === "blocked") tags.push(`<span class="tag block">${t("blocked")}</span>`);
      if (r && r.status === "active") tags.push(`<span class="tag run">Run</span>`);
      if ((r && r.status === "stopped") || i.stopped) tags.push(`<span class="tag stop">${t("stopped")}</span>`);
      if (ended) tags.push(`<span class="tag">${t("ended")}</span>`);
      return `
        <button class="issue-card ${S.issueId === i.id ? "sel" : ""}" data-act="issue" data-id="${i.id}">
          <div class="t"><b class="mono">#${i.id}</b><span class="tiny">${esc(i.closedAgo || "")}</span></div>
          <div>${esc(shortTitle(i.title, 28))}</div>
          <div class="sub">${tags.join(" ")}</div>
        </button>`;
    }

    function frontierEmptyText() {
      if (S.scenario === "emptyfront") return t("noFrontierBlocked");
      const list = boardIssues();
      const open = projectIssues().filter(i => !i.closed && !isTriage(i));
      if (!open.length) return t("noFrontierEmpty");
      if (open.every(i => i.claimed || issueRun(i))) return t("noFrontierClaimed");
      if (open.every(i => openBlockers(i).length || i.claimed || issueRun(i))) return t("noFrontierBlocked");
      return t("noItems");
    }

    function board() {
      const list = boardIssues();
      const rec = recentClosed();
      const meta = refreshMeta();
      const cols = [
        ["blocked", t("blocked"), list.filter(i => sectionOf(i) === "blocked")],
        ["frontier", t("frontier"), list.filter(i => sectionOf(i) === "frontier")],
        ["in-run", t("inRun"), list.filter(i => sectionOf(i) === "in-run")]
      ];
      const hint = S.childFilter ? t("childHint") : t("boardHint");
      const recAll = allRecentClosed();
      return `
        ${paneMidBar()}
        ${refreshBoardLead()}
        ${!meta.hasSnapshot ? refreshEmptyState() : `
          <div class="tiny pad">${esc(hint)}
            ${S.childFilter ? `<button data-act="clear-filter">${t("clearFilter")}</button>` : ""}
            ${meta.blocksTrackerWrites ? `<div class="refresh-disabled-note">${S.lang === "en" ? "Tracker writes and auto advance are paused until refresh succeeds." : "刷新成功前，认领、放领和自动推进暂停；上次数据只供查看。"}</div>` : ""}
          </div>
          <div class="lanes">
            ${cols.map(([key, name, items]) => `
              <div class="col ${key}">
                <div class="col-hd">${name} <span>${items.length}</span></div>
                ${items.map(i => issueCard(i, key)).join("") || `<div class="empty">${key === "frontier" ? frontierEmptyText() : t("noItems")}</div>`}
              </div>`).join("")}
            <div class="col recent">
              <div class="col-hd">${t("recent")} <span>${rec.length}/${recAll.length}</span></div>
              ${rec.map(i => issueCard(i, "recent")).join("") || `<div class="empty">${t("noRecent")}</div>`}
              <div class="tiny pad">${t("recentNote")}</div>
              ${recAll.length > S.recentN ? `<div class="pad"><button class="ghost" data-act="toggle-recent-more">${S.recentMore ? t("recentLess") : t("recentMore")}</button></div>` : ""}
            </div>
          </div>`}
      `;
    }

    function noProjectMid() {
      return `
        <div class="cta stack">
          <b>${t("noProjectTitle")}</b>
          <div class="muted">${t("noProjectBody")}</div>
          <div><button class="primary" data-act="register">${t("register")}</button></div>
        </div>`;
    }

    function nameBtn(i) {
      if (!i) return "";
      const extra = i.closed ? " · " + t("closed") : sectionOf(i) === "blocked" ? " · " + t("blocked") : "";
      return `<button class="name-btn" data-act="issue" data-id="${i.id}">#${i.id} ${esc(shortTitle(i.title, 18))}${extra}</button>`;
    }

    function issueDetail() {
      const i = issue(S.issueId);
      if (!i) return `<div class="empty">${t("pickIssue")}</div>`;
      const p = project(i.projectId);
      const par = parentOf(i);
      const kids = childrenOf(i.id);
      const blockers = i.blockedBy.map(issue).filter(Boolean);
      const blocks = i.blocking.map(issue).filter(Boolean);
      const r = issueRun(i) || RUNS.find(x => x.issueId === i.id && S.runId === x.id);

    function computeModelBaseline(calls) {
      if (!calls || !calls.length) return { medianTtft: 0, medianTps: 0, maxTtft: 1000 };
      const ttfts = calls.map(c => c.ttft).filter(n => n != null).sort((a, b) => a - b);
      const tpss = calls.map(c => c.tps).filter(n => n != null).sort((a, b) => a - b);
      const medianTtft = ttfts.length ? ttfts[Math.floor(ttfts.length / 2)] : 0;
      const medianTps = tpss.length ? tpss[Math.floor(tpss.length / 2)] : 0;
      const maxTtft = ttfts.length ? Math.max(...ttfts, 1000) : 1000;
      return { medianTtft, medianTps, maxTtft };
    }

    function renderModelTrackCard(m, r) {
      const calls = m.recentCalls || [];
      const baseline = computeModelBaseline(calls);
      const isCallSpike = (c) => {
        if (c.status === "slow" || c.jitter) return true;
        if (c.ttft != null && baseline.medianTtft > 0 && c.ttft > baseline.medianTtft * 2.5 && (c.ttft - baseline.medianTtft) > 500) return true;
        if (c.tps != null && baseline.medianTps > 0 && c.tps < baseline.medianTps * 0.4) return true;
        return false;
      };
      const latestCall = calls[calls.length - 1] || {};
      const latestIsSpike = isCallSpike(latestCall);
      const hasSlow = m.hasJitter || calls.some(isCallSpike);
      const maxT = Math.max(baseline.maxTtft, 1000);

      return `
        <div class="track-card ${m.status === "inactive" ? "history-card" : ""}">
          <div class="track-card-hd">
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="role-badge ${m.role}">${esc(S.lang === "en" ? m.roleLabelEn : m.roleLabel)}</span>
              <span class="telemetry-model-name">${esc(m.model)}</span>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              ${latestCall.ttft != null ? `<span class="telemetry-speed-tag ${latestIsSpike ? "slow" : "ok"}">${latestCall.ttft}ms</span>` : ""}
              ${latestCall.tps != null ? `<span class="telemetry-speed-tag ${latestIsSpike ? "slow" : "ok"}">${latestCall.tps} t/s</span>` : ""}
            </div>
          </div>
          <div class="track-fields">
            <div class="track-field"><div class="k">输入</div><div class="v">${m.input == null ? "—" : fmtTok(m.input)}</div></div>
            <div class="track-field"><div class="k">输出</div><div class="v">${m.output == null ? "—" : fmtTok(m.output)}</div></div>
            <div class="track-field"><div class="k">缓存读</div><div class="v">${m.cacheRead == null ? "—" : fmtTok(m.cacheRead)}</div></div>
            <div class="track-field"><div class="k">缓存写</div><div class="v">${m.cacheWrite == null ? "—" : fmtTok(m.cacheWrite)}</div></div>
            <div class="track-field"><div class="k">推理</div><div class="v">${m.reasoning == null ? "—" : fmtTok(m.reasoning)}</div></div>
            <div class="track-field"><div class="k">合计 (自报)</div><div class="v">${m.total == null ? "—" : fmtTok(m.total)}</div></div>
          </div>
          ${calls.length ? `
            <div class="track-sparkline-wrap">
              <div class="track-sparkline-hd">
                <span>最近 ${calls.length} 次请求 ${baseline.medianTtft ? `(自身基线中位数: ${baseline.medianTtft}ms · ${baseline.medianTps} t/s)` : ""}</span>
                <span>${hasSlow ? '<b style="color:var(--stop)">发现通道抖动/突刺</b>' : '通路稳定'}</span>
              </div>
              <div class="track-sparkline">
                ${calls.map((c, idx) => {
                  const spike = isCallSpike(c);
                  const h = Math.max(18, Math.min(100, Math.round((c.ttft / maxT) * 100)));
                  return `<div class="spark-bar ${spike ? "slow" : ""}" style="height:${h}%" title="Call #${c.id || idx+1}: 首字 ${c.ttft}ms · ${c.tps} tok/s${spike ? ' (相对基线偏慢/抖动)' : ''}${c.note ? ' · ' + c.note : ''}"></div>`;
                }).join("")}
              </div>
            </div>
          ` : ""}
          ${hasSlow ? `
            <div class="telemetry-jitter-banner">
              ⚠️ ${esc(m.jitterNote || "检测到单次调用相对自身基线耗时突增 2.5x+，可能为本机网络代理（如 Clash Verge）通路抖动；看板不管理节点。")}
            </div>
          ` : ""}
          ${m.missingNote ? `
            <div class="tiny muted" style="margin-top:2px;">${esc(m.missingNote)}</div>
          ` : ""}
        </div>`;
    }

    function termText(r) {
      if (!r) return `<span class="dim">${t("noDockRuns")}</span>`;
      const i = r.issueId ? issue(r.issueId) : null;
      const releaseBlocked = refreshMeta().blocksTrackerWrites ? `disabled title="${S.lang === "en" ? "Refresh this Project first" : "先刷新这个 Project"}"` : "";
      if (r.status === "stopped") {
        return `<span class="dim">${r.agent}  ${project(r.projectId).name}  ${i ? "#"+i.id : t("free")}</span>
<span class="bad">× ${t("stopped")}</span>  <span class="dim">认领还在。优先恢复原生会话。</span>

<button data-act="fake-continue">${t("continue")}</button>  <button data-act="fake-release" ${releaseBlocked}>${t("release")}</button>`;
      }
      if (r.status === "ended") {
        return `<span class="dim">${r.agent}  ${i ? "#"+i.id : ""}</span>
<span class="dim">这条已经结束。留在条上只是因为你正在看改动。</span>`;
      }
      if (r.wait) {
        return `<span class="dim">${r.agent} · ${project(r.projectId).name} · ${i ? "#"+i.id+" "+shortTitle(i.title, 24) : t("free")}</span>
<span class="bad">● ${t("ovWaiting")}</span>  <span class="dim">${t("ovWaitingHelp")}</span>

<span class="hi">› 官方交互 TUI（假的）</span>
  等你确认权限或回答提问。`;
      }
      return `<span class="dim">${r.agent} · ${project(r.projectId).name} · ${i ? "#"+i.id+" "+shortTitle(i.title, 24) : t("free")}</span>
<span class="ok">● 活跃</span>  <span class="dim">${r.isolation ? "隔离执行目录" : "Project 主目录"} · PTY 在 ${hostName(host(r.hostId))}</span>

<span class="hi">› 官方交互 TUI（假的）</span>
  把父子和挡住拆开，点名字只换详情。
  干活中也能打开旁边的查看改动。`;
    }

    function viewChangesPanel(r) {
      if (!r) return `<div class="empty">先点一次 Run</div>`;
      const files = FILES[r.id] || [];
      const file = files.find(f => f.path === S.fileKey) || files[0];
      const notesHere = S.notes.filter(n => n.runId === r.id);
      return `
        <div class="hd">
          ${t("viewChanges")}
          <span class="row">
            <button data-act="base" data-id="round" class="${S.viewBase === "round" ? "active" : ""}">${t("thisRound")}</button>
            <button data-act="base" data-id="unstaged" class="${S.viewBase === "unstaged" ? "active" : ""}">${t("unstaged")}</button>
            ${foldHit("toggle-vc", t("collapse"), "×")}
          </span>
        </div>
        <div class="pad stack">
          ${files.map(f => `
            <button class="item ${file && file.path === f.path ? "sel" : ""}" data-act="file" data-id="${esc(f.path)}">
              <div class="t"><b>${esc(f.path)}</b><span class="tiny">+${f.add} −${f.del}</span></div>
              <div class="sub">${esc(f.repo)}</div>
            </button>`).join("")}
          ${file ? `
            <div class="diff">
              ${file.lines.map(ln => `
                <div class="ln ${ln.k}">
                  <span class="muted">${ln.n}</span>
                  <span>${esc(ln.t)}</span>
                  <button data-act="note-line" data-id="${ln.n}">注</button>
                </div>`).join("")}
            </div>` : `<div class="empty">这个目录里没有 git。</div>`}
          ${S.noteLine ? `
            <div class="stack">
              <div class="tiny">${esc(file.repo)} · ${esc(file.path)}:${S.noteLine}</div>
              <textarea data-act="note-draft" rows="2">${esc(S.noteDraft)}</textarea>
              <button class="primary" data-act="save-note">留下</button>
            </div>` : ""}
          ${notesHere.map((n, idx) => `<div class="note-pill">${esc(n.file)}:${n.line} — ${esc(n.text)} <button data-act="del-note" data-id="${idx}">×</button></div>`).join("")}
        </div>`;
    }

    function termSplit(r) {
      const showTop = (S.variant === "A" || (!S.viewChangesOpen && !S.telemetrySideOpen && S.variant !== "B" && S.variant !== "C"));
      const showBottom = (S.variant === "C");
      const showSideTelemetry = (S.variant === "B" || S.telemetrySideOpen);

      const termMain = `
        <div class="term-wrap" style="display:flex; flex-direction:column; min-height:0; position:relative; flex:1;">
          ${showTop ? runTelemetryTop(r) : ""}
          <div class="term ${termSkin()}" style="flex:1; min-height:0; overflow:auto;">${termText(r)}</div>
          ${showBottom ? runTelemetryBottom(r) : ""}
        </div>`;

      if (S.viewChangesOpen) {
        return `
          <div class="split" style="grid-template-columns:minmax(160px,1fr) 6px ${S.vcPct}%">
            ${termMain}
            <div class="splitter" data-act="drag-vc"></div>
            <div class="pane">${viewChangesPanel(r)}</div>
          </div>`;
      }
      if (showSideTelemetry) {
        return `
          <div class="split" style="grid-template-columns:minmax(160px,1fr) 6px 340px">
            ${termMain}
            <div class="splitter"></div>
            <div class="pane">${telemetrySidePanel(r)}</div>
          </div>`;
      }
      return termMain;
    }

    function termZoomStage(r) {
      return `
        <div class="zoom-stage ${S.termZoom === "full" ? "full" : ""} ${S.termZoom === "right" ? "right" : ""} ${termSkin()}">

          ${termSplit(r)}
        </div>`;
    }

              const p = project(S.projectId);
              return `
            <div class="tiny">${t("thisProject")}${p ? " · " + esc(p.name) : ""}</div>

              <option value="300" ${S.refreshInterval === 300 ? "selected" : ""}>5 ${S.lang === "en" ? "minutes" : "分钟"}</option>
            </select>
            <b>${t("autoAdvance")}</b>
            <div class="tiny">${t("autoAdvanceHelp")}</div>

                <div class="row">

                  <span class="mono" data-role="cold-wait-val">${pa.coldWait}</span>

      for (const r of allHostRuns()) (groups[r.projectId] ||= []).push(r);
      return `
        <div class="sheet">
          <div class="hd">${t("allRuns")}<button class="ghost" data-act="all-runs">×</button></div>
          ${Object.keys(groups).map(pid => `
            <div class="hd">${esc(project(pid).name)}</div>
            ${groups[pid].map(r => {
              const i = r.issueId ? issue(r.issueId) : null;
              return `<button class="item ${S.runId === r.id ? "sel" : ""}" data-act="run" data-id="${r.id}">
                <div class="t"><b>${i ? "#"+i.id+" "+shortTitle(i.title, 16) : t("free")}</b><span class="tag">${r.status}</span></div>
                <div class="sub">${esc(r.agent)}</div>
              </button>`;
            }).join("")}
          `).join("")}
        </div>`;

    function renderPhone() {
      if (S.scenario === "unpaired") {
        return `<div class="phone-stage"><div class="phone">
          <div class="phone-bar row"><b>Client</b><span class="grow"></span>${settingsBtn()}</div>
          <div class="phone-body pad stack">
            <b>${t("unpairedTitle")}</b>
            <div class="muted">${t("unpairedBody")}</div>
            <button class="primary" data-act="pair">${t("pairNow")}</button>
          </div>
        </div>${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}${S.settingsOpen ? settingsSheet() : ""}</div>`;
      }
      const tab = S.phone === "issue" || S.phone === "run" || S.phone === "overview" || S.phone === "usage" ? S.phone : "home";
      const body = tab === "issue" ? phoneIssue() : tab === "run" ? phoneRun() : tab === "overview" ? phoneOverview() : tab === "usage" ? usagePhone() : phoneHome();
      const h = host(S.hostId);
      const p = project(S.projectId);
      const tabLabel = tab === "issue" ? "Issue" : tab === "run" ? "Run" : tab === "usage" ? t("usage") : S.lang === "en" ? "Run overview" : "Run 总览";
      return `
        <div class="phone-stage">
          <div class="phone">
            <div class="phone-bar">
              ${tab === "home" ? `
                <div class="phone-current">
                  <div class="phone-current-copy">
                    <b>${p ? esc(p.name) : h ? esc(hostName(h)) : "Client"}</b>
                    <span>${h ? esc(hostName(h)) : ""}${p ? ` · ${esc(p.tracker)}` : ""}</span>
                  </div>
                  <button data-act="phone-context">${S.phoneContextOpen ? (S.lang === "en" ? "Hide" : "收起") : (S.lang === "en" ? "Switch" : "切换")}</button>

                  <button data-act="phone" data-id="home">${S.lang === "en" ? "Back" : "返回"}</button>

                  <span class="grow"></span>
                  ${settingsBtn()}

            <div class="phone-tabbar">
              <button class="${tab === "home" || tab === "overview" ? "active" : ""}" data-act="phone" data-id="home">${esc(t("phoneHome"))}</button>

              <button class="${tab === "run" ? "active" : ""}" data-act="phone" data-id="run">Run</button>

          </div>
          ${S.pairing ? pairingModal() : ""}${S.stopAsk ? stopModal() : ""}

    function phoneContextPanel() {

      const plist = hostProjects();

        <div class="phone-context-panel">
          <div class="phone-context-head">
            <b>${S.lang === "en" ? "Switch context" : "切换范围"}</b>

            <button data-act="pair">+ ${esc(t("pair"))}</button>

        <div class="phone-run-card">

        return `${phoneContextPanel()}
