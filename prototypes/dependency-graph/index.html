<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>原型 · 主界面依赖图</title>
  <!--
    一次性原型，不是产品。
    已钉主壳共用：四列顶栏切依赖图；详情定向邻域；点节点只换详情；默认画全部未关闭。
    A/B/C 只对照 Q6：补已关闭上下文时，是只加点、加点+父子线，还是两个切换。
  -->
  <style>
    :root {
      --ink: #1c1917;
      --muted: #78716c;
      --line: #d6d3d1;
      --paper: #fffdf8;
      --bg: #ece7de;
      --accent: #b45309;
      --run: #15803d;
      --stop: #b91c1c;
      --block: #a16207;
      --chip: #f5f0e6;
      --sel: #ffedd5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, select {
      font: inherit;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
    }
    button:hover { border-color: #a8a29e; }
    button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    button.ghost { background: transparent; }
    button.active { background: var(--sel); border-color: var(--accent); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #app { height: 100%; }
    .desktop {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-bottom: 72px;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      min-height: 40px;
    }
    .brand { font-weight: 650; letter-spacing: .02em; }
    .host-tab, .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--chip);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a8a29e; }
    .dot.on { background: var(--run); }
    .dot.busy { background: var(--accent); }
    .dot.stop { background: var(--stop); }
    .cols { flex: 1; display: grid; min-height: 0; grid-template-columns: 188px minmax(320px, 1.3fr) minmax(280px, .95fr); }
    .pane {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--paper);
      border-right: 1px solid var(--line);
    }
    .pane:last-child { border-right: 0; }
    .hd {
      margin: 0;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: #faf7f1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .item {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #f0ebe3;
      border-radius: 0;
      background: transparent;
      padding: 8px 10px;
      display: block;
    }
    .item:hover { background: #faf7f1; }
    .item.sel { background: var(--sel); }
    .item.dim { opacity: .42; }
    .item .t { display: flex; justify-content: space-between; gap: 8px; }
    .item .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .muted { color: var(--muted); }
    .tiny { font-size: 11px; color: var(--muted); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .grow { flex: 1; }
    .pad { padding: 10px; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 0 6px;
      border-radius: 3px;
      background: #f5f0e6;
      border: 1px solid var(--line);
    }
    .tag.block { background: #fef3c7; border-color: #fcd34d; }
    .tag.run { background: #dcfce7; border-color: #86efac; }
    .tag.stop { background: #fee2e2; border-color: #fecaca; }
    .tag.closed { background: #f5f5f4; color: var(--muted); }
    .lanes-mid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      min-height: 100%;
    }
    .lanes-mid .col { border-right: 1px solid var(--line); min-width: 0; }
    .lanes-mid .col:last-child { border-right: 0; }
    .empty { padding: 20px 12px; text-align: center; color: var(--muted); }
    .term {
      background: #1c1917;
      color: #e7e5e4;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 10px 12px;
      min-height: 0;
      overflow: auto;
      white-space: pre-wrap;
      flex: 1;
    }
    .term .dim { color: #a8a29e; }
    .term .ok { color: #86efac; }
    .dock {
      border-top: 1px solid var(--line);
      background: var(--paper);
      height: 28vh;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); background: #faf7f1; overflow-x: auto; }
    .tabs .grp {
      display: flex;
      align-items: stretch;
      border-right: 1px solid var(--line);
    }
    .tabs .gname {
      padding: 6px 8px;
      font-size: 11px;
      color: var(--muted);
      align-self: center;
      white-space: nowrap;
    }
    .tabs button {
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      padding: 6px 10px;
      white-space: nowrap;
    }
    .tabs button.sel { background: #1c1917; color: #fff; }
    .ident {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #292524;
      color: #f5f5f4;
      font-size: 12px;
    }
    .ident button { background: #44403c; color: #fff; border-color: #57534e; }
    .ident .who { color: #fdba74; font-weight: 650; }
    #switcher {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #1c1917;
      color: #fff;
      border-radius: 999px;
      padding: 6px 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      max-width: calc(100vw - 16px);
    }
    #switcher button, #switcher select {
      background: #292524;
      color: #fff;
      border-color: #44403c;
      border-radius: 999px;
    }
    #switcher select { padding: 4px 10px; }
    #switcher .lab { font-size: 12px; padding: 0 6px; white-space: nowrap; }
    #inspector {
      position: fixed;
      right: 12px;
      top: 48px;
      width: 270px;
      background: #fff;
      border: 1px solid #a8a29e;
      font-size: 12px;
      z-index: 25;
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
    }
    body.phone-vp #inspector { display: none; }
    #inspector h3 {
      margin: 0;
      padding: 6px 8px;
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: uppercase;
      background: #1c1917;
      color: #fff;
    }
    #inspector pre { margin: 0; padding: 8px; white-space: pre-wrap; }
    .block {
      border: 1px solid var(--line);
      background: #fff;
      padding: 8px;
    }
    .block h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .name-btn { text-align: left; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(28,25,23,.28);
      z-index: 8;
      display: flex;
      flex-direction: column;
    }
    .mid-rel { position: relative; display: flex; flex-direction: column; min-height: 0; }
    .mid-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      background: #faf7f1;
      position: sticky;
      top: 0;
      z-index: 3;
    }
    .graph-sheet {
      flex: 1;
      min-height: 0;
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }
    .graph-toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #faf7f1;
    }
    .graph-canvas { flex: 1; min-height: 0; overflow: hidden; background: #fbf8f2; }
    .graph-canvas svg { width: 100%; height: 100%; display: block; }
    .node-card { cursor: pointer; }
    .legend { font-size: 11px; color: var(--muted); }
    .flow {
      display: grid;
      grid-template-columns: 1fr 16px minmax(110px, .9fr) 16px 1fr;
      gap: 4px;
      align-items: start;
    }
    .flow .arrow {
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 16px;
    }
    .here {
      border: 2px solid var(--accent);
      background: var(--sel);
      padding: 8px;
    }
    .phone-stage {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 96px;
    }
    .phone {
      width: 390px;
      height: min(780px, calc(100vh - 130px));
      background: var(--paper);
      border: 1px solid #a8a29e;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .phone-bar { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .phone-body { flex: 1; overflow: auto; }
    .note {
      margin: 8px 10px;
      padding: 8px 10px;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="switcher"></div>
  <div id="inspector"></div>
  <script>
    // 三个 Dependency 第二视图。A 邻域浮层；B 整板一层；C 详情定向邻域。
    const HOSTS = [
      { id: "local", name: "本机 · MacBook", online: true },
      { id: "mini", name: "书房 Mini", online: true }
    ];
    const PROJECTS = [
      { id: "tb", hostId: "local", name: "agent-taskboard", tracker: "GitHub" },
      { id: "notes", hostId: "local", name: "garden-notes", tracker: "local markdown" },
      { id: "shop", hostId: "mini", name: "shop-api", tracker: "GitHub" }
    ];

    const RAW = [
      { id: 1, projectId: "tb", title: "Map: Agent Taskboard v1 规格与关键决策", role: "ready-for-human", claimed: false, parentId: null, blockedBy: [], bag: "daily" },
      { id: 14, projectId: "tb", title: "原型：主界面信息架构低保真方案", role: "ready-for-agent", claimed: false, parentId: 1, blockedBy: [], closed: true, closedAgo: "昨天", bag: "daily" },
      { id: 15, projectId: "tb", title: "决策：主界面信息架构定稿", role: "ready-for-human", claimed: false, parentId: 1, blockedBy: [14], closed: true, closedAgo: "今天", bag: "daily" },
      { id: 50, projectId: "tb", title: "实现：详情挡住名单", role: "ready-for-agent", claimed: true, parentId: 1, blockedBy: [], bag: "daily" },
      { id: 501, projectId: "tb", title: "子票：挡住它的列表", role: "ready-for-agent", claimed: false, parentId: 50, blockedBy: [], bag: "daily" },
      { id: 502, projectId: "tb", title: "子票：它挡住的列表", role: "ready-for-agent", claimed: false, parentId: 50, blockedBy: [], bag: "daily" },
      { id: 51, projectId: "tb", title: "实现：依赖图", role: "ready-for-agent", claimed: false, parentId: 1, blockedBy: [50, 53], bag: "daily" },
      { id: 52, projectId: "tb", title: "实现：空状态三种", role: "ready-for-agent", claimed: false, parentId: 1, blockedBy: [50], bag: "daily" },
      { id: 53, projectId: "tb", title: "调研：图画法", role: "ready-for-agent", claimed: false, parentId: 1, blockedBy: [], bag: "daily" },
      { id: 60, projectId: "tb", title: "决策：v1 收不收图", role: "ready-for-human", claimed: false, parentId: 1, blockedBy: [51, 52], bag: "daily" },
      { id: 71, projectId: "tb", title: "决策：搜索范围", role: "ready-for-human", claimed: false, parentId: 1, blockedBy: [], closed: true, closedAgo: "上周", bag: "daily" },
      { id: 70, projectId: "tb", title: "实现：搜索已关闭", role: "ready-for-agent", claimed: false, parentId: 1, blockedBy: [71], bag: "daily" },
      { id: 81, projectId: "tb", title: "决策：通知范围", role: "ready-for-human", claimed: false, parentId: 1, blockedBy: [], bag: "daily" },
      { id: 80, projectId: "tb", title: "实现：通知", role: "ready-for-agent", claimed: false, parentId: 1, blockedBy: [81], bag: "daily" },
      { id: 90, projectId: "tb", title: "实现：设置页", role: "ready-for-agent", claimed: false, parentId: 1, blockedBy: [], bag: "daily" },
      { id: 12, projectId: "tb", title: "决策：是否坚持 Tauri 2 作为桌面壳", role: "ready-for-agent", claimed: false, parentId: 1, blockedBy: [], closed: true, closedAgo: "2 分钟前", bag: "daily" },
      { id: 40, projectId: "notes", title: "整理 ADR 索引", role: "needs-triage", claimed: false, parentId: null, blockedBy: [], bag: "daily" },
      { id: 30, projectId: "shop", title: "修支付超时", role: "ready-for-agent", claimed: true, parentId: null, blockedBy: [], stopped: true, bag: "daily" },
      { id: 31, projectId: "shop", title: "加退款接口", role: "ready-for-agent", claimed: false, parentId: null, blockedBy: [30], bag: "daily" }
    ];

    (function seedLarge() {
      for (let i = 0; i < 8; i++) {
        RAW.push({
          id: 200 + i,
          projectId: "tb",
          title: `大图 · 主链第 ${i + 1} 步`,
          role: "ready-for-agent",
          claimed: i === 2,
          parentId: 1,
          blockedBy: i ? [199 + i] : [],
          bag: "large"
        });
      }
      for (let i = 0; i < 6; i++) {
        RAW.push({
          id: 220 + i,
          projectId: "tb",
          title: `大图 · 扇出 ${i + 1}`,
          role: "ready-for-agent",
          claimed: false,
          parentId: 1,
          blockedBy: [202],
          bag: "large"
        });
      }
      for (let i = 0; i < 5; i++) {
        RAW.push({
          id: 240 + i,
          projectId: "tb",
          title: `大图 · 已关解锁 ${i + 1}`,
          role: "ready-for-agent",
          claimed: false,
          parentId: 1,
          blockedBy: [],
          closed: true,
          closedAgo: "更早",
          bag: "large"
        });
      }
      RAW.push({
        id: 280,
        projectId: "tb",
        title: "大图 · 总汇合",
        role: "ready-for-human",
        claimed: false,
        parentId: 1,
        blockedBy: [207, 220, 221, 222, 240, 241],
        bag: "large"
      });
      for (let i = 0; i < 4; i++) {
        RAW.push({
          id: 300 + i,
          projectId: "tb",
          title: `大图 · 孤立 ${i + 1}`,
          role: "ready-for-agent",
          claimed: false,
          parentId: 1,
          blockedBy: [],
          bag: "large"
        });
      }
    })();

    const ISSUES = RAW.map(i => ({ ...i, blocking: [] }));
    for (const i of ISSUES) {
      for (const b of i.blockedBy) {
        const src = ISSUES.find(x => x.id === b);
        if (src) src.blocking.push(i.id);
      }
    }

    const RUNS = [
      { id: "r1", issueId: 50, hostId: "local", projectId: "tb", agent: "Grok Build", status: "active" },
      { id: "r2", issueId: 30, hostId: "mini", projectId: "shop", agent: "Codex", status: "stopped" },
      { id: "r3", issueId: 202, hostId: "local", projectId: "tb", agent: "Claude Code", status: "active" }
    ];

    const S = {
      variant: "A",
      viewport: "desktop",
      scenario: "daily",
      hostId: "local",
      projectId: "tb",
      issueId: 70,
      runId: "r1",
      showCtx: false,
      showClosedDep: false,
      showClosedFamily: false,
      childFilter: null,
      midMode: "graph",
      cam: { x: 24, y: 24, k: 1, user: false },
      lastAct: "打开原型 · 先看默认（未关闭），再打开切换"
    };

    const VARIANTS = [
      { id: "A", name: "只加点" },
      { id: "B", name: "加点 + 父子线" },
      { id: "C", name: "两个切换" }
    ];

    function qs() { return new URLSearchParams(location.search); }
    function writeQS() {
      const u = new URL(location.href);
      u.searchParams.set("variant", S.variant);
      u.searchParams.set("viewport", S.viewport);
      u.searchParams.set("scenario", S.scenario);
      if (S.midMode === "graph") u.searchParams.set("mid", "graph");
      else u.searchParams.delete("mid");
      if (S.showCtx) u.searchParams.set("ctx", "1");
      else u.searchParams.delete("ctx");
      if (S.showClosedDep) u.searchParams.set("dep", "1");
      else u.searchParams.delete("dep");
      if (S.showClosedFamily) u.searchParams.set("fam", "1");
      else u.searchParams.delete("fam");
      history.replaceState({}, "", u);
    }
    function applyScenario(sc) {
      S.scenario = sc;
      S.childFilter = null;
      S.showCtx = false;
      S.showClosedDep = false;
      S.showClosedFamily = false;
      S.cam = { x: 24, y: 24, k: sc === "large" ? 0.65 : 1, user: false };
      S.midMode = "graph";
      if (sc === "large") {
        S.hostId = "local"; S.projectId = "tb"; S.issueId = 280; S.runId = "r3";
      } else if (sc === "lonely") {
        S.hostId = "local"; S.projectId = "tb"; S.issueId = 90; S.runId = "r1";
      } else if (sc === "shop") {
        S.hostId = "mini"; S.projectId = "shop"; S.issueId = 31; S.runId = "r2";
      } else {
        S.hostId = "local"; S.projectId = "tb"; S.issueId = 70; S.runId = "r1";
      }
    }
    function loadQS() {
      const p = qs();
      S.variant = (p.get("variant") || "A").toUpperCase();
      if (!VARIANTS.some(v => v.id === S.variant)) S.variant = "A";
      S.viewport = p.get("viewport") === "phone" ? "phone" : "desktop";
      const sc = p.get("scenario");
      if (["daily", "large", "lonely", "shop"].includes(sc)) applyScenario(sc);
      if (p.get("mid") === "board") S.midMode = "board";
      if (p.get("mid") === "graph") S.midMode = "graph";
      if (p.get("ctx") === "1") S.showCtx = true;
      if (p.get("dep") === "1") S.showClosedDep = true;
      if (p.get("fam") === "1") S.showClosedFamily = true;
    }

    function host(id) { return HOSTS.find(h => h.id === id); }
    function project(id) { return PROJECTS.find(p => p.id === id); }
    function issue(id) { return ISSUES.find(i => i.id === Number(id)); }
    function run(id) { return RUNS.find(r => r.id === id); }
    function issueRun(iss) { return RUNS.find(r => r.issueId === iss.id); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function shortTitle(t, n) {
      t = String(t).replace(/^[^：:]*[：:]/, "");
      return t.length > n ? t.slice(0, n - 1) + "…" : t;
    }
    function issueLabel(i) { return `#${i.id} ${i.title}`; }
    function openBlockers(i) {
      return i.blockedBy.map(issue).filter(b => b && !b.closed);
    }
    function sectionOf(i) {
      if (i.closed) return "closed";
      if (issueRun(i) && issueRun(i).status === "active") return "in-run";
      if (i.stopped || (issueRun(i) && issueRun(i).status === "stopped")) return "in-run";
      if (openBlockers(i).length) return "blocked";
      if (i.claimed) return "in-run";
      return "frontier";
    }
    function bagOf(i) { return i.bag || "daily"; }
    function inScenario(i) {
      if (i.projectId !== S.projectId) return S.scenario !== "large" && bagOf(i) === "daily";
      if (S.scenario === "large") return bagOf(i) === "large" || i.id === 1;
      return bagOf(i) === "daily";
    }
    function projectIssues() {
      return ISSUES.filter(i => i.projectId === S.projectId && inScenario(i));
    }
    function childrenOf(id) { return ISSUES.filter(i => i.parentId === id && inScenario(i)); }
    function parentOf(i) { return i.parentId ? issue(i.parentId) : null; }

    function visibleRuns() {
      return RUNS.filter(r => r.hostId === S.hostId).filter(r => {
        if (r.issueId) {
          const i = issue(r.issueId);
          if (i && !inScenario(i)) return false;
        }
        if (r.status === "active" || r.status === "stopped") return true;
        return S.runId === r.id;
      });
    }

    function filteredBoardIssues() {
      let list = projectIssues().filter(i => !i.closed);
      if (S.childFilter) {
        const keep = new Set([S.childFilter, ...childrenOf(S.childFilter).map(c => c.id)]);
        list = list.filter(i => keep.has(i.id));
      }
      return list;
    }
    function recentClosed() {
      return projectIssues().filter(i => i.closed).slice(0, 5);
    }

    function chainAround(id) {
      const set = new Set([id]);
      const q = [id];
      while (q.length) {
        const cur = issue(q.shift());
        if (!cur) continue;
        for (const n of [...cur.blockedBy, ...cur.blocking]) {
          const o = issue(n);
          if (!o || !inScenario(o) || set.has(o.id)) continue;
          set.add(o.id);
          q.push(o.id);
        }
      }
      return set;
    }

    function neighborhood(id, hops) {
      const set = new Set([id]);
      let frontier = [id];
      for (let h = 0; h < hops; h++) {
        const next = [];
        for (const curId of frontier) {
          const cur = issue(curId);
          if (!cur) continue;
          for (const n of [...cur.blockedBy, ...cur.blocking]) {
            const o = issue(n);
            if (!o || !inScenario(o) || set.has(o.id)) continue;
            set.add(o.id);
            next.push(o.id);
          }
        }
        frontier = next;
      }
      return [...set];
    }

    function layoutDag(ids) {
      const idSet = new Set(ids);
      const preds = {};
      const succs = {};
      for (const id of ids) { preds[id] = []; succs[id] = []; }
      for (const id of ids) {
        const iss = issue(id);
        if (!iss) continue;
        for (const b of iss.blockedBy) {
          if (idSet.has(b)) {
            succs[b].push(id);
            preds[id].push(b);
          }
        }
      }
      const layer = {};
      const stack = new Set();
      function depth(id) {
        if (layer[id] != null) return layer[id];
        if (stack.has(id)) return 0;
        stack.add(id);
        const p = preds[id];
        layer[id] = p.length ? Math.max(...p.map(depth)) + 1 : 0;
        stack.delete(id);
        return layer[id];
      }
      ids.forEach(depth);
      const byLayer = {};
      for (const id of ids) (byLayer[layer[id]] ||= []).push(id);
      const NW = 176, NH = 50, GX = 64, GY = 16;
      const pos = {};
      const layers = Object.keys(byLayer).map(Number).sort((a, b) => a - b);
      let maxH = 0;
      for (const L of layers) {
        const row = byLayer[L];
        row.forEach((id, i) => {
          pos[id] = { x: 20 + L * (NW + GX), y: 20 + i * (NH + GY), w: NW, h: NH };
        });
        maxH = Math.max(maxH, row.length * (NH + GY) - GY);
      }
      const width = 40 + layers.length * (NW + GX) - GX;
      const height = 40 + maxH;
      return { pos, width: Math.max(width, 360), height: Math.max(height, 200), preds, succs };
    }

    function setIssue(id) {
      const i = issue(id);
      if (!i) return;
      S.issueId = id;
      S.projectId = i.projectId;
      S.hostId = project(i.projectId).hostId;
      const r = issueRun(i);
      if (r) S.runId = r.id;
      S.lastAct = `点 Issue #${id} · 只换详情`;
      render();
    }

    function render() {
      writeQS();
      document.body.classList.toggle("phone-vp", S.viewport === "phone");
      document.getElementById("app").innerHTML =
        S.viewport === "phone" ? renderPhone() : renderDesktop();
      document.getElementById("switcher").innerHTML = renderSwitcher();
      document.getElementById("inspector").innerHTML = renderInspector();
      bind();
    }

    function renderSwitcher() {
      const cur = VARIANTS.find(v => v.id === S.variant);
      return `
        <button data-act="prev">←</button>
        <div class="lab">${cur.id} — ${esc(cur.name)}</div>
        <button data-act="next">→</button>
        <button data-act="vp" class="${S.viewport === "desktop" ? "active" : ""}">${S.viewport === "desktop" ? "桌面" : "手机"}</button>
        <select data-act="scenario">
          <option value="daily" ${S.scenario === "daily" ? "selected" : ""}>日常：未关闭全局</option>
          <option value="large" ${S.scenario === "large" ? "selected" : ""}>大图：三十多张</option>
          <option value="lonely" ${S.scenario === "lonely" ? "selected" : ""}>几乎没有挡住边</option>
          <option value="shop" ${S.scenario === "shop" ? "selected" : ""}>另一台 Host</option>
        </select>`;
    }

    function renderInspector() {
      const i = issue(S.issueId);
      const lines = [
        `方案 ${S.variant} · ${S.viewport} · ${S.scenario}`,
        `Issue: ${i ? issueLabel(i) : "（无）"}`,
        `中间: ${S.midMode === "graph" ? "依赖图" : "四列"}`,
        `Q6: ${S.variant === "A" ? "只加点" : S.variant === "B" ? "加点+父子线" : "两个切换"}`,
        `补上下文: ${S.variant === "C" ? `挡住${S.showClosedDep ? "开" : "关"} 父子${S.showClosedFamily ? "开" : "关"}` : (S.showCtx ? "开" : "关")}`,
        `子票过滤: ${S.childFilter ? "#" + S.childFilter : "无"}`,
        `上次: ${S.lastAct}`
      ];
      return `<h3>当前状态（原型）</h3><pre>${esc(lines.join("\n"))}</pre>`;
    }

    function hostTabs() {
      return HOSTS.map(h => `
        <button class="host-tab ${h.id === S.hostId ? "active" : ""}" data-act="host" data-id="${h.id}">
          <span class="dot ${h.online ? "on" : "off"}"></span>${esc(h.name)}
        </button>`).join("");
    }

    function projectList() {
      return PROJECTS.filter(p => p.hostId === S.hostId).map(p => `
        <button class="item ${S.projectId === p.id ? "sel" : ""}" data-act="project" data-id="${p.id}">
          <div class="t"><b>${esc(p.name)}</b><span class="tag">${esc(p.tracker)}</span></div>
        </button>`).join("");
    }

    function issueItem(i) {
      const r = issueRun(i);
      const sec = sectionOf(i);
      const tags = [];
      if (i.closed) tags.push(`<span class="tag closed">已关闭</span>`);
      if (sec === "blocked") tags.push(`<span class="tag block">被挡住</span>`);
      if (r && r.status === "active") tags.push(`<span class="tag run">活跃 Run</span>`);
      if (i.stopped || (r && r.status === "stopped" && !i.closed)) tags.push(`<span class="tag stop">执行已停</span>`);
      const dim = S.chainFilter && !S.chainFilter.has(i.id);
      return `
        <button class="item ${S.issueId === i.id ? "sel" : ""} ${dim ? "dim" : ""}" data-act="issue" data-id="${i.id}">
          <div class="t"><b>#${i.id} ${esc(shortTitle(i.title, 22))}</b></div>
          <div class="sub">${tags.join(" ")}</div>
        </button>`;
    }

    function midBar() {
      return `
        <div class="mid-bar">
          <button data-act="mid-mode" data-id="board" class="${S.midMode === "board" ? "active" : ""}">四列</button>
          <button data-act="mid-mode" data-id="graph" class="${S.midMode === "graph" ? "active" : ""}">依赖图</button>
          <span class="tiny">入口在四列顶栏 · 默认仍是四列</span>
        </div>`;
    }

    function board() {
      const list = filteredBoardIssues();
      const cols = [
        ["blocked", "被挡住"],
        ["frontier", "Frontier"],
        ["in-run", "干活中"]
      ];
      const rec = recentClosed();
      const note = S.childFilter
        ? `只看 #${S.childFilter} 的直接子票。列还是这四列，不是树。`
        : `从左到右：被挡住 → Frontier → 干活中 → 最近完成。不能拖列关票。`;
      return `
        ${midBar()}
        <div class="tiny pad">${esc(note)}
          ${S.childFilter ? `<button data-act="clear-filter">清除过滤</button>` : ""}
        </div>
        <div class="lanes-mid">
          ${cols.map(([sec, name]) => {
            const items = list.filter(i => sectionOf(i) === sec);
            return `<div class="col"><div class="hd">${name} <span>${items.length}</span></div>${items.map(issueItem).join("") || `<div class="empty">${sec === "frontier" ? "没有可领的票" : "没有"}</div>`}</div>`;
          }).join("")}
          <div class="col">
            <div class="hd">最近完成 <span>${rec.length}</span></div>
            ${rec.map(issueItem).join("") || `<div class="empty">还没有刚关的</div>`}
            <div class="tiny pad">只留最近几张。</div>
          </div>
        </div>`;
    }

    function nameBtn(i) {
      if (!i) return "";
      const extra = i.closed ? " · 已关" : sectionOf(i) === "blocked" ? " · 被挡住" : "";
      return `<button class="name-btn" data-act="issue" data-id="${i.id}">#${i.id} ${esc(shortTitle(i.title, 18))}${extra}</button>`;
    }

    function issueDetail() {
      const i = issue(S.issueId);
      if (!i) return `<div class="empty">点一张 Issue</div>`;
      const p = project(i.projectId);
      const par = parentOf(i);
      const kids = childrenOf(i.id);
      const blockers = i.blockedBy.map(issue).filter(Boolean);
      const blocks = i.blocking.map(issue).filter(Boolean);
      return `
        <div class="hd">Issue</div>
        <div class="pad stack">
          <div><b>${esc(issueLabel(i))}</b></div>
          <div class="tiny">${esc(host(p.hostId).name)} / ${esc(p.name)}</div>
          <div class="row">
            <span class="tag">${esc(i.role)}</span>
            ${i.closed ? `<span class="tag closed">已关闭</span>` : i.claimed ? `<span class="tag">已认领</span>` : `<span class="tag">未认领</span>`}
          </div>
          <div class="block">
            <h4>属于 / 子票 · 不是挡住</h4>
            <div class="tiny">父</div>
            ${par ? nameBtn(par) : `<span class="muted">没有父，仍是一等 Issue</span>`}
            <div class="tiny" style="margin-top:6px">直接子票</div>
            ${kids.length ? kids.map(nameBtn).join(" ") : `<span class="muted">没有子票</span>`}
            ${kids.length ? `<div class="row" style="margin-top:6px"><button data-act="child-filter" data-id="${i.id}">只看这些子票</button></div>` : ""}
          </div>
          <div class="block">
            <h4>挡住它的 / 它挡住的 · 日常主路径</h4>
            ${renderFlow(i, blockers, blocks)}
          </div>
        </div>`;
    }

    function renderFlow(i, blockers, blocks) {
      const up = blockers;
      const down = blocks;
      const cap = 5;
      const show = (arr, empty) => {
        const head = arr.slice(0, cap);
        const more = arr.length - head.length;
        return `
          ${head.map(x => `<div style="margin-bottom:4px">${nameBtn(x)}</div>`).join("") || `<div class="muted">${empty}</div>`}
          ${more > 0 ? `<div class="tiny">还有 ${more} 张</div>` : ""}`;
      };
      const closedN = blockers.filter(x => x.closed).length + blocks.filter(x => x.closed).length;
      return `
        <div class="tiny">不是图画，是左挡住 · 中当前 · 右被它挡住。点名字只换详情。</div>
        <div class="tiny" style="margin:6px 0">已关 ${closedN} 张也列在这里，点名字只换详情。</div>
        <div class="flow">
          <div>
            <div class="tiny">挡住它的</div>
            ${show(up, "无，可进 Frontier")}
          </div>
          <div class="arrow">→</div>
          <div class="here">
            <div class="tiny">当前</div>
            <b>#${i.id}</b>
            <div>${esc(shortTitle(i.title, 16))}</div>
          </div>
          <div class="arrow">→</div>
          <div>
            <div class="tiny">它挡住的</div>
            ${show(down, "无")}
          </div>
        </div>`;
    }

    function extraClosedIds(wantDep, wantFam) {
      const extra = new Set();
      const open = projectIssues().filter(i => !i.closed);
      for (const i of open) {
        if (wantDep) {
          for (const n of [...i.blockedBy, ...i.blocking]) {
            const o = issue(n);
            if (o && o.closed && inScenario(o) && o.projectId === S.projectId) extra.add(o.id);
          }
        }
        if (wantFam) {
          const p = parentOf(i);
          if (p && p.closed && inScenario(p) && p.projectId === S.projectId) extra.add(p.id);
          for (const c of childrenOf(i.id)) {
            if (c.closed) extra.add(c.id);
          }
        }
      }
      return extra;
    }

    function graphIds() {
      const open = projectIssues().filter(i => !i.closed).map(i => i.id);
      let extra = new Set();
      if (S.variant === "A" && S.showCtx) extra = extraClosedIds(true, true);
      if (S.variant === "B" && S.showCtx) extra = extraClosedIds(true, true);
      if (S.variant === "C") extra = extraClosedIds(S.showClosedDep, S.showClosedFamily);
      return [...new Set([...open, ...extra])];
    }

    function renderSvg() {
      const ids = graphIds();
      if (!ids.length) return `<div class="empty">这个范围里没有可画的 Issue。</div>`;
      const { pos, width, height } = layoutDag(ids);
      if (!S.cam.user) {
        const vw = 800, vh = 400;
        const k = Math.min(1, (vw - 48) / Math.max(width, 1), (vh - 48) / Math.max(height, 1));
        S.cam.k = k;
        S.cam.x = (vw - width * k) / 2;
        S.cam.y = (vh - height * k) / 2;
      }
      const depEdges = [];
      const parentEdges = [];
      const idSet = new Set(ids);
      for (const id of ids) {
        const iss = issue(id);
        for (const b of iss.blockedBy) {
          if (pos[b] && pos[id]) depEdges.push({ from: b, to: id, closed: !!(issue(b).closed || iss.closed) });
        }
        if (S.variant === "B" && S.showCtx && iss.parentId && idSet.has(iss.parentId) && pos[iss.parentId]) {
          parentEdges.push({ from: iss.parentId, to: id });
        }
      }
      const k = S.cam.k, x = S.cam.x, y = S.cam.y;
      const node = (id) => {
        const i = issue(id);
        const p = pos[id];
        const cur = id === S.issueId;
        const closed = !!i.closed;
        const blocked = sectionOf(i) === "blocked";
        const fill = cur ? "#ffedd5" : closed ? "#f5f5f4" : blocked ? "#fef3c7" : "#fffdf8";
        const stroke = cur ? "#b45309" : closed ? "#78716c" : "#a8a29e";
        const dash = closed ? "4 3" : "none";
        const sw = cur ? 2.4 : 1;
        const title = `#${id} ${shortTitle(i.title, 12)}`;
        const sub = closed ? "已关闭 · 上下文" : sectionOf(i) === "blocked" ? "被挡住" : sectionOf(i) === "in-run" ? "干活中 / 已认领" : "未关闭";
        return `
          <g class="node-card" data-act="graph-node" data-id="${id}">
            <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6"
              fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${dash}" />
            <text x="${p.x + 10}" y="${p.y + 20}" font-size="12" font-weight="650" fill="#1c1917">${esc(title)}</text>
            <text x="${p.x + 10}" y="${p.y + 36}" font-size="10" fill="#78716c">${esc(sub)}</text>
          </g>`;
      };
      const depPath = (e) => {
        const a = pos[e.from], b = pos[e.to];
        const x1 = a.x + a.w, y1 = a.y + a.h / 2;
        const x2 = b.x, y2 = b.y + b.h / 2;
        const mid = (x1 + x2) / 2;
        const col = e.closed ? "#a8a29e" : "#b45309";
        const dash = e.closed ? "5 4" : "none";
        return `<path d="M${x1} ${y1} C${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="1.6" stroke-dasharray="${dash}" marker-end="${e.closed ? "url(#arr-off)" : "url(#arr)"}" />`;
      };
      const parentPath = (e) => {
        const a = pos[e.from], b = pos[e.to];
        const x1 = a.x + a.w / 2, y1 = a.y + a.h;
        const x2 = b.x + b.w / 2, y2 = b.y;
        const mid = (y1 + y2) / 2;
        return `<path d="M${x1} ${y1} C${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arr-par)" />`;
      };
      return `
        <svg viewBox="0 0 800 420" data-act="svg-root" data-w="${width}" data-h="${height}">
          <defs>
            <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#b45309" />
            </marker>
            <marker id="arr-off" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#a8a29e" />
            </marker>
            <marker id="arr-par" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8" />
            </marker>
          </defs>
          <g transform="translate(${x} ${y}) scale(${k})">
            <rect x="-200" y="-200" width="${width + 400}" height="${height + 400}" fill="transparent" data-act="svg-bg" />
            ${parentEdges.map(parentPath).join("")}
            ${depEdges.map(depPath).join("")}
            ${ids.map(node).join("")}
          </g>
        </svg>`;
    }

    function graphToolbar() {
      const i = issue(S.issueId);
      const count = graphIds().length;
      const extras = graphIds().filter(id => issue(id).closed);
      const q6 = S.variant === "A"
        ? `<button data-act="toggle-ctx" class="${S.showCtx ? "active" : ""}">${S.showCtx ? "已关闭上下文开着" : "也显示已关闭的上下文"}</button>`
        : S.variant === "B"
          ? `<button data-act="toggle-ctx" class="${S.showCtx ? "active" : ""}">${S.showCtx ? "已关闭+父子线开着" : "也显示已关闭的上下文"}</button>`
          : `<button data-act="toggle-closed-dep" class="${S.showClosedDep ? "active" : ""}">${S.showClosedDep ? "已关闭挡住开着" : "补已关闭的挡住邻居"}</button>
             <button data-act="toggle-closed-fam" class="${S.showClosedFamily ? "active" : ""}">${S.showClosedFamily ? "已关闭父子开着" : "补已关闭的父 / 子"}</button>`;
      const legend = S.variant === "B" && S.showCtx
        ? "琥珀横线 = 挡住 · 蓝虚线竖线 = 父子（本方案才画）"
        : "只画挡住横线 · 父子不连线";
      return `
        ${midBar()}
        <div class="graph-toolbar">
          <span class="chip">${count} 个点 · 已关闭 ${extras.length} · 当前 #${i ? i.id : "?"}</span>
          ${q6}
          <span class="legend">${legend}</span>
        </div>`;
    }

    function graphPane() {
      return `
        <div class="graph-sheet">
          ${graphToolbar()}
          <div class="tiny pad">默认：这个 Project 全部未关闭（含孤立点）。点节点只换详情。看 Q6：打开上面的切换，再对照 A/B/C。对照票：#70 的已关闭挡住 #71；#1 的已关闭子票 #12 / #14 / #15。</div>
          <div class="graph-canvas">${renderSvg()}</div>
        </div>`;
    }

    function renderDesktop() {
      const r = run(S.runId);
      return `
        <div class="desktop">
          <div class="topbar">
            <span class="brand">Agent Taskboard</span>
            ${hostTabs()}
            <span class="grow"></span>
            <span class="tiny">图入口在中间顶栏，不在某张 Issue 里</span>
            <span class="chip">自动推进 关</span>
          </div>
          <div class="cols">
            <div class="pane">
              <div class="hd">这个 Host 上的 Project</div>
              ${projectList()}
              <div class="pad tiny">点 Project 只过滤本板。不是第二种 Frontier。</div>
            </div>
            <div class="pane mid-rel">
              ${S.midMode === "graph" ? graphPane() : board()}
            </div>
            <div class="pane">${issueDetail()}</div>
          </div>
          <div class="dock">
            ${runTabs()}
            <div class="ident">
              ${r ? `${esc(host(r.hostId).name)} / <button data-act="project" data-id="${r.projectId}">${esc(project(r.projectId).name)}</button> / <span class="who">#${r.issueId}</span> · ${esc(r.agent)}` : `<span class="muted">没有选中的 Run</span>`}
            </div>
            <div class="term"><span class="dim">官方 TUI（假的）</span>
<span class="ok">● ${r && r.status === "active" ? "活跃" : "已停"}</span>  <span class="dim">图是第二视图，不替代底栏，也不替代四列。</span></div>
          </div>
        </div>`;
    }

    function runTabs() {
      const groups = {};
      for (const r of visibleRuns()) (groups[r.projectId] ||= []).push(r);
      return `
        <div class="tabs">
          ${Object.keys(groups).map(pid => `
            <div class="grp">
              <div class="gname">${esc(project(pid).name)}</div>
              ${groups[pid].map(r => {
                const i = r.issueId ? issue(r.issueId) : null;
                return `<button class="${S.runId === r.id ? "sel" : ""}" data-act="run" data-id="${r.id}">
                  <span class="dot ${r.status === "active" ? "busy" : "stop"}"></span>#${i ? i.id : "游离"} ${i ? esc(shortTitle(i.title, 10)) : ""}
                </button>`;
              }).join("")}
            </div>`).join("")}
        </div>`;
    }

    function renderPhone() {
      const i = issue(S.issueId);
      const blockers = i ? i.blockedBy.map(issue).filter(Boolean) : [];
      const blocks = i ? i.blocking.map(issue).filter(Boolean) : [];
      return `
        <div class="phone-stage">
          <div class="phone">
            <div class="phone-bar"><b>手机 Client</b> · 图不验收</div>
            <div class="phone-body">
              <div class="note">依赖图请到电脑上看。手机只保留挡住名单。</div>
              ${i ? `
                <div class="hd">#${i.id}</div>
                <div class="pad stack">
                  <b>${esc(i.title)}</b>
                  <div class="tiny">挡住它的</div>
                  ${blockers.length ? blockers.map(nameBtn).join(" ") : `<span class="muted">无</span>`}
                  <div class="tiny">它挡住的</div>
                  ${blocks.length ? blocks.map(nameBtn).join(" ") : `<span class="muted">无</span>`}
                </div>` : `<div class="empty">没有 Issue</div>`}
              <div class="hd">本板</div>
              ${filteredBoardIssues().slice(0, 8).map(issueItem).join("")}
            </div>
          </div>
        </div>`;
    }

    function bind() {
      const sw = document.getElementById("switcher");
      sw.onclick = (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        if (b.dataset.act === "prev" || b.dataset.act === "next") {
          const i = VARIANTS.findIndex(v => v.id === S.variant);
          S.variant = VARIANTS[(i + (b.dataset.act === "next" ? 1 : VARIANTS.length - 1)) % VARIANTS.length].id;
          S.cam.user = false;
          S.lastAct = `切到 Q6 方案 ${S.variant}`;
          render();
        }
        if (b.dataset.act === "vp") {
          S.viewport = S.viewport === "desktop" ? "phone" : "desktop";
          render();
        }
      };
      sw.onchange = (e) => {
        if (e.target.dataset.act === "scenario") {
          applyScenario(e.target.value);
          S.lastAct = `场景 ${S.scenario}`;
          render();
        }
      };

      const app = document.getElementById("app");
      app.onclick = (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        const act = b.dataset.act;
        const id = b.dataset.id;
        if (act === "host") {
          S.hostId = id;
          const first = PROJECTS.find(p => p.hostId === id);
          if (first) S.projectId = first.id;
          S.lastAct = `切 Host ${id}`;
          render();
        }
        if (act === "project") {
          S.projectId = id;
          S.hostId = project(id).hostId;
          S.childFilter = null;
          S.chainFilter = null;
          S.lastAct = `切 Project ${id}`;
          render();
        }
        if (act === "issue") setIssue(Number(id));
        if (act === "graph-node") {
          const i = issue(id);
          if (!i) return;
          S.issueId = i.id;
          S.lastAct = `图节点 #${i.id} · 只换详情`;
          render();
        }
        if (act === "run") {
          const r = run(id);
          if (!r) return;
          S.runId = r.id;
          S.hostId = r.hostId;
          S.projectId = r.projectId;
          if (r.issueId) S.issueId = r.issueId;
          S.lastAct = `切 Run ${id}`;
          render();
        }
        if (act === "mid-mode") {
          S.midMode = id;
          S.cam.user = false;
          S.lastAct = id === "graph" ? "中间切到依赖图" : "中间回到四列";
          render();
        }
        if (act === "toggle-ctx") {
          S.showCtx = !S.showCtx;
          S.cam.user = false;
          S.lastAct = S.showCtx ? "打开已关闭上下文" : "关上已关闭上下文";
          render();
        }
        if (act === "toggle-closed-dep") {
          S.showClosedDep = !S.showClosedDep;
          S.cam.user = false;
          S.lastAct = S.showClosedDep ? "补已关闭挡住" : "去掉已关闭挡住";
          render();
        }
        if (act === "toggle-closed-fam") {
          S.showClosedFamily = !S.showClosedFamily;
          S.cam.user = false;
          S.lastAct = S.showClosedFamily ? "补已关闭父子" : "去掉已关闭父子";
          render();
        }
        if (act === "child-filter") {
          S.childFilter = Number(id);
          S.midMode = "board";
          S.lastAct = `只看 #${id} 的子票 · 这才动四列`;
          render();
        }
        if (act === "clear-filter") {
          S.childFilter = null;
          S.lastAct = "清除四列过滤";
          render();
        }
      };

      const svg = app.querySelector("svg[data-act=svg-root]");
      if (svg) {
        let drag = null;
        svg.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".node-card")) return;
          drag = { x: e.clientX, y: e.clientY, cx: S.cam.x, cy: S.cam.y };
          svg.setPointerCapture(e.pointerId);
        });
        svg.addEventListener("pointermove", (e) => {
          if (!drag) return;
          S.cam.x = drag.cx + (e.clientX - drag.x);
          S.cam.y = drag.cy + (e.clientY - drag.y);
          S.cam.user = true;
          const g = svg.querySelector("g");
          if (g) g.setAttribute("transform", `translate(${S.cam.x} ${S.cam.y}) scale(${S.cam.k})`);
        });
        svg.addEventListener("pointerup", () => { drag = null; });
        svg.addEventListener("wheel", (e) => {
          e.preventDefault();
          const next = Math.min(1.8, Math.max(0.35, S.cam.k * (e.deltaY > 0 ? 0.9 : 1.1)));
          S.cam.k = next;
          const g = svg.querySelector("g");
          if (g) g.setAttribute("transform", `translate(${S.cam.x} ${S.cam.y}) scale(${S.cam.k})`);
        }, { passive: false });
      }
    }

    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
      if (e.key === "Escape" && S.midMode === "graph") {
        S.midMode = "board";
        S.lastAct = "Esc 回到四列";
        render();
        return;
      }
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        const i = VARIANTS.findIndex(v => v.id === S.variant);
        S.variant = VARIANTS[(i + (e.key === "ArrowRight" ? 1 : VARIANTS.length - 1)) % VARIANTS.length].id;
        S.cam.user = false;
        render();
      }
    });

    loadQS();
    render();
  </script>
</body>
</html>
