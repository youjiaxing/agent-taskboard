<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>一次性原型 · Project 登记、编辑与移除</title>
  <!-- PROTOTYPE — 一次性 UI 原型，不是产品实现。三种 Project 管理入口通过 ?variant=A|B|C 切换。 -->
  <style>
    :root{--side:#f5f5f4;--paper:#fff;--ink:#1c1c1b;--muted:#777773;--line:#e5e5e2;--strong:#cccac5;--sel:#e8e8e5;--danger:#b42318;--warn:#a15c00;--ok:#347c4a;--shadow:0 18px 55px #0002;font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{overflow:hidden;background:#fff}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:#fafaf9;border-radius:8px;padding:6px 10px;cursor:pointer}button:hover{border-color:var(--strong);background:#f4f4f2}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#222220;color:white;border-color:#222220}.danger{color:var(--danger)}.danger.primary{background:var(--danger);color:white;border-color:var(--danger)}.ghost{border-color:transparent;background:transparent}.tiny{font-size:11px;color:var(--muted)}.muted{color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}.dot.warn{background:var(--warn)}.dot.danger{background:var(--danger)}
    .shell{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr);padding-bottom:66px}.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.chrome{height:42px;display:flex;align-items:center;padding:0 12px;gap:8px}.traffic{display:flex;gap:6px}.traffic i{width:11px;height:11px;background:#c8c8c5;border-radius:50%}.brand{font-weight:700;padding:10px 12px 4px}.section-title{padding:12px 12px 6px;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:space-between}.project-row{display:grid;grid-template-columns:22px minmax(0,1fr) 30px;align-items:center;margin:1px 6px;padding:5px 5px;border-radius:7px;position:relative}.project-row.selected{background:var(--sel)}.project-row .folder,.project-row .more{border:0;background:transparent;padding:4px}.project-main{border:0;background:transparent;padding:3px 2px;text-align:left;min-width:0}.project-main b,.project-main span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-main span{font-size:10px;color:var(--muted);margin-top:1px}.project-menu{position:absolute;right:2px;top:35px;width:178px;background:#fff;border:1px solid var(--strong);border-radius:9px;box-shadow:var(--shadow);padding:5px;z-index:8}.project-menu button{display:block;width:100%;border:0;background:transparent;text-align:left}.side-foot{margin-top:auto;padding:8px;border-top:1px solid var(--line)}.side-foot button{width:100%;text-align:left;margin-top:5px}.host-row{margin:0 7px;padding:8px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px}.host-row-copy{flex:1;min-width:0}.host-row-copy b,.host-row-copy div{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title-icon{width:26px;height:26px;padding:0;border-color:transparent;background:transparent;font-size:17px;line-height:1}.title-icon:hover{background:var(--sel);border-color:transparent}.side-manage-row{margin:3px 6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.side-manage-row b,.side-manage-row span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-manage-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:7px}.side-manage-actions button{padding:4px}
    .main{min-width:0;display:flex;flex-direction:column;background:#fff}.top{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px}.top .grow{flex:1}.board-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.board-head h1{font-size:16px;margin:0}.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));background:#f8f8f7;overflow:auto}.lane{border-right:1px solid var(--line);min-width:160px}.lane h2{font-size:11px;color:var(--muted);margin:0;padding:10px;border-bottom:1px solid var(--line);background:#fafaf9}.issue{margin:7px;padding:10px;border:1px solid var(--line);background:#fff;border-radius:9px}.issue b{display:block;margin-bottom:4px}.empty-host{margin:auto;max-width:460px;text-align:center;padding:36px}.empty-host .icon{font-size:38px}.empty-host h1{font-size:20px}.empty-host p{color:var(--muted)}
    .manage-panel{position:fixed;top:0;right:0;bottom:66px;width:min(430px,100vw);background:#fff;border-left:1px solid var(--strong);box-shadow:-20px 0 55px #0002;z-index:12;display:flex;flex-direction:column}.panel-head{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.panel-head h2{font-size:16px;margin:0;flex:1}.manage-list{padding:8px;overflow:auto}.manage-card{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}.manage-card.current{border-color:#888}.manage-card-head{display:flex;gap:8px;align-items:center}.manage-card-head b{flex:1}.manage-card dl{display:grid;grid-template-columns:70px 1fr;gap:3px;margin:8px 0;font-size:11px}.manage-card dt{color:var(--muted)}.manage-card dd{margin:0;overflow:hidden;text-overflow:ellipsis}.manage-actions{display:flex;gap:5px;justify-content:flex-end}
    .modal-bg{position:fixed;inset:0 0 66px;background:#0005;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(510px,100%);max-height:90%;overflow:auto;background:white;border:1px solid var(--strong);border-radius:12px;box-shadow:var(--shadow);padding:17px}.modal h2{margin:0 0 5px;font-size:18px}.modal p{margin:6px 0}.form{display:grid;gap:11px;margin:15px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%;padding:8px;border:1px solid var(--strong);border-radius:8px;background:#fff}.inference{border:1px dashed var(--strong);border-radius:9px;padding:10px;background:#fafaf9}.inference b{font-size:12px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.notice{padding:10px;border-radius:8px;background:#fff7e8;border:1px solid #e6c68b;color:#69420b}.notice.bad{background:#fff0ef;border-color:#efb4af;color:#7b211a}.confirm-line{display:flex;gap:8px;align-items:flex-start;padding:8px 0}.confirm-line input{margin-top:3px}
    .switcher{position:fixed;z-index:40;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px 9px;background:#1d1d1c;color:#fff;border-radius:999px;box-shadow:0 9px 25px #0004;max-width:calc(100vw - 16px)}.switcher button{background:#30302e;color:white;border-color:#474744;border-radius:999px}.switcher .label{white-space:nowrap;font-size:12px}.switcher select{background:#30302e;color:#fff;border:1px solid #474744;border-radius:999px;padding:5px}
    .inspector{position:fixed;right:12px;bottom:66px;width:300px;max-height:210px;overflow:auto;z-index:10;background:#1d1d1c;color:#d6f5dd;border-radius:9px;box-shadow:var(--shadow);font:10px/1.4 ui-monospace,monospace;padding:9px;white-space:pre-wrap}.inspector summary{cursor:pointer;color:white;font:11px -apple-system,sans-serif}
    .phone-wrap{height:100%;padding:16px 14px 72px;background:#ececea;display:flex;justify-content:center}.phone{width:390px;max-width:100%;height:100%;background:#fff;border:1px solid var(--strong);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}.phone-head{padding:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.phone-current{flex:1;min-width:0}.phone-current b,.phone-current span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phone-current span{font-size:10px;color:var(--muted)}.phone-body{flex:1;overflow:auto;background:#f7f7f6}.scope{margin:10px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0001}.scope-title{padding:11px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.scope-title b{flex:1}.scope-project{display:grid;grid-template-columns:minmax(0,1fr) 34px;align-items:center;padding:7px;border-bottom:1px solid var(--line)}.scope-project .project-main{padding:6px}.scope-actions{padding:10px;display:flex;gap:6px}.scope-actions button{flex:1}.phone-section{padding:11px}.phone-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px}.phone-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line)}.phone-tabs button{border:0;border-radius:0;padding:11px}.empty-phone{text-align:center;padding:38px 20px}.mobile-menu{position:fixed;right:30px;top:120px;width:180px;background:white;border:1px solid var(--strong);border-radius:9px;box-shadow:var(--shadow);padding:5px;z-index:9}.mobile-menu button{width:100%;text-align:left;border:0;background:transparent}
    @media(max-width:760px){.inspector{display:none}.board{grid-template-columns:1fr}.shell{display:none}}
  </style>
</head>
<body><div id="app"></div>
<script>
const VARIANTS={A:{name:"行尾原生菜单",note:"每个 Project 行尾的 … 就地管理；最像 Codex Desktop。"},B:{name:"固定管理入口",note:"侧栏底部固定“管理 Project”，清单行只负责切换。"},C:{name:"独立管理面",note:"Project 清单标题进入独立管理抽屉，信息最完整。"}};
const seedProjects=()=>[
 {id:"tb",name:"agent-taskboard",path:"/Users/you/Code/agent-taskboard",tracker:"GitHub",connection:"you/agent-taskboard",state:"normal",run:"none"},
 {id:"garden",name:"garden-notes",path:"/Users/you/Notes/garden",tracker:"local markdown",connection:".scratch/issues",state:"normal",run:"stopped"},
 {id:"shop",name:"shop-api",path:"D:\\Code\\shop-api",tracker:"GitLab",connection:"gitlab.example.com/commerce/shop-api",state:"normal",run:"active"},
 {id:"fresh",name:"new-catalog",path:"/Users/you/Code/new-catalog",tracker:"GitHub",connection:"you/new-catalog",state:"unpulled",run:"none"}
];
const S={variant:"A",phone:false,scenario:"daily",projects:seedProjects(),projectId:"tb",menu:null,scope:false,manage:false,modal:null,draft:null,inferred:null,stoppedAck:false,lastEvent:"原型载入"};
const app=document.querySelector("#app");
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function project(id=S.projectId){return S.projects.find(p=>p.id===id)}
function statusText(p){if(p.run==="active")return "有活跃 Run";if(p.run==="stopped")return "执行已停 · 认领仍在";if(p.state==="unpulled")return "Tracker 尚未成功拉取";return `${p.tracker} · 已连接`}
function statusClass(p){return p.run==="active"?"danger":(p.run==="stopped"||p.state==="unpulled")?"warn":""}
function setUrl(){const q=new URLSearchParams(location.search);q.set("variant",S.variant);q.set("scenario",S.scenario);if(S.phone)q.set("viewport","phone");else q.delete("viewport");history.replaceState(null,"",`?${q}`)}
function selectProject(id){S.projectId=id;S.menu=null;S.scope=false;S.lastEvent=`切换到 ${project()?.name}`;render()}
function projectRow(p,mobile=false){const controls=S.variant==="A"||mobile?`<button class="more ghost" data-act="menu" data-id="${p.id}" aria-label="管理 ${esc(p.name)}">•••</button>`:`<span></span>`;return `<div class="project-row ${p.id===S.projectId?"selected":""}"><button class="folder ghost" data-act="select" data-id="${p.id}" aria-label="打开 ${esc(p.name)}">▱</button><button class="project-main" data-act="select" data-id="${p.id}"><b>${esc(p.name)}</b><span><i class="dot ${statusClass(p)}"></i> ${esc(statusText(p))}</span></button>${controls}${S.menu===p.id&&!mobile?menu(p):""}</div>`}
function menu(p){return `<div class="project-menu"><button data-act="edit" data-id="${p.id}">编辑登记…</button><button class="danger" data-act="remove" data-id="${p.id}">移除 Project…</button></div>`}
function sidebar(){
  const rows=S.variant==="B"
    ? S.projects.map(p=>`<div class="side-manage-row ${p.id===S.projectId?"selected":""}"><button class="project-main" data-act="select" data-id="${p.id}"><b>${esc(p.name)}</b><span><i class="dot ${statusClass(p)}"></i> ${esc(statusText(p))}</span></button><div class="side-manage-actions"><button data-act="edit" data-id="${p.id}">编辑</button><button class="danger" data-act="remove" data-id="${p.id}">移除</button></div></div>`).join("")
    : S.projects.map(p=>projectRow(p)).join("");
  const projectTitleAction=S.variant==="C"
    ? `<button class="title-icon" data-act="manage" aria-label="管理 Project" title="管理 Project">⚙</button>`
    : `<button class="title-icon" data-act="register" aria-label="登记 Project" title="登记 Project">＋</button>`;
  const footer=S.variant==="B"
    ? `<button data-act="register">＋ 登记 Project</button>`
    : S.variant==="C" ? `<button data-act="manage">▤ 打开 Project 管理</button>` : "";
  return `<aside class="side">
    <div class="chrome"><span class="traffic"><i></i><i></i><i></i></span></div>
    <div class="brand">Agent Taskboard</div>
    <div class="host-row"><div class="host-row-copy"><b>我的 MacBook</b><div class="tiny"><i class="dot"></i> 本机 Host</div></div><button class="title-icon" data-act="pair" aria-label="配对 Host" title="配对 Host">⊕</button></div>
    <div class="section-title"><span>${S.variant==="B"?"PROJECT 管理":"PROJECT"}</span>${projectTitleAction}</div>
    ${rows||`<div class="tiny" style="padding:12px">这个 Host 尚未登记 Project。</div>`}
    ${footer?`<div class="side-foot">${footer}</div>`:""}
  </aside>`;
}
function board(){const p=project();if(!p)return `<main class="main"><div class="top"><b>我的 MacBook</b></div><div class="empty-host"><div class="icon">▱</div><h1>这个 Host 上还没有 Project</h1><p>先登记一个本地目录，并明确选择 Issue Tracker。配对 Host 是另一件事。</p><button class="primary" data-act="register">登记第一个 Project</button><button data-act="pair">配对另一个 Host</button></div></main>`;return `<main class="main"><div class="top"><span class="dot"></span><b>我的 MacBook</b><span class="grow"></span><button>⌕ 搜索</button><button>？</button></div><div class="board-head"><span>▱</span><h1>${esc(p.name)}</h1><span class="muted">${esc(p.tracker)} · ${esc(p.connection)}</span><span style="flex:1"></span>${S.variant==="C"?`<button data-act="manage">管理 Project</button>`:""}</div><div class="board"><div class="lane"><h2>阻塞中 · 2</h2><div class="issue"><b>#51 依赖图布局</b><span class="tiny">被 #50 挡住</span></div></div><div class="lane"><h2>Frontier · 3</h2><div class="issue"><b>#37 Project 登记流程</b><span class="tiny">ready-for-human</span></div><div class="issue"><b>#45 编写 v1 规格</b><span class="tiny">ready-for-agent</span></div></div><div class="lane"><h2>进行中 · ${p.run==="active"?1:0}</h2>${p.run==="active"?`<div class="issue"><b>#88 支付回调</b><span class="tiny">Codex · Run 活跃</span></div>`:`<div class="tiny" style="padding:12px">没有活跃 Run</div>`}</div><div class="lane"><h2>最近完成 · 5</h2><div class="issue"><b>#42 用量遥测原型</b><span class="tiny">今天</span></div></div></div></main>`}
function managePanel(){if(!S.manage)return "";return `<section class="manage-panel" role="dialog" aria-label="Project 管理"><div class="panel-head"><h2>Project 管理</h2><button data-act="register">＋ 登记</button><button data-act="close-manage" aria-label="关闭">×</button></div><div class="manage-list"><p class="muted">管理“我的 MacBook”上的本地目录与 Issue Tracker 登记。配对 Host 不在这里。</p>${S.projects.map(p=>`<article class="manage-card ${p.id===S.projectId?"current":""}"><div class="manage-card-head"><i class="dot ${statusClass(p)}"></i><b>${esc(p.name)}</b>${p.id===S.projectId?`<span class="tiny">当前</span>`:""}</div><dl><dt>本地目录</dt><dd>${esc(p.path)}</dd><dt>Tracker</dt><dd>${esc(p.tracker)}</dd><dt>连接</dt><dd>${esc(p.connection)}</dd><dt>状态</dt><dd>${esc(statusText(p))}</dd></dl><div class="manage-actions"><button data-act="select" data-id="${p.id}">打开</button><button data-act="edit" data-id="${p.id}">编辑</button><button class="danger" data-act="remove" data-id="${p.id}">移除</button></div></article>`).join("")||`<div class="empty-host"><p>尚未登记 Project。</p><button class="primary" data-act="register">登记第一个</button></div>`}</div></section>`}
function formModal(){const editing=S.modal?.kind==="edit";if(!(S.modal?.kind==="register"||editing))return "";const d=S.draft;return `<div class="modal-bg"><form class="modal" data-form="project"><h2>${editing?"编辑 Project 登记":"登记 Project"}</h2><p class="muted">Project 是这台 Host 上的“本地目录 + Issue Tracker”登记。手动填写是正式路径。</p><div class="form"><div class="field"><label>显示名称</label><input name="name" aria-label="显示名称" required value="${esc(d.name)}"></div><div class="field"><label>本地目录</label><input name="path" aria-label="本地目录" required value="${esc(d.path)}" placeholder="/Users/me/Code/project"></div><div class="field"><label>Issue Tracker 类型</label><select name="tracker" aria-label="Issue Tracker 类型"><option ${d.tracker==="GitHub"?"selected":""}>GitHub</option><option ${d.tracker==="GitLab"?"selected":""}>GitLab</option><option ${d.tracker==="local markdown"?"selected":""}>local markdown</option></select></div><div class="field"><label>连接信息</label><input name="connection" aria-label="连接信息" required value="${esc(d.connection)}" placeholder="owner/repo、GitLab 地址或 issues 目录"></div></div><div class="inference"><b>可选快捷输入</b><p class="tiny">Host 可以从所填目录推断 git remote 和 Tracker；推断结果不会自动写入，必须由你确认采用。</p><button type="button" data-act="infer">从本地目录推断</button>${S.inferred?`<div class="notice" style="margin-top:8px">发现 <b>${esc(S.inferred.tracker)} · ${esc(S.inferred.connection)}</b><br><button type="button" data-act="apply-infer">使用这份推断结果</button></div>`:""}</div><div class="actions"><button type="button" data-act="close-modal">取消</button><button class="primary" type="submit">${editing?"保存登记":"登记 Project"}</button></div></form></div>`}
function removeModal(){if(S.modal?.kind!=="remove")return "";const p=S.modal.project;if(p.run==="active")return `<div class="modal-bg"><div class="modal"><h2>现在不能移除 ${esc(p.name)}</h2><div class="notice bad"><b>这个 Project 有活跃 Run。</b><br>先停止或结束 Run，再回来移除。关闭 Client 或切换 Project 都不会停止 Run。</div><p class="tiny">本次没有改变 Project 登记。</p><div class="actions"><button class="primary" data-act="close-modal">知道了</button></div></div></div>`;const stopped=p.run==="stopped";const unpulled=p.state==="unpulled";return `<div class="modal-bg"><div class="modal"><h2>从“我的 MacBook”移除 ${esc(p.name)}？</h2><div class="notice"><b>只取消这台 Host 上的登记。</b><br>不会删除本地目录、git 仓库，也不会删除 GitHub、GitLab 或本地 markdown 中的任何 Issue。</div>${stopped?`<div class="notice bad"><b>这个 Project 有“执行已停”的 Run。</b><br>移除后本机 Run 记录不再从这个 Project 进入；Tracker 上现有认领不会自动释放，请先确认后续由谁处理。<label class="confirm-line"><input type="checkbox" data-act="stopped-ack" ${S.stoppedAck?"checked":""}><span>我知道 Tracker 上的认领仍会保留</span></label></div>`:""}${unpulled?`<p class="notice">这个 Project 尚未成功拉取 Tracker 数据。仍可移除，因为移除只处理本机登记。</p>`:""}<p class="tiny">若移除当前 Project，将自动打开此 Host 上下一项；若没有剩余项，则回到空 Host。</p><div class="actions"><button data-act="close-modal">取消</button><button class="danger primary" data-act="confirm-remove" ${stopped&&!S.stoppedAck?"disabled":""}>只移除登记</button></div></div></div>`}
function phone(){const p=project();return `<div class="phone-wrap"><div class="phone"><header class="phone-head"><span>▱</span><div class="phone-current"><b>${p?esc(p.name):"我的 MacBook"}</b><span>${p?`本机 · 我的 MacBook · ${esc(p.tracker)}`:"这个 Host 尚无 Project"}</span></div><button data-act="scope">${S.scope?"收起":"切换"}</button></header><div class="phone-body">${S.scope?phoneScope():""}${p?`<div class="phone-section"><article class="phone-card"><b>进行中</b><p>${p.run==="active"?"#88 支付回调 · Run 活跃":"没有活跃 Run"}</p></article><article class="phone-card"><b>Frontier</b><p>#37 Project 登记、编辑与移除流程</p><p>#45 编写 v1 规格</p></article></div>`:`<div class="empty-phone"><h2>这个 Host 上还没有 Project</h2><p class="muted">从“切换范围”里登记第一个 Project；不会在顶部平铺所有清单。</p><button class="primary" data-act="scope">打开切换范围</button></div>`}</div><nav class="phone-tabs"><button>看板</button><button>Issue</button><button>Run</button></nav></div></div>${mobileMenu()}`}
function phoneScope(){return `<section class="scope"><div class="scope-title"><b>切换范围</b><span class="tiny">我的 MacBook</span></div>${S.projects.map(p=>`<div class="scope-project"><button class="project-main" data-act="select" data-id="${p.id}"><b>${esc(p.name)}</b><span>${esc(statusText(p))}</span></button><button class="ghost" data-act="menu" data-id="${p.id}" aria-label="管理 ${esc(p.name)}">•••</button></div>`).join("")||`<p class="muted" style="padding:12px">这个 Host 尚未登记 Project。</p>`}<div class="scope-actions"><button class="primary" data-act="register">＋ 登记 Project</button><button data-act="pair">＋ 配对 Host</button></div><p class="tiny" style="padding:0 10px 10px">登记、编辑和移除留在切换范围内；顶栏只显示当前范围。</p></section>`}
function mobileMenu(){if(!S.phone||!S.menu)return "";const p=S.projects.find(x=>x.id===S.menu);return `<div class="mobile-menu"><button data-act="edit" data-id="${p.id}">编辑 ${esc(p.name)}</button><button class="danger" data-act="remove" data-id="${p.id}">移除 Project…</button></div>`}
function switcher(){return `<div class="switcher"><button data-act="prev" aria-label="上一个方案">←</button><span class="label"><b>${S.variant}</b> · ${VARIANTS[S.variant].name}</span><button data-act="next" aria-label="下一个方案">→</button><select data-act="scenario" aria-label="原型场景"><option value="daily" ${S.scenario==="daily"?"selected":""}>多个 Project</option><option value="empty-host" ${S.scenario==="empty-host"?"selected":""}>空 Host</option></select><button data-act="viewport">${S.phone?"桌面":"手机"}</button></div>`}
function inspector(){const safe={variant:S.variant,variantQuestion:VARIANTS[S.variant].note,viewport:S.phone?"phone-390":"desktop",scenario:S.scenario,currentProjectId:S.projectId,projects:S.projects.map(p=>({id:p.id,name:p.name,path:p.path,tracker:p.tracker,connection:p.connection,trackerState:p.state,runState:p.run})),open:{menu:S.menu,scope:S.scope,manage:S.manage,modal:S.modal?.kind||null},lastEvent:S.lastEvent};return `<details class="inspector" open><summary>原型状态（内存）</summary>${esc(JSON.stringify(safe,null,2))}</details>`}
function render(){setUrl();app.innerHTML=(S.phone?phone():`<div class="shell">${sidebar()}${board()}</div>`)+managePanel()+formModal()+removeModal()+inspector()+switcher()}
function openForm(kind,id){const p=S.projects.find(x=>x.id===id);S.modal={kind,id};S.draft=p?{...p}:{name:"",path:"",tracker:"GitHub",connection:""};S.inferred=null;S.menu=null;render()}
function openRemove(id){const p=S.projects.find(x=>x.id===id);S.modal={kind:"remove",project:{...p}};S.stoppedAck=false;S.menu=null;render()}
function applyScenario(v){S.scenario=v;S.projects=v==="empty-host"?[]:seedProjects();S.projectId=S.projects[0]?.id||null;S.menu=null;S.manage=false;S.modal=null;S.scope=S.phone&&v==="empty-host";S.lastEvent=`切换场景：${v}`;render()}
function step(n){const ks=Object.keys(VARIANTS),i=ks.indexOf(S.variant);S.variant=ks[(i+n+ks.length)%ks.length];S.menu=null;S.manage=S.variant==="C"&&S.manage;S.lastEvent=`切换方案 ${S.variant}`;render()}
app.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;if(a==="select")selectProject(id);else if(a==="menu"){S.menu=S.menu===id?null:id;render()}else if(a==="register")openForm("register");else if(a==="edit")openForm("edit",id);else if(a==="remove")openRemove(id);else if(a==="close-modal"){S.modal=null;S.inferred=null;render()}else if(a==="manage"){S.manage=true;S.menu=null;render()}else if(a==="close-manage"){S.manage=false;render()}else if(a==="scope"){S.scope=!S.scope;S.menu=null;render()}else if(a==="infer"){const form=app.querySelector('[data-form="project"]'),fd=new FormData(form),path=fd.get("path")||"/Users/you/Code/inferred-project";S.draft={...S.draft,name:fd.get("name"),path,tracker:fd.get("tracker"),connection:fd.get("connection")};S.inferred={tracker:"GitHub",connection:`you/${path.split(/[\\/]/).filter(Boolean).pop()||"project"}`};render()}else if(a==="apply-infer"){const tr=app.querySelector('[name="tracker"]'),co=app.querySelector('[name="connection"]');tr.value=S.inferred.tracker;co.value=S.inferred.connection;S.lastEvent="人确认采用推断结果"}else if(a==="stopped-ack"){S.stoppedAck=b.checked;render()}else if(a==="confirm-remove"){const id=S.modal.project.id,name=S.modal.project.name,wasCurrent=id===S.projectId,index=S.projects.findIndex(p=>p.id===id);S.projects.splice(index,1);if(wasCurrent)S.projectId=S.projects[Math.min(index,S.projects.length-1)]?.id||null;S.modal=null;S.lastEvent=`移除 ${name}；当前回退到 ${project()?.name||"空 Host"}`;render()}else if(a==="prev")step(-1);else if(a==="next")step(1);else if(a==="viewport"){S.phone=!S.phone;S.scope=S.phone;S.menu=null;S.manage=false;S.modal=null;S.lastEvent=`切换到 ${S.phone?"手机":"桌面"}`;render()}else if(a==="pair")alert("配对 Host 是独立流程，不属于 Project 登记，也不放进设置。");};
app.onchange=e=>{if(e.target.dataset.act==="scenario")applyScenario(e.target.value)};
app.onsubmit=e=>{if(!e.target.matches('[data-form="project"]'))return;e.preventDefault();const fd=new FormData(e.target),data={name:fd.get("name"),path:fd.get("path"),tracker:fd.get("tracker"),connection:fd.get("connection")};if(S.modal.kind==="edit"){const p=S.projects.find(x=>x.id===S.modal.id);Object.assign(p,data);S.lastEvent=`保存 ${p.name} 的登记`;}else{const id=`p${Date.now()}`;S.projects.push({id,...data,state:"normal",run:"none"});S.projectId=id;S.lastEvent=`登记 ${data.name} 并设为当前 Project`;}S.modal=null;S.inferred=null;render()};
document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);if(e.key==="Escape"){S.modal=null;S.manage=false;S.menu=null;render()}});
(function load(){const q=new URLSearchParams(location.search);if(VARIANTS[q.get("variant")])S.variant=q.get("variant");S.phone=q.get("viewport")==="phone";if(q.get("scenario")==="empty-host"){S.scenario="empty-host";S.projects=[];S.projectId=null;S.scope=S.phone}render()})();
</script></body></html>
