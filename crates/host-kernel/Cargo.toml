[package]
name = "host-kernel"
version = "0.1.0"
edition = "2021"
description = "Agent Taskboard Host 内核"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
portable-pty = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
